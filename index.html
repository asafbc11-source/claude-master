<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C96442" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171310" media="(prefers-color-scheme: dark)">
<meta name="description" content="קורס מקיף בעברית לשליטה מקצועית בקלוד — מאפס ועד רמת מומחה">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="קלוד מאסטר">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>קלוד מאסטר — לומדים קלוד מאפס</title>
<style>
:root{
  --bg:#faf6f2; --bg2:#ffffff; --bg3:#f3ece4; --bg4:#ece1d5; --ink:#2d2420; --ink2:#6b5d54; --ink3:#9a8b80;
  --brand:#C96442; --brand2:#a94f31; --brand-soft:#f7e4db; --accent:#7c5cbf; --accent-soft:#ece5f8;
  --ok:#2e7d4f; --ok-soft:#dff0e5; --warn:#b3541e; --warn-soft:#fdeeda; --err:#c0392b; --err-soft:#fde3df;
  --gold:#c9962b; --gold-soft:#fbf0d4;
  --line:#e8ddd3; --shadow:0 1px 3px rgba(60,40,20,.07),0 4px 16px rgba(60,40,20,.06);
  --shadow-lg:0 4px 12px rgba(60,40,20,.10),0 12px 32px rgba(60,40,20,.10);
  --code-bg:#221c19; --code-ink:#f5e9dd; --code-dim:#9c8b7d;
  --r:18px; --rs:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171310; --bg2:#211b17; --bg3:#2a221d; --bg4:#352b24; --ink:#f0e7df; --ink2:#b5a698; --ink3:#84766b;
  --brand:#e08a66; --brand2:#eda583; --brand-soft:#3a2a22; --accent:#a98fe0; --accent-soft:#2e2740;
  --ok:#6cc493; --ok-soft:#1e2f26; --warn:#e09a5c; --warn-soft:#33271a; --err:#e57d70; --err-soft:#3a211e;
  --gold:#e5c264; --gold-soft:#332a16;
  --line:#3a2f28; --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --shadow-lg:0 4px 12px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.4);
  --code-bg:#0f0c0a; --code-ink:#e8dccf; --code-dim:#7d6f63;
}}
:root[data-theme="dark"]{
  --bg:#171310; --bg2:#211b17; --bg3:#2a221d; --bg4:#352b24; --ink:#f0e7df; --ink2:#b5a698; --ink3:#84766b;
  --brand:#e08a66; --brand2:#eda583; --brand-soft:#3a2a22; --accent:#a98fe0; --accent-soft:#2e2740;
  --ok:#6cc493; --ok-soft:#1e2f26; --warn:#e09a5c; --warn-soft:#33271a; --err:#e57d70; --err-soft:#3a211e;
  --gold:#e5c264; --gold-soft:#332a16;
  --line:#3a2f28; --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --shadow-lg:0 4px 12px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.4);
  --code-bg:#0f0c0a; --code-ink:#e8dccf; --code-dim:#7d6f63;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:"Segoe UI","Heebo","Noto Sans Hebrew",-apple-system,Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.65; font-size:16.5px;
  min-height:100dvh; overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
}
#app{max-width:780px;margin:0 auto;padding:calc(60px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));min-height:100dvh}
body.has-voice #app{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:200;background:linear-gradient(150deg,var(--brand) 0%,var(--brand2) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:32px;text-align:center}
#splash.hide{animation:splashOut .5s ease forwards}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
#splash .logo{width:112px;height:112px;margin-bottom:18px;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
#splash .logo svg{width:100%;height:100%;filter:drop-shadow(0 4px 18px rgba(0,0,0,.22))}
#splash .wordmark{font-size:13.5px;font-weight:800;letter-spacing:3.5px;opacity:.85;margin-bottom:6px;text-transform:uppercase}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
#splash h1{font-size:30px;margin-bottom:8px}
#splash p{opacity:.9;font-size:16px;max-width:340px;margin-bottom:26px;line-height:1.6}
#splash .feats{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;text-align:right;width:100%;max-width:330px}
#splash .feat{background:rgba(255,255,255,.15);border-radius:14px;padding:11px 15px;font-size:14.5px;display:flex;gap:10px;align-items:center}
/* ---------- App bar ---------- */
.appbar{position:fixed;top:0;right:0;left:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.appbar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:6px;height:60px;padding:0 10px}
.appbar .title{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.iconbtn{border:none;background:none;color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:20px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s}
.iconbtn:active{background:var(--bg3)}
.pts{display:flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand);font-weight:800;
  font-size:13.5px;border-radius:99px;padding:5px 11px;flex:none}
.streak{display:flex;align-items:center;gap:3px;background:var(--warn-soft);color:var(--warn);font-weight:800;
  font-size:13.5px;border-radius:99px;padding:5px 10px;flex:none}
/* ---------- Bottom nav ---------- */
.bnav{position:fixed;bottom:0;right:0;left:0;z-index:45;background:color-mix(in srgb,var(--bg2) 90%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav-in{max-width:780px;margin:0 auto;display:flex}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;text-decoration:none;
  color:var(--ink3);font-size:11px;font-weight:700;transition:color .15s}
.bnav a .bi{font-size:21px;line-height:1;transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
.bnav a.on{color:var(--brand)}
.bnav a.on .bi{transform:translateY(-2px) scale(1.15)}
/* ---------- Cards ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.screen{animation:in .3s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:24px;line-height:1.3;margin-bottom:6px}
h2{font-size:19px;margin:8px 0}
.sub{color:var(--ink2);font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:inherit;
  font-size:16px;font-weight:700;border-radius:15px;padding:13px 22px;background:var(--brand);color:#fff;
  transition:transform .12s,opacity .15s,box-shadow .15s;text-decoration:none;box-shadow:0 2px 8px rgba(201,100,66,.25)}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--bg3);color:var(--ink);box-shadow:none}
.btn.ghost{background:none;color:var(--brand);padding:9px 14px;box-shadow:none}
.btn.wide{width:100%}
.btn.sm{font-size:14px;padding:9px 16px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:99px;padding:3px 11px}
.chip.pc{background:var(--accent-soft);color:var(--accent)}
.chip.ph{background:var(--ok-soft);color:var(--ok)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.lvl{background:var(--bg3);color:var(--ink2)}
.chip.pay{background:var(--warn-soft);color:var(--warn)}
.costbar{display:flex;align-items:center;gap:10px;background:var(--ok-soft);border-radius:var(--rs);
  padding:11px 14px;margin-bottom:14px;font-size:14px;line-height:1.5}
.costbar.pay{background:var(--warn-soft)}
.costbar .ci{font-size:20px;flex:none}
.filterrow{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);
  border-radius:var(--rs);padding:11px 14px;margin-bottom:14px;cursor:pointer;font-size:14.5px}
.filterrow .fdesc{flex:1;min-width:0}
.filterrow .fdesc b{display:block;font-size:14.5px}
.filterrow .fdesc span{font-size:12.5px;color:var(--ink2)}
.switch{width:46px;height:27px;border-radius:99px;background:var(--bg4);flex:none;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(-19px)}
.progress-bar{height:7px;border-radius:99px;background:var(--bg3);overflow:hidden}
.progress-bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .6s cubic-bezier(.2,.8,.3,1)}
.progress-bar.ok>i{background:var(--ok)}
/* ---------- Home ---------- */
.hero{background:linear-gradient(140deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;border:none;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero::after{content:"";position:absolute;top:-40%;left:-10%;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .sub{color:rgba(255,255,255,.88)}
.hero h1{color:#fff;position:relative}
.ring-wrap{display:flex;align-items:center;gap:16px;position:relative}
.ring{width:76px;height:76px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring text{transform:rotate(90deg)}
.sect-h{display:flex;align-items:center;gap:8px;margin:20px 4px 10px;font-size:15px;font-weight:800;color:var(--ink2)}
.sect-h::after{content:"";flex:1;height:1px;background:var(--line)}
.modcard{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;cursor:pointer;transition:transform .12s}
.modcard:active{transform:scale(.985)}
.modcard .mi{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;background:var(--bg3)}
.modcard .mtx{flex:1;min-width:0}
.modcard .mtx b{display:block;font-size:16px;margin-bottom:2px}
.modcard .mtx .sub{font-size:13px;margin-bottom:7px}
.modcard .arr{color:var(--ink3);font-size:18px;flex:none;transform:scaleX(-1)}
/* ---------- Tabs ---------- */
.tabs{display:flex;background:var(--bg3);border-radius:15px;padding:4px;margin-bottom:16px;gap:2px}
.tabs button{flex:1;border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:700;padding:9px 2px;
  border-radius:12px;color:var(--ink2);cursor:pointer;transition:background .15s,color .15s}
.tabs button.on{background:var(--bg2);color:var(--brand);box-shadow:var(--shadow)}
/* ---------- Rows ---------- */
.row{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer}
.row:last-child{border-bottom:none}
.row .st{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;background:var(--bg3);color:var(--ink3)}
.row.done .st{background:var(--ok-soft);color:var(--ok)}
.row .rtx{flex:1;min-width:0}
.row .rtx b{font-size:15.5px;display:block}
.row .rtx .sub{font-size:12.5px}
/* ---------- Lesson ---------- */
.lesson{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 20px;font-size:16.5px}
.lesson h2{font-size:20px;margin:24px 0 8px;color:var(--brand)}
.lesson h2:first-child{margin-top:0}
.lesson h3{font-size:17px;margin:18px 0 6px}
.lesson p{margin:0 0 12px}
.lesson ul,.lesson ol{margin:0 0 14px;padding-right:22px}
.lesson li{margin-bottom:6px}
.lesson .term{color:var(--brand);font-weight:800}
.lesson .en{color:var(--ink3);font-size:.85em;font-weight:400}
.box{border-radius:var(--rs);padding:13px 15px;margin:0 0 14px;font-size:15.5px}
.box b:first-child{display:block;margin-bottom:3px}
.box.tip{background:var(--ok-soft)}
.box.warn{background:var(--warn-soft)}
.box.info{background:var(--accent-soft)}
.box.try{background:var(--brand-soft);border:1.5px dashed var(--brand)}
.box.pro{background:var(--gold-soft);border-right:4px solid var(--gold)}
.code{direction:ltr;text-align:left;background:var(--code-bg);color:var(--code-ink);border-radius:var(--rs);padding:13px 15px;
  margin:0 0 14px;font-family:Consolas,"Courier New",monospace;font-size:14px;overflow-x:auto;white-space:pre;line-height:1.6}
.prompt-ex{background:var(--bg3);border-right:4px solid var(--brand);border-radius:var(--rs);padding:12px 14px;margin:0 0 14px;font-size:15.5px}
.prompt-ex .pl{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.4px;margin-bottom:4px}
.kbd{display:inline-block;direction:ltr;background:var(--bg3);border:1px solid var(--line);border-bottom-width:2.5px;
  border-radius:6px;padding:1px 8px;font-family:Consolas,monospace;font-size:.85em;font-weight:700}
table.cmp{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:14.5px}
table.cmp th{background:var(--bg3);text-align:right;padding:8px 10px;border:1px solid var(--line)}
table.cmp td{padding:8px 10px;border:1px solid var(--line);vertical-align:top}
.tbl-wrap{overflow-x:auto;margin:0 0 14px;-webkit-overflow-scrolling:touch}
.tbl-wrap table.cmp{margin:0;min-width:460px}
.lesson-nav{display:flex;gap:10px;margin-top:16px}
.lesson-nav .btn{flex:1}
/* ---------- Ask-Claude buttons on prompt examples ---------- */
.px-bar{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.px-btn{border:none;background:var(--brand);color:#fff;border-radius:9px;padding:5px 12px;font-family:inherit;
  font-size:12.5px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.px-btn.sec{background:var(--bg4);color:var(--ink2)}
.px-btn:active{transform:scale(.95)}
/* ---------- Chat drawer ---------- */
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:16px;z-index:46;width:54px;height:54px;
  border-radius:50%;border:none;background:var(--brand);color:#fff;font-size:24px;cursor:pointer;
  box-shadow:0 4px 16px rgba(201,100,66,.42);display:flex;align-items:center;justify-content:center;
  transition:transform .18s cubic-bezier(.2,1.4,.4,1)}
.fab:active{transform:scale(.9)}
body.has-voice .fab{bottom:calc(150px + env(safe-area-inset-bottom))}
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(20,12,8,.45);backdrop-filter:blur(3px);animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-in{background:var(--bg);width:100%;max-width:780px;height:88dvh;border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;overflow:hidden;animation:up .28s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet-head b{flex:1;font-size:16.5px}
.sheet-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sheet-foot{flex:none;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.sheet-foot textarea{flex:1;font-family:inherit;font-size:16px;background:var(--bg2);border:1.5px solid var(--line);
  border-radius:14px;padding:10px 13px;color:var(--ink);resize:none;max-height:120px;line-height:1.5}
.sheet-foot textarea:focus{outline:none;border-color:var(--brand)}
.send{border:none;background:var(--brand);color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;
  cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.send[disabled]{opacity:.4}
.cmsg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:15.5px;line-height:1.65;margin-bottom:10px;
  white-space:pre-wrap;word-break:break-word;animation:in .22s ease}
.cmsg.me{background:var(--brand);color:#fff;margin-inline-start:auto;border-bottom-right-radius:5px}
.cmsg.ai{background:var(--bg2);border:1px solid var(--line);border-bottom-left-radius:5px}
.cmsg.err{background:var(--err-soft);color:var(--err);font-size:14.5px}
.cmsg .code{margin:8px 0;font-size:13px}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink3);margin-inline-end:3px;
  animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.keyform{max-width:460px;margin:0 auto}
.keyform input{width:100%;font-family:Consolas,monospace;font-size:14px;direction:ltr;text-align:left;
  background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);margin-bottom:10px}
.keyform input:focus{outline:none;border-color:var(--brand)}
.suggest{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.suggest button{border:1px solid var(--line);background:var(--bg2);color:var(--ink2);border-radius:99px;
  padding:7px 13px;font-family:inherit;font-size:13px;cursor:pointer}
.suggest button:active{background:var(--bg3)}
.devinfo{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:14.5px;margin-top:8px}
.devinfo dt{color:var(--ink2)}
.devinfo dd{font-weight:700}
/* ---------- How-to (setup guide) ---------- */
.howto{border:1.5px solid var(--brand);border-radius:var(--rs);margin:0 0 16px;overflow:hidden;background:var(--bg2)}
.howto>b{display:block;background:var(--brand-soft);color:var(--brand);padding:10px 14px;font-size:15px}
.ht-in{padding:13px 14px 12px}
.ht-req{font-size:13.5px;color:var(--ink2);background:var(--bg3);border-radius:9px;padding:8px 12px;margin-bottom:11px;line-height:1.55}
.ht-steps{counter-reset:h;list-style:none;padding:0;margin:0 0 11px}
.ht-steps li{counter-increment:h;position:relative;padding:0 33px 11px 0;font-size:15px;line-height:1.6}
.ht-steps li:last-child{padding-bottom:2px}
.ht-steps li::before{content:counter(h);position:absolute;right:0;top:2px;width:23px;height:23px;border-radius:50%;
  background:var(--brand);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ht-check{background:var(--ok-soft);border-radius:9px;padding:9px 12px;font-size:14.5px;margin-bottom:8px;line-height:1.55}
.ht-fix{background:var(--warn-soft);border-radius:9px;padding:9px 12px;font-size:14.5px;line-height:1.55}
.howto .code{margin:6px 0 8px;font-size:13px}

/* ---------- Demos ---------- */
.demo{border:1.5px solid var(--line);border-radius:var(--rs);overflow:hidden;margin:0 0 16px;background:var(--bg3)}
.demo-head{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--bg4);font-size:13.5px;font-weight:800;color:var(--ink2)}
.demo-head .dt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-play{border:none;background:var(--brand);color:#fff;border-radius:9px;padding:5px 13px;font-family:inherit;
  font-size:12.5px;font-weight:800;cursor:pointer;flex:none}
.demo-play:active{transform:scale(.95)}
.termbox{direction:ltr;text-align:left;background:var(--code-bg);color:var(--code-ink);padding:13px 15px;
  font-family:Consolas,"Courier New",monospace;font-size:13.5px;line-height:1.7;min-height:80px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.termbox .c-cmd{color:#8fd4ff}.termbox .c-ok{color:#8ce0a8}.termbox .c-err{color:#ff9d8f}
.termbox .c-out{color:var(--code-dim)}.termbox .c-note{color:#e5c264;font-style:italic}
.termbox .cur{display:inline-block;width:8px;height:15px;background:var(--code-ink);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chat{padding:13px;display:flex;flex-direction:column;gap:9px;min-height:80px;background:var(--bg2)}
.bub{max-width:88%;padding:9px 13px;border-radius:15px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;animation:in .25s ease}
.bub.u{background:var(--brand);color:#fff;align-self:flex-start;border-bottom-right-radius:5px}
.bub.c{background:var(--bg3);color:var(--ink);align-self:flex-end;border-bottom-left-radius:5px}
.bub.t{background:var(--accent-soft);color:var(--accent);align-self:flex-end;font-family:Consolas,monospace;font-size:12.5px;direction:ltr;text-align:left}
.flow{padding:13px;background:var(--bg2)}
.fstep{display:flex;gap:11px;align-items:flex-start;padding:10px 11px;border-radius:12px;margin-bottom:7px;
  opacity:.38;transition:opacity .35s,background .35s,transform .35s;background:var(--bg3)}
.fstep.on{opacity:1;background:var(--brand-soft);transform:translateX(-4px)}
.fstep .fi{font-size:22px;flex:none;line-height:1.2}

.cmp2{padding:13px;background:var(--bg2);display:grid;gap:10px}
.cmp2 .side{border-radius:12px;padding:11px 13px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.cmp2 .side.bad{background:var(--err-soft);border-right:4px solid var(--err)}
.cmp2 .side.good{background:var(--ok-soft);border-right:4px solid var(--ok)}
.cmp2 .side .cl{font-size:11.5px;font-weight:800;letter-spacing:.3px;margin-bottom:4px;opacity:.85}

/* ---------- Voice ---------- */
.voicebar{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom));right:0;left:0;z-index:44;

.vb-btn:active{transform:scale(.93)}

/* ---------- Videos ---------- */

  animation:in .25s ease;box-shadow:var(--shadow-lg);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}

{id:"l1",title:"מה זה בינה מלאכותית ומודל שפה?",minutes:7,html:`
<h2>נתחיל מההתחלה האמיתית</h2>
<p>בשנים האחרונות כולם מדברים על "בינה מלאכותית", אבל מה זה בעצם? <span class="term">בינה מלאכותית <span class="en">(AI — Artificial Intelligence)</span></span> היא שם כללי לתוכנות מחשב שמסוגלות לבצע משימות שבעבר דרשו חשיבה אנושית: להבין שפה, לכתוב, לסכם, לתכנת, לנתח מידע.</p>
<p>קלוד שייך לסוג ספציפי של AI שנקרא <span class="term">מודל שפה גדול <span class="en">(LLM — Large Language Model)</span></span>. תחשוב על זה כך: המודל "קרא" כמות עצומה של טקסטים — ספרים, מאמרים, אתרים, קוד — ולמד מהם את הדפוסים של שפה אנושית וידע. כשאתה כותב לו משהו, הוא מחשב מה התגובה הסבירה והמועילה ביותר, מילה אחר מילה.</p>
<h2>שלושה מושגים שיעזרו לך להבין הכול</h2>
<h3>1. טוקנים — יחידות הטקסט</h3>
<p>המודל לא קורא מילים כמונו אלא מפרק את הטקסט ל<span class="term">טוקנים <span class="en">(Tokens)</span></span> — חתיכות קטנות של טקסט, בערך בגודל של מילה קצרה או חלק ממילה. למה זה חשוב לך? כי כל המגבלות והמחירים בעולם ה-AI נמדדים בטוקנים. כשתשמע "חלון של 200 אלף טוקנים" — הכוונה לכמות הטקסט שהמודל יכול "להחזיק בראש" בבת אחת.</p>
<h3>2. חלון ההקשר — הזיכרון של השיחה</h3>
<p><span class="term">חלון הקשר <span class="en">(Context Window)</span></span> הוא כל מה שהמודל "רואה" ברגע נתון: השיחה שלכם עד כה, קבצים שהעלית, הוראות שנתת. כשהשיחה נהיית ארוכה מאוד, החלון מתמלא — ולכן שיחות ארוכות במיוחד עלולות "לשכוח" פרטים מההתחלה. טיפ מעשי: לנושא חדש — פתח שיחה חדשה.</p>
<h3>3. הזיות — כשה-AI ממציא</h3>
<p>לפעמים המודל עונה בביטחון מלא... דברים שאינם נכונים. לזה קוראים <span class="term">הזיה <span class="en">(Hallucination)</span></span>. זה קורה כי המודל בנוי לייצר את הטקסט הסביר ביותר — לא בהכרח את האמת המוחלטת. בנוסף, לכל מודל יש <span class="term">תאריך קיצוץ ידע <span class="en">(Knowledge Cutoff)</span></span> — הוא הכיר את העולם עד תאריך מסוים, ואחריו הוא זקוק לחיפוש ברשת כדי להתעדכן.</p>
<div class="box warn"><b>⚠️ הכלל החשוב ביותר בקורס כולו</b>עובדות קריטיות — תאריכים, מספרים, ציטוטים, עניינים רפואיים או משפטיים — תמיד מאמתים במקור נוסף. AI הוא עוזר גאוני, לא אורקל.</div>
<div class="box tip"><b>💡 אז מה AI כן עושה מצוין?</b>מסכם, מנסח, מתרגם, מסביר, כותב טיוטות, מתכנת, מארגן מידע, עוזר לחשוב. במשימות האלה הוא ישנה לך את החיים — וזה בדיוק מה שנלמד.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>פתח את קלוד (באפליקציה או ב-claude.ai) ושאל אותו: "הסבר לי בשלושה משפטים פשוטים איך מודל שפה עובד". קרא את התשובה — עכשיו אתה כבר מבין על מה הוא מדבר.</div>
`},
{id:"l2",title:"הכרת קלוד: המודלים, החברה, והמנוי שלך",minutes:7,html:`
<h2>מי עומד מאחורי קלוד?</h2>
<p><span class="term">Anthropic</span> היא חברת מחקר אמריקאית שהוקמה ב-2021, עם דגש מיוחד על בטיחות ואמינות של AI. קלוד <span class="en">(Claude)</span> הוא המוצר המרכזי שלה — משפחה של מודלי שפה, וסביבם אוסף שלם של מוצרים וכלים שנלמד בקורס הזה.</p>
<h2>משפחת המודלים — מי נגד מי</h2>
<p>קלוד מגיע בכמה גרסאות מודל, וההבדל ביניהן הוא איזון בין חוכמה, מהירות ועלות:</p>
<div class="tbl-wrap"><table class="cmp">
<tr><th>מודל</th><th>האופי</th><th>מתי לבחור בו</th></tr>
<tr><td><b>Opus</b></td><td>החכם והמעמיק</td><td>משימות מורכבות: ניתוח עמוק, כתיבה חשובה, קוד מסובך</td></tr>
<tr><td><b>Sonnet</b></td><td>המאוזן</td><td>סוס העבודה היומיומי — מהיר וחכם, מתאים לרוב המשימות</td></tr>
<tr><td><b>Haiku</b></td><td>הזריז</td><td>משימות פשוטות וקצרות שצריכות תשובה מיידית</td></tr>
</table></div>
<p>בנוסף קיימת שכבת-על בשם <b>Fable / Mythos</b> — הדור החדש והמתקדם ביותר. אל דאגה: בממשק של קלוד פשוט בוחרים מודל מתפריט, והשמות תמיד מוצגים שם. הכלל המעשי: התחל עם ברירת המחדל, ועבור למודל חזק יותר כשהמשימה באמת מורכבת.</p>
<h2>מה כלול במנוי Pro שלך?</h2>
<p>יש לך מנוי <span class="term">Claude Pro</span> — ואלה החדשות הטובות: הוא פותח כמעט את כל מה שנלמד בקורס:</p>
<ul>
<li>💬 שימוש מוגבר בצ'אט עם כל המודלים</li>
<li>📁 Projects ללא הגבלה (בחינמי — עד 5)</li>
<li>🎨 Artifacts, Styles, חיפוש ברשת, ניתוח קבצים</li>
<li>⌨️ <b>Claude Code</b> — כלי העבודה החזק ביותר (מודולים 4–5)</li>
<li>🤝 <b>Cowork</b> — העמית הדיגיטלי (מודול 6)</li>
<li>🧩 Skills, חיבורים חיצוניים (Connectors) ועוד</li>
</ul>
<div class="box info"><b>ℹ️ מה זה בעצם "מנוי"?</b>המנוי לא קונה "כמות שאלות" קבועה אלא מכסת שימוש שמתחדשת כל כמה שעות. אם תגיע לתקרה בשימוש אינטנסיבי — פשוט תחכה קצת והמכסה תתחדש. מנוי Max מרחיב את המכסות למי שעובד כל היום עם קלוד.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>פתח את claude.ai, לחץ על שם המודל שמופיע ליד תיבת ההקלדה, וראה אילו מודלים זמינים לך. אל תשנה כלום — רק תכיר איפה זה.</div>
`},
{id:"l3",title:"איפה קלוד חי? מפת הדרכים המלאה",minutes:8,html:`
<h2>קלוד אחד — הרבה דלתות</h2>
<p>אחת הנקודות שהכי מבלבלות מתחילים: לקלוד יש כמה "בתים" שונים, וכל אחד טוב למשהו אחר. בוא נעשה סדר אחת ולתמיד. אותו חשבון (המייל שלך) משמש בכולם, וההתקדמות שלך נשמרת.</p>
<h3>🌐 האתר — claude.ai</h3>
<p>הדלת הראשית. פותחים דפדפן, נכנסים ל-claude.ai, ומדברים עם קלוד. כאן נמצאים הצ'אט, Projects, Artifacts ו-Styles. זה הבית של מודול 2.</p>
<h3>📱 אפליקציית הטלפון</h3>
<p>קלוד בכיס — אפליקציה לאייפון ולאנדרואיד עם כמעט כל יכולות האתר, כולל צילום ושיתוף תמונות ומסמכים ודיבור בקול.</p>
<h3>💻 אפליקציית הדסקטופ — Claude Desktop</h3>
<p>אפליקציה שמתקינים על המחשב (Windows/Mac). היתרון הגדול: היא יכולה לעבוד עם <b>הקבצים שעל המחשב שלך</b> ומכילה שלושה אזורים: Chat (צ'אט רגיל), <b>Cowork</b> (העמית הדיגיטלי — מודול 6) ו-<b>Code</b> (ממשק נוח ל-Claude Code — מודול 4).</p>
<h3>⌨️ הטרמינל — Claude Code</h3>
<p>הכלי החזק ביותר בארסנל. <span class="term">טרמינל <span class="en">(Terminal)</span></span> הוא חלון שבו מקלידים פקודות למחשב בטקסט — אל תיבהל, נלמד אותו מאפס במודול 4. שם קלוד הופך מ"יועץ שעונה" ל"עובד שמבצע": יוצר קבצים, בונה אתרים ואפליקציות, מארגן תיקיות.</p>
<h3>🔌 ה-API — למפתחים ובונים</h3>
<p><span class="term">API <span class="en">(Application Programming Interface)</span></span> הוא "שקע חשמל" תוכנתי: דרך שבה תוכנות אחרות מתחברות לקלוד ישירות. כך בונים מוצרים משלך שמופעלים על ידי קלוד. נגיע לזה במודול 9 — וכן, גם בלי רקע בתכנות.</p>

<h2>מסגרת ה-4D של Anthropic</h2>
<p>לפני שצוללים לכלים, שווה לאמץ את דרך החשיבה הנכונה. Anthropic מלמדת (בקורסי Claude Academy הרשמיים) מסגרת של ארבעה עקרונות שנקראת <span class="term">4D</span>. היא תלווה אותנו לאורך כל הקורס:</p>
<h3>1. האצלה <span class="en">(Delegation)</span> — מה בכלל לתת ל-AI?</h3>
<p>ההחלטה הראשונה היא איזו עבודה להעביר לקלוד ואיזו להשאיר אצלך. כלל אצבע: משימות של ניסוח, סיכום, ארגון, טיוטה ראשונה וקוד — מצוינות להאצלה. החלטות ערכיות, אחריות סופית ובקרת איכות — נשארות אצלך.</p>
<h3>2. תיאור <span class="en">(Description)</span> — להסביר טוב מה אתה רוצה</h3>
<p>איכות התוצאה תלויה ישירות באיכות הבקשה. "כתוב לי משהו על שיווק" יניב בינוניות; בקשה מפורטת עם הקשר, קהל יעד ומטרה תניב זהב. זו בדיוק מיומנות <b>הנדסת הפרומפטים</b> — מודול 3 שלנו.</p>
<h3>3. שיפוט <span class="en">(Discernment)</span> — לבחון את מה שקיבלת</h3>
<p>התוצר של AI הוא טיוטה חכמה, לא פסק דין. קרא ביקורתית: האם זה נכון? מתאים לקהל? חסר משהו? אתה העורך הראשי.</p>
<h3>4. אחריות <span class="en">(Diligence)</span> — להשתמש באחריות</h3>
<p>שקיפות (לומר כשתוכן נוצר בעזרת AI כשזה רלוונטי), זהירות עם מידע רגיש ופרטי, ואימות עובדות לפני שמסתמכים עליהן.</p>
<div class="box info"><b>ℹ️ למה זה חשוב כבר עכשיו?</b>כשנגיע לכלים החזקים באמת — Claude Code שמריץ פקודות על המחשב שלך, או חיבורים למייל וליומן — ארבעת העקרונות האלה יהפכו מ"עצה טובה" ל"חגורת בטיחות".</div>
<div class="box try"><b>🚀 נסה עכשיו</b>חשוב על שלוש משימות מהחיים שלך השבוע. לגבי כל אחת שאל: האם הייתי מאציל אותה לקלוד? מה הייתי צריך לתאר לו כדי שיצליח? רשום אותן — נשתמש בהן בתרגילים.</div>

{id:"l1",title:"סיור בממשק: כל מה שמסביב לתיבת ההקלדה",minutes:7,html:`
<h2>הבית הראשי של קלוד</h2>
<p>נכנסים ל-<b>claude.ai</b> ומקבלים מסך פשוט: תיבת הקלדה באמצע, סרגל צד מימין (או משמאל באנגלית). אבל מסביב לתיבה הזו מסתתרים כלים ששווה להכיר אחד-אחד:</p>
<h3>בחירת מודל</h3>
<p>ליד תיבת ההקלדה מופיע שם המודל הנוכחי (למשל Sonnet). לחיצה עליו פותחת תפריט לבחירת מודל אחר — כפי שלמדנו במודול 1: ברירת מחדל לרוב, Opus למשימות כבדות.</p>
<h3>חשיבה מורחבת <span class="en">(Extended Thinking)</span></h3>
<p>מצב שבו קלוד "חושב בקול" לפני שהוא עונה — מקדיש זמן לתכנון ובדיקה עצמית. מפעילים אותו לשאלות מורכבות: חישובים, ניתוחים, החלטות רב-שלביות. התשובה איטית יותר אך מעמיקה יותר.</p>
<h3>חיפוש ברשת <span class="en">(Web Search)</span></h3>
<p>כשקלוד צריך מידע עדכני — חדשות, מחירים, נתונים טריים — הוא יכול לחפש ברשת ולצרף מקורות. אפשר לבקש זאת במפורש: "חפש ברשת…".</p>
<h3>צירוף קבצים ותמונות</h3>
<p>כפתור ה-<b>+</b> ליד תיבת ההקלדה מאפשר להעלות מסמכים (PDF, Word, Excel…), תמונות וצילומי מסך. קלוד קורא אותם ועונה עליהם: "סכם את המסמך", "מה כתוב בטופס שצילמתי?", "הסבר את הגרף הזה".</p>
<h3>דיבור בקול</h3>
<p>באפליקציות הטלפון אפשר לנהל שיחה קולית מלאה — מצוין להליכה, נהיגה או סיעור מוחות בקול.</p>
<h2>ניהול השיחות</h2>
<p>בסרגל הצד נשמרות כל השיחות שלך. כמה הרגלים טובים:</p>
<ul>
<li><b>שיחה חדשה לכל נושא</b> — שומר על חלון הקשר נקי וממוקד.</li>
<li><b>חיפוש</b> — יש חיפוש בשיחות ישנות; לא צריך לגלול.</li>
<li><b>עריכת הודעה</b> — אפשר לערוך הודעה ששלחת ולקבל תשובה מחודשת ממנה והלאה. מעולה לשיפור ניסוח בלי להתחיל מחדש.</li>
</ul>
<div class="box tip"><b>💡 טיפ של מקצוענים</b>קיבלת תשובה לא מדויקת? במקום לריב איתה בהודעה חדשה — ערוך את ההודעה המקורית ושפר את הבקשה. שיחה נקייה עדיפה על ויכוח ארוך.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>העלה לקלוד צילום מסך כלשהו מהטלפון (למשל של הודעה או מסמך) ובקש: "תאר מה אתה רואה כאן וסכם את העיקר".</div>
`},
{id:"l2",title:"Artifacts: תוצרים חיים בצד השיחה",minutes:8,html:`
<h2>מה זה Artifact?</h2>
<p>כשמבקשים מקלוד ליצור משהו "שלם" — מסמך, טבלה, דף אינטרנט, משחק, כלי אינטראקטיבי — הוא לא שופך אותו לתוך השיחה אלא פותח אותו בחלון נפרד בצד: זהו <span class="term">Artifact <span class="en">(ארטיפקט)</span></span>. חשוב עליו כמו על "קובץ חי" שנוצר ומתעדכן מול העיניים שלך.</p>
<h2>מה אפשר ליצור? כמעט הכול</h2>
<ul>
<li>📄 מסמכים מעוצבים — מכתבים, מדריכים, תוכניות עבודה</li>
<li>🌐 דפי אינטרנט אינטראקטיביים — עם כפתורים, טפסים וצבעים</li>
<li>🎮 משחקים — חידונים, זיכרון, פאזלים</li>
<li>🧮 כלים — מחשבונים, ממירים, טיימרים</li>
<li>📊 תרשימים ודיאגרמות</li>
</ul>
<p>והכול — <b>בלי לכתוב שורת קוד אחת</b>. אתה מתאר במילים, קלוד בונה.</p>
<h2>איך זה עובד בפועל?</h2>
<p>פשוט מבקשים. למשל:</p>
<div class="prompt-ex"><div class="pl">פרומפט לדוגמה</div>צור לי דף אינטרנט אינטראקטיבי עם רשימת מטלות: אפשרות להוסיף משימה, לסמן שהושלמה ולמחוק. עיצוב נקי בגווני כחול, בעברית.</div>
<p>ה-Artifact ייפתח בצד, ותוכל להמשיך לשוחח כדי לשפר: "הוסף כפתור למחיקת הכול", "שנה לגופן גדול יותר". כל בקשה מעדכנת את התוצר.</p>
<h2>שמירה, פרסום ושיתוף</h2>
<ul>
<li>כל ה-Artifacts שלך נשמרים ומרוכזים באזור ייעודי בסרגל הצד.</li>
<li>אפשר <b>לפרסם</b> Artifact ולקבל קישור לשיתוף — מי שמקבל אותו רואה את התוצר בלי להיכנס לשיחה שלך.</li>
<li>אפשר להוריד את התוצר כקובץ למחשב.</li>
</ul>
<div class="box info"><b>ℹ️ אפליקציות AI בתוך Artifact</b>רמה מתקדמת: אפשר לבקש שה-Artifact עצמו ישתמש בקלוד מבפנים — למשל "בנה לי אפליקציה שמקבלת נושא וכותבת עליו חרוזים". כך יוצרים כלי AI שאפשר לשתף עם אחרים, והם משתמשים בו עם החשבון שלהם.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>בקש מקלוד: "צור לי משחק טריוויה קצר בעברית על נושא שאני אוהב: [בחר נושא]". שחק בו, ואז בקש שיפור אחד.</div>
`},
{id:"l3",title:"Projects: תיקיות חכמות לעבודה מתמשכת",minutes:8,html:`
<h2>הבעיה ש-Projects פותר</h2>
<p>נניח שאתה עובד על משהו מתמשך — כתיבת ספר, ניהול עסק קטן, לימודי תעודה. בכל שיחה חדשה אתה מוצא את עצמך מסביר מחדש: מי אתה, מה הפרויקט, מה הסגנון. מתיש.</p>
<p><span class="term">Project <span class="en">(פרויקט)</span></span> הוא "תיקייה חכמה": אזור שמרכז שיחות סביב נושא אחד, עם שני מרכיבי-על:</p>
<h3>1. מאגר ידע <span class="en">(Project Knowledge)</span></h3>
<p>קבצים ומסמכים שאתה מעלה פעם אחת — והם זמינים לקלוד בכל שיחה בפרויקט. למשל: קורות החיים שלך, קטלוג המוצרים, סילבוס הקורס, טיוטות קודמות.</p>
<h3>2. הוראות פרויקט <span class="en">(Project Instructions)</span></h3>
<p>הנחיות קבועות שחלות על כל שיחה בפרויקט. למשל: "אתה עוזר הכתיבה שלי לספר מתח. כתוב בעברית עשירה, גוף ראשון, טון אפל. הדמות הראשית נקראת דנה."</p>
<h2>איך יוצרים פרויקט?</h2>
<ol>
<li>בסרגל הצד לחץ על <b>Projects</b> ואז <b>+ New Project</b> (פרויקט חדש).</li>
<li>תן שם ותיאור קצר.</li>
<li>העלה קבצים למאגר הידע דרך כפתור ההוספה.</li>
<li>לחץ על <b>Set project instructions</b> וכתוב את ההוראות הקבועות.</li>
<li>מעכשיו — כל שיחה שתפתח בתוך הפרויקט תכיר את הכול.</li>
</ol>
<p>אפשר גם לגרור שיחות קיימות לתוך פרויקט, ובמנוי Pro שלך — מספר הפרויקטים בלתי מוגבל (בחינמי: עד 5).</p>
<h2>למה זה משנה את החיים?</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>בלי פרויקט</th><th>עם פרויקט</th></tr>
<tr><td>מסביר הכול מחדש בכל שיחה</td><td>קלוד כבר מכיר את ההקשר</td></tr>
<tr><td>מעלה את אותם קבצים שוב ושוב</td><td>הקבצים תמיד שם</td></tr>
<tr><td>סגנון לא עקבי בין שיחות</td><td>הוראות קבועות = עקביות</td></tr>
<tr><td>שיחות מפוזרות בהיסטוריה</td><td>הכול מרוכז במקום אחד</td></tr>
</table></div>
<div class="box tip"><b>💡 רעיונות לפרויקט ראשון</b>"העסק שלי" (עם פרטי העסק והלקוחות), "לימודים" (עם הסילבוס), "כושר ותזונה" (עם הנתונים שלך), "כתיבת הבלוג" (עם דוגמאות לסגנון שלך).</div>
<div class="box try"><b>🚀 נסה עכשיו</b>חשוב: איזה נושא אתה מדבר עליו עם קלוד שוב ושוב? זה המועמד הטבעי לפרויקט הראשון שלך — ניצור אותו בתרגיל.</div>
`},
{id:"l4",title:"Styles והתאמה אישית: קלוד בקול שלך",minutes:7,html:`
<h2>שלוש שכבות של התאמה אישית</h2>
<p>קלוד מציע כמה מנגנונים שקובעים "איך הוא מדבר איתך". חשוב להבין מה ההבדל ביניהם, כי כל אחד חל ברמה אחרת:</p>
<h3>1. הוראות גלובליות — על כל החשבון</h3>
<p>בהגדרות (לחיצה על שם המשתמש ← Settings) יש אזור הוראות אישיות שחל על <b>כל</b> השיחות שלך. כאן שמים דברים קבועים באמת: "ענה לי תמיד בעברית", "אני גר בישראל", "תעדיף הסברים פשוטים בלי ז'רגון".</p>
<h3>2. Styles — סגנון תשובה שמחליפים בקליק</h3>
<p><span class="term">Style <span class="en">(סגנון)</span></span> קובע את צורת הכתיבה של קלוד: תמציתי? מפורט? רשמי? יש סגנונות מובנים — <b>Concise</b> (תמציתי), <b>Explanatory</b> (הסברי), <b>Formal</b> (רשמי) — ואפשר ליצור סגנון אישי: מזינים דוגמת טקסט שכתבת או מתארים במילים, וקלוד לומד לכתוב "כמוך". את הסגנון בוחרים מתפריט ליד תיבת ההקלדה, ואפשר להחליף מסגנון לסגנון בכל שיחה.</p>
<h3>3. הוראות פרויקט — רק בתוך פרויקט</h3>
<p>כפי שלמדנו בשיעור הקודם — חלות רק על שיחות בתוך הפרויקט המסוים.</p>
<h3>וגם: זיכרון</h3>
<p>לקלוד יש יכולת <span class="term">זיכרון <span class="en">(Memory)</span></span> — הוא יכול לזכור פרטים חשובים עליך בין שיחות (בהתאם להגדרות שתבחר). אפשר לבקש ממנו לזכור משהו, לשאול מה הוא זוכר, ולנהל את הזיכרונות בהגדרות.</p>
<h2>איזו שכבה למה?</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>אני רוצה ש…</th><th>הכלי</th></tr>
<tr><td>קלוד תמיד ידע עובדות בסיס עליי</td><td>הוראות גלובליות / זיכרון</td></tr>
<tr><td>התשובות ייכתבו בסגנון מסוים לפי מצב רוח/משימה</td><td>Style</td></tr>
<tr><td>הקשר קבוע לנושא עבודה מסוים</td><td>Project + הוראותיו</td></tr>
</table></div>
<div class="box warn"><b>⚠️ אל תגזים</b>הוראות גלובליות ארוכות מדי "נדבקות" לכל שיחה ועלולות להפריע. שמור שם רק את מה שנכון תמיד. כל השאר — בפרויקטים וב-Styles.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>פתח את תפריט הסגנונות (ליד תיבת ההקלדה), שאל שאלה כלשהי עם Concise ואז אותה שאלה עם Explanatory — ותראה את ההבדל.</div>
`},
{id:"l5",title:"קלוד בטלפון ובמחשב: לעבוד מכל מקום",minutes:6,html:`
<h2>אפליקציית הטלפון — קלוד בכיס</h2>
<p>האפליקציה (iOS/Android) נותנת כמעט את כל מה שיש באתר, ועוד כמה יתרונות ייחודיים:</p>
<ul>
<li>📷 <b>מצלמה כקלט</b> — מצלמים מסמך, שלט, תרגיל במתמטיקה, מוצר בסופר — ושואלים עליו.</li>
<li>🎙️ <b>שיחה קולית</b> — מדברים עם קלוד בקול, בעברית, תוך כדי הליכה.</li>
<li>📤 <b>שיתוף מכל אפליקציה</b> — מסמנים טקסט או קובץ בכל מקום בטלפון ← שתף ← Claude.</li>
<li>🔔 <b>המשכיות מלאה</b> — שיחה שהתחלת במחשב ממשיכה בטלפון ולהפך.</li>
</ul>
<h2>אפליקציית הדסקטופ — התחנה המרכזית</h2>
<p><b>Claude Desktop</b> למחשב (Windows/Mac) היא הרבה יותר מ"אתר בחלון". היא כוללת את שלושת האזורים שהכרנו — Chat, Cowork, Code — וקיצור מקלדת גלובלי שמקפיץ את קלוד מעל כל תוכנה. בהמשך הקורס, כשנגיע ל-Cowork ול-Claude Code, היא תהפוך לכלי מרכזי — שווה להתקין אותה כבר עכשיו מ-<b>claude.com/download</b>.</p>
<h2>ואפילו בדפדפן: Claude in Chrome</h2>
<p>תוסף לדפדפן כרום שמאפשר לקלוד לראות את הדף שאתה גולש בו ואף לבצע בו פעולות. נפגוש אותו שוב במודול 6 (Cowork).</p>
<div class="box tip"><b>💡 שגרה מומלצת למתחילים</b>טלפון — לשאלות מהירות, צילומים וסיעור מוחות בדרכים. מחשב — לעבודה רצינית: פרויקטים, Artifacts, ובהמשך Cowork ו-Claude Code.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>אם יש לך גישה למחשב — הורד את Claude Desktop מ-claude.com/download והתחבר. נשתמש בה הרבה בהמשך.</div>
`}

{id:"l1",title:"עקרון הזהב: ברור, ישיר וספציפי",minutes:7,html:`
<h2>מה זו בכלל 'הנדסת פרומפטים'?</h2>
<p><span class="term">פרומפט <span class="en">(Prompt)</span></span> הוא ההודעה שאתה שולח ל-AI — הבקשה, ההוראה, השאלה. <span class="term">הנדסת פרומפטים <span class="en">(Prompt Engineering)</span></span> היא אמנות הניסוח שמוציאה מהמודל את המיטב. זו המיומנות המשתלמת ביותר בקורס: היא עובדת בצ'אט, ב-Claude Code, ב-Cowork וב-API — בכל מקום.</p>
<h2>הכלל הראשון: תהיה ברור וישיר</h2>
<p>ההנחיה הרשמית של Anthropic מציעה דימוי מצוין: התייחס לקלוד כאל <b>עובד חדש ומבריק שאין לו מושג על ההקשר שלך</b>. הוא חכם מאוד, אבל לא יודע מה מקובל אצלך, למי מיועד התוצר ומה חשוב לך — אלא אם תגיד.</p>
<div class="box info"><b>ℹ️ מבחן הקולגה — כלל הזהב הרשמי</b>הראה את הפרומפט שלך לקולגה בלי רקע על המשימה ובקש שיבצע אותה. אם הקולגה יתבלבל — גם קלוד יתבלבל.</div>
<h2>איך נראית ספציפיות בפועל?</h2>
<div class="prompt-ex"><div class="pl">❌ פרומפט חלש</div>תכתוב לי פוסט על העסק שלי</div>
<div class="prompt-ex"><div class="pl">✅ פרומפט חזק</div>כתוב פוסט פייסבוק לעסק שלי — סטודיו ליוגה בחיפה. קהל היעד: נשים 30–50 שמתלבטות להתחיל. המטרה: הרשמה לשיעור ניסיון חינם ביום שלישי. טון: חם ומזמין, לא שיווקי-אגרסיבי. אורך: עד 80 מילים + קריאה לפעולה בסוף.</div>
<p>שים לב מה נוסף: <b>מי</b> (העסק והקהל), <b>מה</b> (פוסט פייסבוק), <b>למה</b> (הרשמה לשיעור), <b>איך</b> (טון ואורך). אלה ארבע השאלות שכדאי לענות עליהן כמעט בכל פרומפט רציני.</p>
<h2>הוראות כרשימת שלבים</h2>
<p>כשיש לביצוע סדר או שלבים — כתוב אותם כרשימה ממוספרת. זה מונע דילוגים:</p>
<div class="prompt-ex"><div class="pl">פרומפט לדוגמה</div>1. קרא את קורות החיים המצורפים<br>2. זהה את 3 החוזקות הבולטות<br>3. כתוב פסקת 'על עצמי' שמדגישה אותן<br>4. הצע 2 ניסוחים: רשמי וקליל</div>
<div class="box tip"><b>💡 רוצה יוצא מן הכלל? תבקש</b>קלוד מכוון לענות "נכון", לא בהכרח "מעל ומעבר". רוצה תוצר עשיר, יצירתי, מפורט במיוחד? כתוב זאת במפורש: "אל תסתפק בבסיס — תן גרסה מושקעת ומלאה".</div>
<div class="box try"><b>🚀 נסה עכשיו</b>קח בקשה שאתה שולח הרבה לקלוד, והפעל עליה את מבחן הקולגה. מה חסר בה? הוסף מי/מה/למה/איך ושלח מחדש.</div>

{id:"l2",title:"הקשר ומוטיבציה: להסביר למה",minutes:5,html:`
<h2>הטריק הפשוט שמשנה הכול</h2>
<p>אחת ההנחיות המפתיעות במדריך הרשמי: אל תגיד רק <i>מה</i> לעשות — הסבר <b>למה</b>. כשקלוד מבין את המטרה מאחורי ההוראה, הוא יודע להכליל ממנה נכון גם למצבים שלא חשבת עליהם.</p>
<div class="prompt-ex"><div class="pl">❌ הוראה יבשה</div>לעולם אל תשתמש בשלוש נקודות (...)</div>
<div class="prompt-ex"><div class="pl">✅ הוראה עם סיבה</div>התשובה שלך תוקרא בקול על ידי מנוע הקראה, ולכן אל תשתמש בשלוש נקודות — המנוע לא יודע איך לבטא אותן.</div>
<p>בגרסה השנייה קלוד מבין את העיקרון האמיתי (טקסט ידידותי להקראה) ויימנע בעצמו גם מסימנים בעייתיים אחרים — כי הוא הבין את הכוונה, לא רק את החוק.</p>
<h2>הקשר = כל מה שאתה יודע והוא לא</h2>
<p>לפני משימה חשובה, שאל את עצמך: מה אני יודע שיעזור לו?</p>
<ul>
<li>למי מיועד התוצר? (בוס? לקוח? ילד בן 10?)</li>
<li>מה נוסה כבר ולא עבד?</li>
<li>אילו אילוצים יש? (תקציב, אורך, טון, רגישויות)</li>
<li>איך נראית הצלחה?</li>
</ul>
<div class="prompt-ex"><div class="pl">✅ דוגמה מלאה</div>אני צריך לכתוב מייל לבעל הדירה שלי. הקשר: המזגן מקולקל שבועיים, פניתי פעמיים בוואטסאפ בלי מענה. אני רוצה טון תקיף אך מכבד — חשוב לי לשמור על יחסים טובים, אבל גם להבהיר שאם זה לא יטופל השבוע אפנה לעורך דין. כתוב מייל קצר בעברית.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>קח הוראה שנתת פעם לקלוד ("תהיה קצר", "בלי אימוג'ים"...) והוסף לה את הסיבה. שים לב איך התוצאה נהיית חכמה יותר, לא רק צייתנית.</div>
`},
{id:"l3",title:"דוגמאות: הדרך האמינה ביותר לכוון סגנון",minutes:6,html:`
<h2>למה דוגמאות עובדות כל כך טוב?</h2>
<p>תיאור במילים של סגנון או פורמט הוא תמיד מקורב. דוגמה אמיתית — מדויקת. הטכניקה נקראת <span class="term">Few-Shot <span class="en">(מספר דוגמאות)</span></span>: נותנים לקלוד 3–5 דוגמאות של קלט ופלט רצוי, והוא "קולט את הראש" ומחקה.</p>
<h2>איך בונים דוגמאות טובות? שלושה כללים רשמיים</h2>
<ul>
<li><b>רלוונטיות</b> — הדוגמאות משקפות בדיוק את סוג המשימה האמיתית שלך.</li>
<li><b>מגוונות</b> — מכסות מקרים שונים, כולל מקרי קצה, כדי שקלוד לא ילמד דפוס מקרי (למשל: אם כל הדוגמאות שלך קצרות — הוא יסיק שאתה רוצה קצר).</li>
<li><b>מסומנות</b> — עטוף כל דוגמה בסימון ברור כדי להפריד אותה מההוראות (בשיעור הבא נלמד את הדרך המקצועית).</li>
</ul>
<h2>דוגמה מהחיים</h2>
<div class="prompt-ex"><div class="pl">פרומפט עם דוגמאות</div>אני עונה לביקורות של לקוחות על המסעדה שלי. כתוב תשובות בסגנון שלי. הנה שתי דוגמאות:<br><br>ביקורת: "האוכל היה מעולה אבל חיכינו 40 דקות"<br>תשובה: "תודה רבה על המחמאה לאוכל! צר לנו על ההמתנה — בדיוק בגלל משובים כאלה תגברנו את הצוות בסופי שבוע. נשמח לארח אתכם שוב 🙏"<br><br>ביקורת: "מקום מהמם, שירות אדיב"<br>תשובה: "איזה כיף לקרוא! מחכים לכם תמיד 🧡"<br><br>עכשיו כתוב תשובה לביקורת הבאה: "המנות היו קטנות ביחס למחיר"</div>
<p>שים לב: לא הסברנו במילים מה הסגנון ("חם, עם אימוג'י אחד, מתחיל בהודיה...") — הדוגמאות אמרו הכול.</p>
<div class="box tip"><b>💡 תן לקלוד לעבוד בשבילך</b>אין לך כוח לכתוב דוגמאות? בקש: "נסח 3 דוגמאות לפי הסגנון הזה [הדבק טקסט אחד שלך] כדי שאשתמש בהן בפרומפטים עתידיים". קלוד מצוין גם בבניית דוגמאות וגם בביקורת עליהן.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>בחר משימה חוזרת שלך (תשובות למיילים? כותרות לפוסטים?) ובנה פרומפט עם 2–3 דוגמאות אמיתיות. שמור אותו — הוא יהפוך לתבנית בתרגיל.</div>
`},
{id:"l4",title:"מבנה ותגיות: לארגן פרומפט מורכב",minutes:6,html:`
<h2>הבעיה: כשהכול מתערבב</h2>
<p>בפרומפט ארוך יש הוראות, רקע, דוגמאות, וטקסט לעיבוד — ואם הכול זורם בערבוביה, קלוד עלול להתבלבל: איפה נגמרות ההוראות ומתחיל הטקסט? מה דוגמה ומה משימה?</p>
<h2>הפתרון הרשמי: תגיות</h2>
<p>המדריך של Anthropic ממליץ לעטוף כל חלק בתגיות בסגנון <span class="term">XML</span> — סימוני פתיחה וסגירה שנראים כך: <span class="kbd">&lt;instructions&gt;</span> ... <span class="kbd">&lt;/instructions&gt;</span>. אל תיבהל מהמראה הטכני — זה בסך הכול "כותרות מודגשות" שקלוד מזהה בצורה מושלמת:</p>
<div class="code">&lt;instructions&gt;
סכם את הטקסט המצורף ל-3 נקודות עיקריות.
כתוב בעברית פשוטה, לקהל שאינו מקצועי.
&lt;/instructions&gt;

&lt;context&gt;
הסיכום מיועד לניוזלטר השבועי של העמותה שלנו.
&lt;/context&gt;

&lt;text&gt;
[כאן מדביקים את הטקסט לסיכום]
&lt;/text&gt;</div>
<p>שמות התגיות חופשיים — העיקר שיהיו תיאוריים ועקביים: <span class="kbd">&lt;example&gt;</span> לדוגמאות, <span class="kbd">&lt;document&gt;</span> למסמכים, <span class="kbd">&lt;input&gt;</span> לקלט.</p>
<h2>מתי זה באמת נחוץ?</h2>
<ul>
<li>כשהפרומפט מכיל <b>טקסט חיצוני</b> (מייל שקיבלת, מאמר) — כדי שקלוד לא יתייחס להוראות שבתוכו כאל הוראות שלך.</li>
<li>כשיש <b>כמה חלקים שונים</b> — הוראות + רקע + דוגמאות.</li>
<li>כשאתה בונה <b>תבנית לשימוש חוזר</b> — מבנה קבוע עם "חורים" למילוי.</li>
</ul>
<div class="box tip"><b>💡 לשיחות פשוטות — לא צריך</b>שאלה של שורה-שתיים לא זקוקה לתגיות. הטכניקה נועדה לפרומפטים מורכבים ולתבניות — שם היא זהב.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>קח מייל אמיתי שקיבלת, עטוף אותו ב-<span class="kbd">&lt;email&gt;</span>, והוסף מעליו <span class="kbd">&lt;instructions&gt;</span> עם: "נסח טיוטת תשובה מנומסת שדוחה את הבקשה". שים לב לסדר ולבהירות.</div>
`},
{id:"l5",title:"תפקיד (Role): במה קלוד 'מתמחה' עכשיו",minutes:5,html:`
<h2>משפט אחד שממקד הכול</h2>
<p>הגדרת <span class="term">תפקיד <span class="en">(Role)</span></span> בתחילת הפרומפט — "אתה עורך דין המתמחה בדיני עבודה", "את מאמנת כושר לנשים אחרי לידה" — ממקדת את הטון, אוצר המילים ורמת העומק של התשובה. לפי התיעוד הרשמי, אפילו משפט בודד עושה הבדל.</p>
<div class="prompt-ex"><div class="pl">בלי תפקיד</div>מה כדאי לאכול לפני ריצה?</div>
<div class="prompt-ex"><div class="pl">עם תפקיד</div>אתה תזונאי ספורט קליני. אני רץ חובב, 45 דקות ריצה בבוקר. מה כדאי לאכול לפני, ומתי? תן המלצה מעשית עם 2–3 אפשרויות קונקרטיות.</div>
<h2>שדרוגים לתפקיד</h2>
<ul>
<li><b>קהל</b> — "...המסביר לקהל שאינו מקצועי"</li>
<li><b>גישה</b> — "...ביקורתי וזהיר" / "...יצירתי ונועז"</li>
<li><b>נקודת מבט מועילה</b> — "אתה משקיע מנוסה שבוחן את הרעיון שלי בספקנות. מצא את שלוש החולשות הגדולות בתוכנית."</li>
</ul>
<p>הדוגמה האחרונה חשובה: תפקיד מאפשר לגייס <b>ביקורת</b> — קלוד כברירת מחדל נחמד; תפקיד ספקני מייצר משוב חד יותר.</p>
<div class="box warn"><b>⚠️ תפקיד אינו תחליף למומחה</b>"אתה רופא" לא הופך את קלוד לרופא. בנושאי בריאות, משפט וכסף — התייעץ עם בעלי מקצוע אמיתיים. התפקיד מכוון את הסגנון והמיקוד, לא מעניק סמכות.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>קח החלטה שאתה מתלבט בה, ובקש מקלוד לשחק שני תפקידים בזה אחר זה: "תומך נלהב שמחזק את הרעיון" ואז "ספקן שמפרק אותו". קרא את שני הצדדים.</div>
`},
{id:"l6",title:"שליטה בפורמט: לקבל בדיוק את הצורה שרצית",minutes:6,html:`
<h2>הכלל: תגיד מה כן, לא מה לא</h2>
<p>ההנחיה הרשמית מפתיעה רבים: עדיף להגיד לקלוד <b>מה לעשות</b> מאשר מה לא לעשות.</p>
<div class="prompt-ex"><div class="pl">❌ פחות טוב</div>בלי נקודות תבליט (bullets) בתשובה</div>
<div class="prompt-ex"><div class="pl">✅ טוב יותר</div>כתוב את התשובה כפסקאות רציפות וזורמות</div>
<h2>ארגז הכלים לפורמט</h2>
<ul>
<li><b>ציין מבנה מפורש:</b> "בנה כך: כותרת, 3 פסקאות, שורת סיכום מודגשת".</li>
<li><b>הגדר אורך:</b> "עד 100 מילים", "בדיוק 5 נקודות", "פסקה אחת".</li>
<li><b>בקש טבלה כשמתאים:</b> "הצג כטבלה עם עמודות: אפשרות, יתרון, חיסרון".</li>
<li><b>הסגנון שלך מדבק:</b> קלוד נוטה לחקות את סגנון הפרומפט. פרומפט מסודר ורשמי → תשובה מסודרת; פרומפט קליל → תשובה קלילה. השתמש בזה לטובתך.</li>
<li><b>תבנית למילוי:</b> הכי חזק — תן שלד מדויק:</li>
</ul>
<div class="prompt-ex"><div class="pl">תבנית למילוי</div>סכם כל מועמד בפורמט הבא:<br>שם:<br>ניסיון רלוונטי (שורה אחת):<br>דגל אדום אם יש:<br>ציון התאמה (1–10):</div>
<h2>ולסיום — פורמט לקריאה חוזרת</h2>
<p>אם התוצר מיועד להעתקה למקום אחר (מייל, מסמך, פוסט) — אמור זאת: "כתוב כך שאוכל להעתיק ולהדביק ישירות למייל, בלי הערות פתיחה וסיום". זה חוסך את ה"בשמחה! הנה הטיוטה:" שאחר כך צריך למחוק.</p>
<div class="box try"><b>🚀 נסה עכשיו</b>בקש מקלוד סיכום של נושא כלשהו בתבנית קשיחה שתגדיר (כותרת / 3 עובדות / שורה אישית). בדוק: האם הוא עמד בתבנית אחד לאחד?</div>
`},
{id:"l7",title:"עבודה עם מסמכים ארוכים",minutes:6,html:`
<h2>הכללים משתנים כשהקלט ענק</h2>
<p>העלית חוזה של 40 עמודים? דוח שנתי? תמלול ישיבה ארוך? למסמכים גדולים יש שלושה כללים רשמיים שמשפרים דרמטית את הדיוק:</p>
<h3>1. המסמך למעלה, השאלה למטה</h3>
<p>מבחני Anthropic מראים שיפור של עד 30% באיכות כשמציבים את המסמך הארוך <b>בראש</b> הפרומפט ואת השאלה וההוראות <b>בסופו</b>. אם אתה מדביק טקסט ארוך — קודם הטקסט, אחר כך הבקשה.</p>
<h3>2. עטוף כל מסמך בתגיות</h3>
<p>בכמה מסמכים? עטוף כל אחד ב-<span class="kbd">&lt;document&gt;</span> עם שם המקור, כדי שקלוד יוכל להפנות למסמך הנכון:</p>
<div class="code">&lt;document source="חוזה_שכירות.pdf"&gt;
...תוכן...
&lt;/document&gt;
&lt;document source="נספח_תיקונים.pdf"&gt;
...תוכן...
&lt;/document&gt;

השווה בין החוזה לנספח: מה השתנה בתנאי התשלום?</div>
<h3>3. בקש ציטוטים קודם — עיגון</h3>
<p>הטריק החזק ביותר נגד הזיות במסמכים: בקש מקלוד <b>קודם לצטט</b> את הקטעים הרלוונטיים, ורק אז להסיק מהם:</p>
<div class="prompt-ex"><div class="pl">פרומפט עיגון</div>קרא את החוזה. תחילה צטט מילה במילה את הסעיפים שעוסקים בסיום ההתקשרות. אחר כך, על סמך הציטוטים בלבד, הסבר לי בשפה פשוטה: מה התנאים ליציאה מהחוזה ומה הקנסות?</div>
<p>כך התשובה "מעוגנת" בטקסט האמיתי ולא בזיכרון כללי של המודל.</p>
<div class="box tip"><b>💡 שאלות המשך ממוקדות</b>אחרי סיכום ראשוני של מסמך, שאל שאלות נקודתיות: "מה המסמך אומר על X?", "האם מוזכר Y?" — עדיף על "ספר לי עוד".</div>
<div class="box try"><b>🚀 נסה עכשיו</b>מצא מסמך ארוך אמיתי (חוזה, פוליסה, תקנון שהסכמת לו פעם...) והרץ עליו את שיטת העיגון: ציטוטים ← מסקנות. תופתע מה מגלים.</div>
`},
{id:"l8",title:"פירוק משימות גדולות ושרשור שלבים",minutes:6,html:`
<h2>מתי פרומפט אחד לא מספיק</h2>
<p>"כתוב לי תוכנית עסקית מלאה" בפרומפט אחד — ייתן ממוצע של הכול. משימות גדולות באמת מרוויחות מ<span class="term">פירוק <span class="en">(Task Decomposition)</span></span>: שלבים נפרדים, כשכל שלב מקבל את מלוא תשומת הלב, ואתה מבקר את התוצר בין שלב לשלב.</p>
<h2>שיטת השרשור <span class="en">(Prompt Chaining)</span></h2>
<p>דוגמה — כתיבת מצגת עסקית:</p>
<ol>
<li><b>שלב מחקר:</b> "אסוף לי את השאלות שמשקיע ישאל על רעיון X. אל תענה עדיין — רק רשימת שאלות."</li>
<li><b>ביקורת שלך:</b> מחק שאלות לא רלוונטיות, הוסף משלך.</li>
<li><b>שלב מבנה:</b> "בנה שלד מצגת של 8 שקפים שעונה על השאלות האלה. רק כותרות ושורת מסר לכל שקף."</li>
<li><b>ביקורת שלך:</b> סדר, איחוד, מחיקה.</li>
<li><b>שלב תוכן:</b> "כתוב את התוכן המלא של שקפים 1–4" ואז 5–8.</li>
</ol>
<p>היתרון הכפול: איכות גבוהה בכל שלב + <b>אתה בשליטה</b> בצמתים במקום לקבל מפלצת מוגמרת שקשה לתקן.</p>
<h2>תנו לקלוד לתכנן קודם</h2>
<p>טכניקה קרובה: לפני ביצוע, בקש תוכנית.</p>
<div class="prompt-ex"><div class="pl">פרומפט תכנון</div>אני רוצה לכתוב מדריך למתחילים על צילום בטלפון. לפני שאתה כותב — הצג לי מתווה: פרקים ונושא מרכזי לכל פרק. נדון במתווה לפני הכתיבה.</div>
<p>העיקרון הזה — <b>קודם תוכנית, אחר כך ביצוע</b> — ילווה אותנו חזק ב-Claude Code, שם יש לו אפילו מצב מובנה (Plan Mode).</p>
<div class="box tip"><b>💡 ותמיד אפשר לשאול את קלוד עצמו</b>לא בטוח איך לפרק? "יש לי משימה: [תיאור]. הצע לי איך לפרק אותה לשלבים שנעבוד עליהם יחד." קלוד מצוין בלתכנן את העבודה עם עצמו.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>בחר משימה גדולה אמיתית שלך ונהל אותה בשרשור: תוכנית ← ביקורת ← ביצוע שלב ראשון. אל תמשיך לשלב הבא בלי לבקר את הקודם.</div>
`}

{id:"l2",title:"מה זה טרמינל? (ולמה לא לפחד ממנו)",minutes:7,html:`
<h2>המסך השחור המפורסם</h2>
<p><span class="term">טרמינל <span class="en">(Terminal)</span></span> — נקרא גם "שורת פקודה" — הוא דרך לדבר עם המחשב <b>בטקסט</b> במקום בעכבר. במקום ללחוץ על אייקונים, מקלידים פקודה ולוחצים Enter. זהו. זה כל הסוד.</p>
<p>למה בכלל צריך את זה? כי Claude Code רץ בתוך טרמינל. החדשות הטובות: <b>אתה לא צריך ללמוד "שפת פקודות"</b> — את הפקודות מקליד קלוד. אתה צריך לדעת בסך הכול: לפתוח טרמינל, להגיע לתיקייה הנכונה, ולהקליד <span class="kbd">claude</span>. שלוש פעולות.</p>
<h2>פתיחת הטרמינל ב-Windows</h2>
<p>ב-Windows יש כלי מובנה בשם <span class="term">PowerShell</span> — זה הטרמינל שנשתמש בו:</p>
<ol>
<li>לחץ על מקשי <span class="kbd">Win + X</span> (מקש חלונות + האות X יחד).</li>
<li>בתפריט שנפתח בחר <b>Windows PowerShell</b> או <b>Terminal</b>.</li>
<li>ייפתח חלון עם טקסט וסמן מהבהב — זהו! אתה בטרמינל.</li>
</ol>
<div class="box warn"><b>⚠️ חשוב: PowerShell ולא CMD</b>ב-Windows יש שני כלים דומים: PowerShell ו-CMD. הם נראים כמעט אותו דבר אבל מבינים פקודות שונות. איך מזהים? הסתכל על תחילת השורה:<br>• PowerShell מציג: <span class="kbd">PS C:\\Users\\asaf&gt;</span> — שים לב ל-<b>PS</b> בהתחלה<br>• CMD מציג: <span class="kbd">C:\\Users\\asaf&gt;</span> — בלי PS<br>אנחנו רוצים את זה <b>עם ה-PS</b>.</div>
<h2>חוקי המשחק בטרמינל</h2>
<ul>
<li><b>מקלידים ולוחצים Enter</b> — כך שולחים פקודה.</li>
<li><b>אין עכבר בפנים</b> — ניווט בחיצים במקלדת.</li>
<li><b>הדבקה:</b> קליק ימני בעכבר או <span class="kbd">Ctrl + V</span>.</li>
<li><b>אם נתקעת</b> — אפשר פשוט לסגור את החלון ולפתוח חדש. שום דבר רע לא יקרה.</li>
</ul>
<h2>שתי פקודות שכדאי להכיר (וזהו!)</h2>
<p><span class="kbd">cd</span> — קיצור של Change Directory, "עבור לתיקייה". למשל: <span class="kbd">cd Desktop</span> עובר לתיקיית שולחן העבודה.</p>
<p><span class="kbd">dir</span> — "מה יש בתיקייה הזו?" מציג את רשימת הקבצים.</p>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>פתח PowerShell עם <span class="kbd">Win + X</span>, הקלד <span class="kbd">dir</span> ולחץ Enter. ראית את רשימת הקבצים? מזל טוב — הרצת את הפקודה הראשונה שלך בטרמינל. 🎉</div>
`},
{id:"l3",title:"התקנת Claude Code ב-Windows — צעד אחר צעד",minutes:8,html:`
<h2>לפני שמתחילים</h2>
<p>ההתקנה לוקחת בערך 5 דקות. תצטרך: חיבור אינטרנט, ואת חשבון הקלוד שלך (המייל והסיסמה שאתה מתחבר איתם ל-claude.ai).</p>
<h2>שלב 1: התקנת Git for Windows (מומלץ, חד-פעמי)</h2>
<p><span class="term">Git</span> הוא כלי עזר שנותן ל-Claude Code יכולות נוספות (סביבת עבודה משופרת ומעקב גרסאות — נלמד עליו במודול 5). לא חייבים, אבל מומלץ רשמית:</p>
<ol>
<li>גלוש אל <b>git-scm.com/downloads/win</b> והורד את המתקין.</li>
<li>הפעל אותו ולחץ Next בכל המסכים — <b>ברירות המחדל מצוינות</b>, אין צורך לשנות כלום.</li>
</ol>
<h2>שלב 2: התקנת Claude Code עצמו</h2>
<ol>
<li>פתח PowerShell (<span class="kbd">Win + X</span> — זוכר?).</li>
<li>העתק את השורה הבאה, הדבק בטרמינל (קליק ימני) ולחץ Enter:</li>
</ol>
<div class="code">irm https://claude.ai/install.ps1 | iex</div>
<p>מה השורה הזו עושה? מורידה את תוכנת ההתקנה הרשמית מהאתר של קלוד ומריצה אותה. תראה טקסט רץ על המסך — זו ההתקנה בפעולה. בסיום תופיע ההודעה: <b>"Claude Code successfully installed!"</b></p>
<h2>שלב 3: בדיקה שהכול תקין</h2>
<p>הקלד:</p>
<div class="code">claude --version</div>
<p>אם קיבלת מספר גרסה (למשל <span class="kbd">2.1.211 (Claude Code)</span>) — ההתקנה הצליחה! 🎉</p>
<h2>פתרון תקלות נפוצות</h2>
<div class="box warn"><b>⚠️ "claude is not recognized"</b>המחשב עדיין לא מכיר את הפקודה. הפתרון: העתק את שתי השורות האלה ל-PowerShell (יחד), לחץ Enter, ואז <b>סגור את החלון ופתח PowerShell חדש</b>:<div class="code">$currentPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
[Environment]::SetEnvironmentVariable('PATH', "$currentPath;$env:USERPROFILE\\.local\\bin", 'User')</div></div>
<div class="box warn"><b>⚠️ "irm is not recognized"</b>אתה ב-CMD ולא ב-PowerShell (אין PS בתחילת השורה). סגור את החלון ופתח את הנכון: <span class="kbd">Win + X</span> ← Windows PowerShell.</div>
<div class="box warn"><b>⚠️ שגיאת SSL/TLS</b>קורה במחשבי Windows ישנים. הרץ קודם את השורה הזו ואז נסה שוב את פקודת ההתקנה:<div class="code">[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12</div></div>
<div class="box tip"><b>💡 עדכונים? אוטומטיים</b>ההתקנה בשיטה הזו מתעדכנת לבד ברקע. התקנת פעם — שכחת מזה.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>בצע את ההתקנה לפי השלבים למעלה ואמת עם <span class="kbd">claude --version</span>. נתקעת? פינת פתרון התקלות מכסה את רוב המקרים — וזה בדיוק התרגיל הראשון של המודול.</div>
`},
{id:"l4",title:"תיקיית עבודה: המושג שהכי חשוב להבין",minutes:6,html:`
<h2>למה זה קריטי?</h2>
<p>כשמפעילים את Claude Code, הוא עובד <b>בתוך תיקייה מסוימת</b> במחשב — זו נקראת <span class="term">תיקיית העבודה <span class="en">(Working Directory)</span></span>. קלוד רואה את הקבצים שבה, יוצר בה קבצים חדשים, ומתייחס אליה כאל "שולחן העבודה" שלו למשימה הנוכחית.</p>
<p>לכן לפני שמפעילים את קלוד, צריך "להוביל" את הטרמינל לתיקייה הנכונה. זה כל הסיפור של פקודת <span class="kbd">cd</span>.</p>
<h2>מהו 'נתיב' (Path)?</h2>
<p><span class="term">נתיב <span class="en">(Path)</span></span> הוא הכתובת של תיקייה במחשב, למשל: <span class="kbd">C:\\Users\\asaf\\Documents\\projects</span> — כלומר: כונן C, תיקיית Users, בתוכה asaf, בתוכה Documents, בתוכה projects.</p>
<h2>העבודה בפועל — שלושה תרחישים</h2>
<h3>תרחיש א': ליצור תיקייה חדשה לפרויקט חדש</h3>
<div class="code">mkdir my-project
cd my-project</div>
<p><span class="kbd">mkdir</span> יוצרת תיקייה חדשה (Make Directory), ו-<span class="kbd">cd</span> נכנסת אליה.</p>
<h3>תרחיש ב': להגיע לתיקייה קיימת</h3>
<div class="code">cd C:\\Users\\asaf\\Documents\\my-project</div>
<p>אפשר להקליד את הנתיב המלא. טיפ: הקלד <span class="kbd">cd</span> ורווח, ואז <b>גרור את התיקייה מסייר הקבצים אל חלון הטרמינל</b> — הנתיב יוקלד לבד!</p>
<h3>תרחיש ג': הדרך הקלה מכולן</h3>
<p>פתח את התיקייה ב<b>סייר הקבצים</b> הרגיל, לחץ קליק ימני על רקע ריק בתוכה, ובחר <b>"Open in Terminal"</b> — הטרמינל ייפתח כבר בתוך התיקייה. 🎯</p>
<div class="box warn"><b>⚠️ כלל בטיחות חשוב</b>אל תפעיל את קלוד ישירות בתיקיות רגישות כמו כל שולחן העבודה או כל תיקיית המסמכים. צור תיקיית פרויקט ייעודית לכל משימה — כך קלוד רואה ונוגע רק במה שרלוונטי. סדר = בטיחות.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>צור תיקייה חדשה בשם <span class="kbd">claude-projects</span> בתיקיית המסמכים שלך (אפשר בסייר הקבצים הרגיל), פתח בה טרמינל בקליק ימני ← Open in Terminal, והקלד <span class="kbd">dir</span> לוודא שאתה בפנים (היא אמורה להיות ריקה).</div>
`},
{id:"l5",title:"ההפעלה הראשונה: התחברות, פרומפט, הרשאות",minutes:8,html:`
<h2>מפעילים!</h2>
<p>עומדים בתיקיית העבודה (השיעור הקודם)? מקלידים:</p>
<div class="code">claude</div>
<p>בפעם הראשונה קלוד יבקש <b>להתחבר לחשבון</b>: ייפתח דפדפן, תתחבר עם חשבון הקלוד שלך (זה עם ה-Pro), תאשר — וחוזרים לטרמינל. ההתחברות נשמרת; לא תצטרך לחזור על זה.</p>
<p>עכשיו תראה את מסך הפתיחה של Claude Code: הגרסה, המודל, ותיקיית העבודה הנוכחית — ותיבת הקלדה מחכה לך. אתה בפנים! 🎉</p>
<h2>הפרומפט הראשון</h2>
<p>פשוט כותבים בעברית, כמו בצ'אט:</p>
<div class="prompt-ex"><div class="pl">נסה את זה</div>צור לי דף אינטרנט פשוט שאומר "שלום עולם" בעברית, עם רקע צבעוני יפה</div>
<p>שים לב מה קורה: קלוד <b>מספר לך מה הוא מתכנן</b>, יוצר קובץ, ובסוף מדווח. בתיקייה שלך יופיע קובץ HTML חדש — לחץ עליו פעמיים בסייר הקבצים והדף ייפתח בדפדפן. <b>בנית את זה.</b></p>
<h2>אישור פעולות — מנגנון הבטיחות</h2>
<p>בסשן הראשון קלוד <b>שואל לפני כל שינוי</b>: "ליצור את הקובץ הזה?" עם אפשרויות Yes/No. בחר עם החיצים ואשר ב-Enter. זה מנגנון ה<span class="term">הרשאות <span class="en">(Permissions)</span></span> — אתה תמיד בשליטה על מה קלוד עושה במחשב שלך.</p>
<p>בהמשך, במנוי Pro, מופעל כברירת מחדל <b>מצב אוטומטי</b> חכם: פעולות שגרתיות ובטוחות מאושרות אוטומטית, ופעולות רגישות עדיין נעצרות לאישורך. אפשר להחליף מצב הרשאות בכל רגע עם <span class="kbd">Shift + Tab</span>.</p>
<div class="box tip"><b>💡 שלושת המקשים שחייבים להכיר</b><br>• <span class="kbd">Esc</span> — עוצר את קלוד באמצע פעולה. מקש החירום שלך.<br>• <span class="kbd">Enter</span> — שולח הודעה / מאשר.<br>• <span class="kbd">Shift + Tab</span> — מחליף מצב הרשאות.</div>
<h2>יציאה וכניסה</h2>
<p>יוצאים: מקלידים <span class="kbd">/exit</span> או לוחצים <span class="kbd">Ctrl + D</span> פעמיים. חוזרים מחר? נכנסים לאותה תיקייה, מקלידים <span class="kbd">claude</span>, והכול חוזר — כולל האפשרות להמשיך את השיחה הקודמת.</p>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>בתיקיית claude-projects שיצרת: הקלד claude, התחבר, ובקש את דף "שלום עולם". פתח את הקובץ שנוצר בדפדפן. זו רגע ההיסטוריה הפרטי שלך 😄</div>
`},
{id:"l6",title:"הפקודות החיוניות ליום-יום",minutes:6,html:`
<h2>שני סוגי פקודות</h2>
<p>יש להבדיל בין שתי משפחות:</p>
<p><b>1. פקודות טרמינל</b> — מקלידים אותן <i>לפני</i> שנכנסים לקלוד (או אחרי יציאה):</p>
<div class="tbl-wrap"><table class="cmp">
<tr><th>פקודה</th><th>מה היא עושה</th></tr>
<tr><td><span class="kbd">claude</span></td><td>פתיחת סשן חדש</td></tr>
<tr><td><span class="kbd">claude -c</span></td><td>המשך השיחה האחרונה בתיקייה הזו (Continue)</td></tr>
<tr><td><span class="kbd">claude -r</span></td><td>בחירת שיחה קודמת מרשימה (Resume)</td></tr>
<tr><td><span class="kbd">claude "משימה"</span></td><td>פתיחת סשן שמתחיל ישר מהמשימה</td></tr>
</table></div>
<p><b>2. פקודות סשן</b> — מקלידים אותן <i>בתוך</i> קלוד, תמיד מתחילות ב-<span class="kbd">/</span> (לוכסן):</p>
<div class="tbl-wrap"><table class="cmp">
<tr><th>פקודה</th><th>מה היא עושה</th></tr>
<tr><td><span class="kbd">/help</span></td><td>עזרה — כל הפקודות הזמינות</td></tr>
<tr><td><span class="kbd">/clear</span></td><td>ניקוי השיחה — התחלה נקייה (חשוב בין משימות!)</td></tr>
<tr><td><span class="kbd">/resume</span></td><td>מעבר לשיחה קודמת</td></tr>
<tr><td><span class="kbd">/exit</span></td><td>יציאה</td></tr>
</table></div>
<div class="box tip"><b>💡 הרגל זהב: /clear בין משימות</b>זוכר את חלון ההקשר ממודול 1? סיימת משימה ומתחיל אחרת? הקלד <span class="kbd">/clear</span>. שיחה נקייה = קלוד ממוקד, מהיר ומדויק יותר.</div>
<h2>קיצורים שווים</h2>
<ul>
<li>הקלדת <span class="kbd">/</span> לבד מציגה את כל הפקודות והכישורים הזמינים — תפריט חי.</li>
<li>חץ למעלה <span class="kbd">↑</span> — דפדוף בהודעות קודמות שלך.</li>
<li><span class="kbd">Esc</span> — עצירת קלוד באמצע. שווה לחזור ולהדגיש: אתה תמיד יכול לעצור.</li>
</ul>
<h2>ואפשר גם לדבר איתו על... עצמו</h2>
<p>קלוד מכיר את היכולות של עצמו. שאלות לגיטימיות לגמרי בתוך הסשן:</p>
<div class="prompt-ex"><div class="pl">נסה</div>מה אתה יכול לעשות? איך כדאי לי לנסח בקשות אליך? מה זה CLAUDE.md?</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>פתח סשן, הקלד <span class="kbd">/</span> וגלול בתפריט הפקודות. אחר כך שאל את קלוד עצמו: "מה שלוש היכולות הכי שימושיות שלך למי שלא יודע לתכנת?"</div>
`},
{id:"l7",title:"הפרויקט האמיתי הראשון: אתר אישי מאפס",minutes:8,html:`
<h2>הגיע הזמן לבנות משהו אמיתי</h2>
<p>בשיעור הזה נלמד את <b>שיטת העבודה</b> הנכונה על פרויקט עם Claude Code — דרך בניית אתר אישי. את הביצוע המלא תעשה בתרגיל; כאן נבין את העקרונות.</p>
<h2>עיקרון 1: תיקייה חדשה לכל פרויקט</h2>
<div class="code">mkdir my-site
cd my-site
claude</div>
<h2>עיקרון 2: לתאר את התוצאה, לא את הקוד</h2>
<p>אתה לא צריך לדעת איך בונים אתר — אתה צריך לדעת מה אתה רוצה שיהיה בו:</p>
<div class="prompt-ex"><div class="pl">פרומפט פתיחה טוב</div>בנה לי אתר אישי בעברית: דף אחד עם השם שלי, כמה מילים עליי, רשימת תחביבים, ודרכי יצירת קשר. עיצוב מודרני ונקי בגווני כחול כהה, מותאם גם לטלפון. שהכול יהיה בקובץ אחד שאפשר לפתוח בדפדפן.</div>
<p>שים לב — כל מה שלמדנו במודול 3 עובד כאן: ספציפיות, הקשר, פורמט.</p>
<h2>עיקרון 3: לבדוק, לתת משוב, לחזור</h2>
<p>קלוד יצר? פתח את הקובץ בדפדפן. עכשיו מתחיל הריקוד האמיתי — סבבי שיפור:</p>
<div class="prompt-ex"><div class="pl">משוב טוב הוא ספציפי</div>הכותרת גדולה מדי בטלפון. תקטין אותה במסכים צרים. וגם: תוסיף כפתור וואטסאפ צף בפינה שפותח שיחה עם המספר 050-1234567.</div>
<h2>עיקרון 4: כשמשהו נשבר — מדביקים את השגיאה</h2>

<h2>עיקרון 5: לבקש מקלוד לבדוק את עצמו</h2>

<p>זהו קובץ טקסט פשוט שיושב בתיקיית הפרויקט. קלוד קורא אותו <b>אוטומטית בתחילת כל סשן</b> — בלי שתבקש. שמים בו את כל מה שחשוב שקלוד יידע תמיד:</p>
<ul>
<li>מה הפרויקט הזה ומה מטרתו</li>
<li>כללי עבודה ("כל הטקסטים בעברית", "עיצוב בגווני כחול", "אל תיגע בתיקיית X")</li>
<li>החלטות שהתקבלו ("בחרנו שהאתר יהיה בקובץ אחד")</li>
<li>העדפות שלך ("הסבר לי כל מונח טכני חדש")</li>
</ul>
<h2>איך יוצרים אותו? מבקשים מקלוד!</h2>
<div class="prompt-ex"><div class="pl">בתוך סשן בפרויקט</div>צור קובץ CLAUDE.md לפרויקט הזה. כלול: תיאור הפרויקט, כללי העבודה שסיכמנו (עברית, קובץ אחד, עיצוב כחול), והעדפה שלי — להסביר לי מונחים טכניים בפשטות.</div>
<p>יש גם פקודה מובנית — <span class="kbd">/init</span> — שסורקת את הפרויקט ובונה CLAUDE.md ראשוני אוטומטית.</p>
<h2>טיפ מקצועי: עדכון שוטף</h2>
<p>קיבלת מקלוד התנהגות שאתה רוצה שתחזור תמיד? אמור: "מעכשיו תמיד תעשה כך — <b>הוסף את זה ל-CLAUDE.md</b>". כך הפרויקט "לומד" ומשתפר מסשן לסשן.</p>
<div class="box info"><b>ℹ️ וגם זיכרון אוטומטי</b>מעבר לקובץ שאתה שולט בו, Claude Code בונה גם זיכרון אוטומטי משלו — תובנות שהוא שומר תוך כדי עבודה ונשמרות בין סשנים. השילוב של שניהם הופך אותו לשותף שמכיר אותך יותר ויותר.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>פתח סשן בפרויקט האתר שלך ממודול 4 והקלד /init. פתח את הקובץ שנוצר וקרא — זה הזיכרון החדש של הפרויקט. ערוך והוסף העדפה אישית אחת.</div>
`},
{id:"l2",title:"מצב תכנון ונקודות שמירה: עבודה בלי חרדה",minutes:7,html:`
<h2>Plan Mode: קודם תוכנית, אחר כך ביצוע</h2>
<p>זוכר את העיקרון ממודול 3 — לבקש מתווה לפני תוצר? ל-Claude Code יש מצב מובנה בדיוק לזה: <span class="term">מצב תכנון <span class="en">(Plan Mode)</span></span>. במצב הזה קלוד <b>לא נוגע בשום קובץ</b> — הוא רק חוקר, חושב ומציג תוכנית. רק כשאתה מאשר, הוא מבצע.</p>
<p>מפעילים עם <span class="kbd">Shift + Tab</span> (מחזוריות בין מצבי ההרשאות, ביניהם Plan) או פשוט מבקשים: "אל תבצע עדיין — תכין תוכנית ותציג לי".</p>
<p><b>מתי להשתמש?</b> בכל משימה גדולה או מסוכנת: שינוי מבנה, מחיקות, פיצ'ר מורכב. משימות קטנות — ישר לביצוע.</p>
<h2>נקודות שמירה: כפתור ה'ביטול' הגדול</h2>
<p>Claude Code שומר אוטומטית <span class="term">נקודות שמירה <span class="en">(Checkpoints)</span></span> של מצב הקבצים לפני שינויים. עשה שינוי גדול והתחרטת? אפשר להתגלגל אחורה למצב קודם — כמו Ctrl+Z ברמת הפרויקט. הקלד <span class="kbd">/rewind</span> או לחץ פעמיים <span class="kbd">Esc</span> כדי לפתוח את חלון החזרה אחורה.</p>
<div class="box tip"><b>💡 המשמעות הפסיכולוגית</b>שני הכלים האלה משחררים את הפחד הכי גדול של מתחילים — "מה אם אהרוס משהו?". תוכנית לפני ביצוע + יכולת חזרה אחורה = חופש להתנסות.</div>
<h2>ניהול סשנים כמו מקצוען</h2>
<ul>
<li><span class="kbd">claude -c</span> — המשך מהנקודה האחרונה בתיקייה הנוכחית.</li>
<li><span class="kbd">claude -r</span> — תפריט שיחות קודמות של הפרויקט, לבחירה.</li>
<li>סשן ארוך שמתחיל "להתבלבל"? התחל סשן נקי — ה-CLAUDE.md ישמור על ההקשר החשוב.</li>
</ul>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>בפרויקט האתר: עבור למצב תכנון (Shift+Tab עד Plan), בקש "תכנן הוספת אזור גלריית תמונות". קרא את התוכנית, אשר, ותן לו לבצע. אחר כך נסה /rewind לראות את מסך החזרה אחורה.</div>
`},
{id:"l3",title:"Git ו-GitHub בשפה פשוטה: גיבוי, היסטוריה, ופרסום לעולם",minutes:8,html:`
<h2>מה זה Git? מכונת זמן לפרויקט</h2>
<p><span class="term">Git</span> (שהתקנת במודול 4!) הוא כלי שמנהל <b>היסטוריית גרסאות</b>: בכל נקודה שתבחר, שומרים "תמונת מצב" של הפרויקט — <span class="term">Commit</span> — עם תיאור קצר. התוצאה: יומן מסודר של כל התפתחות הפרויקט, ויכולת לחזור לכל גרסה אי פעם.</p>
<p>והחלק הכי טוב: <b>אתה לא צריך ללמוד פקודות Git.</b> קלוד מפעיל אותו בשבילך בשפה חופשית:</p>
<div class="prompt-ex"><div class="pl">ככה זה נראה</div>שמור נקודת גרסה של מה שעשינו עם תיאור מתאים<br>—<br>מה השתנה מאז הגרסה הקודמת?<br>—<br>תחזיר אותי לגרסה של אתמול</div>
<h2>מה זה GitHub? הבית של הפרויקטים באינטרנט</h2>
<p><span class="term">GitHub</span> הוא אתר (בבעלות מיקרוסופט) שבו מאחסנים פרויקטי Git בענן. בשבילך הוא נותן שני דברים ענקיים:</p>
<ul>
<li><b>גיבוי בענן</b> — הפרויקט שמור גם אם המחשב יתקלקל.</li>
<li><b>GitHub Pages</b> — שירות <b>חינמי</b> שהופך פרויקט לאתר חי באינטרנט! זו הדרך שבה תפרסם את מה שאתה בונה — כולל להתקין את אפליקציית הלימוד הזו בטלפון שלך.</li>
</ul>
<h2>התהליך בפועל (עם קלוד כנהג)</h2>
<ol>
<li>פתח חשבון חינמי ב-<b>github.com</b> (אימייל + סיסמה, כמו כל אתר).</li>
<li>בסשן קלוד, בקש: "העלה את הפרויקט הזה ל-GitHub ופרסם אותו כאתר חי ב-GitHub Pages".</li>
<li>קלוד ידריך אותך בחיבור החשבון (חד-פעמי) ויעשה את השאר.</li>
<li>בסוף תקבל כתובת בסגנון <span class="kbd">yourname.github.io/my-site</span> — אתר אמיתי ברשת!</li>
</ol>
<div class="box warn"><b>⚠️ פרטיות</b>פרויקט ב-GitHub יכול להיות ציבורי (כולם רואים) או פרטי (רק אתה). אמור לקלוד מה אתה רוצה. אתר GitHub Pages הוא תמיד ציבורי — אל תפרסם בו מידע אישי רגיש.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>פתח חשבון GitHub אם אין לך. בתרגילי המודול נעלה את האתר שלך לרשת — צעד-צעד עם קלוד.</div>
`},
{id:"l4",title:"סוכני משנה: צוות עובדים במקום עובד אחד",minutes:6,html:`
<h2>מה זה סוכן משנה?</h2>
<p>במשימות גדולות, קלוד יכול לפצל את העבודה ל<span class="term">סוכני משנה <span class="en">(Subagents)</span></span> — עותקים נוספים של קלוד שכל אחד מקבל תת-משימה, עובד עליה במקביל לאחרים, ומחזיר תוצאה. קלוד הראשי מתאם ומאחד.</p>
<p>דמיין: במקום עובד אחד שעושה הכול בתור, מנהל שמפעיל צוות — אחד חוקר, שני בונה, שלישי בודק.</p>
<h2>מה זה נותן לך בפועל?</h2>
<ul>
<li><b>מהירות</b> — עבודה במקביל במקום בטור.</li>
<li><b>מיקוד</b> — כל סוכן עם הקשר נקי משלו, בלי "רעש" מהמשימות האחרות.</li>
<li><b>איכות</b> — אפשר להקצות סוכן שכל תפקידו לבקר את העבודה של האחרים.</li>
</ul>
<h2>איך מפעילים?</h2>
<p>ברוב המקרים — קלוד מחליט לבד מתי לפצל עבודה. אבל אפשר לבקש במפורש:</p>
<div class="prompt-ex"><div class="pl">בקשה מפורשת</div>המשימה גדולה: בדוק את כל 5 העמודים באתר שלי. הפעל סוכני משנה במקביל — אחד לכל עמוד — שכל אחד יבדוק קישורים, עברית ותצוגת מובייל. רכז לי את כל הממצאים בטבלה.</div>
<div class="box info"><b>ℹ️ יש גם רמות מתקדמות</b>מקצוענים מגדירים סוכנים מותאמים עם תפקידים קבועים (בודק, מתעד, מעצב...), מריצים כמה סשנים מלאים במקביל, ואפילו צוותים שלמים. בשלב הזה מספיק שתדע: כשמשימה גדולה — אפשר לבקש חלוקת עבודה.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>בקש מקלוד משימה מקבילה: "צור 3 הצעות עיצוב שונות לכותרת האתר שלי — הפעל סוכן לכל הצעה — ואז הצג לי השוואה". שים לב לדיווח על הסוכנים הרצים.</div>
`},
{id:"l5",title:"Hooks: פעולות שקורות תמיד, אוטומטית",minutes:5,html:`
<h2>הרעיון</h2>
<p><span class="term">Hook <span class="en">(וו)</span></span> הוא כלל אוטומטי בסגנון: "בכל פעם שקורה X — עשה Y". להבדיל מבקשה בשיחה (שקלוד עשוי לשכוח בסשן הבא), Hook הוא <b>חוק מערכת</b>: הוא רץ תמיד, אוטומטית, בלי תלות בזיכרון של קלוד.</p>
<h2>דוגמאות קלאסיות</h2>
<ul>
<li>"אחרי כל שינוי בקובץ — שמור עותק גיבוי"</li>
<li>"בסיום כל משימה — השמע צליל התראה"</li>
<li>"לפני כל מחיקת קובץ — עצור ובקש אישור מיוחד"</li>
<li>"אחרי כל שינוי — בדוק שאין שגיאות בקובץ"</li>
</ul>
<h2>איך יוצרים Hook? מבקשים מקלוד</h2>
<p>כמו תמיד — לא צריך להבין את הטכני. מתארים את הכלל:</p>
<div class="prompt-ex"><div class="pl">פרומפט לדוגמה</div>הגדר לי Hook בפרויקט הזה: בכל פעם שאתה מסיים משימה, הצג לי סיכום קצר של הקבצים ששונו.</div>
<p>קלוד יגדיר את הכלל בקובץ ההגדרות של הפרויקט, ומאותו רגע הוא פועל אוטומטית.</p>
<div class="box tip"><b>💡 מתי Hook ומתי CLAUDE.md?</b>הנחיה שקלוד אמור לזכור ("כתוב בעברית") ← CLAUDE.md. פעולה שחייבת לקרות תמיד, מכנית, בלי יוצא מהכלל ("גבה כל קובץ לפני שינוי") ← Hook. ההבדל: המלצה לעומת חוק.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>שאל את קלוד בסשן: "אילו Hooks היו שימושיים לפרויקט הזה? תציע 3 והסבר". בחר אחד — ובקש להגדיר אותו.</div>
`},
{id:"l6",title:"Plugins: יכולות מוכנות בהתקנת קליק",minutes:5,html:`
<h2>חנות התוספים של Claude Code</h2>
<p><span class="term">Plugin <span class="en">(תוסף)</span></span> הוא חבילה מוכנה שמרחיבה את קלוד: אוסף של כישורים (Skills), פקודות, סוכנים מוגדרים וחיבורים — שמישהו אחר כבר בנה, ואתה מתקין בפקודה אחת. יש <span class="term">Marketplace</span> — מאגר תוספים רשמי וקהילתי.</p>
<h2>למה זה טוב?</h2>
<p>במקום להגדיר בעצמך "סוכן שמבקר עיצוב" או "פקודת סיכום ישיבות" — ייתכן שמישהו כבר בנה בדיוק את זה, מלוטש ובדוק. חוכמת הקהל עובדת בשבילך.</p>
<h2>איך מתחילים?</h2>
<div class="prompt-ex"><div class="pl">בתוך סשן</div>אילו Plugins מומלצים יש עבור [סוג העבודה שלך]? הצג לי אפשרויות מה-Marketplace והסבר מה כל אחד נותן.</div>
<p>ההתקנה עצמה נעשית בפקודת <span class="kbd">/plugin</span> — וקלוד ישמח להדריך.</p>
<div class="box warn"><b>⚠️ מתקינים בחוכמה</b>תוסף מקבל השפעה על סביבת העבודה שלך. העדף תוספים רשמיים או פופולריים ומוכרים, וקרא מה התוסף עושה לפני התקנה. בדיוק כמו אפליקציות בטלפון.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>הקלד /plugin בסשן וגלה את מסך ניהול התוספים. רק להסתכל — עוד לא חייבים להתקין כלום.</div>
`},
{id:"l7",title:"אוטומציה אמיתית: קלוד עובד כשאתה ישן",minutes:7,html:`
<h2>הקפיצה הגדולה: ממשימות למערכות</h2>
<p>עד עכשיו — אתה יושב מול קלוד ועובדים יחד. הרמה הבאה: משימות שרצות <b>בלעדיך</b>, בזמנים קבועים או כתגובה לאירועים.</p>
<h3>🕐 משימות מתוזמנות בדסקטופ</h3>
<p>באפליקציית הדסקטופ אפשר להגדיר משימות חוזרות שרצות על המחשב שלך: "כל בוקר ב-8:00 — סדר את תיקיית ההורדות", "כל יום ראשון — הכן סיכום שבועי של הקבצים החדשים".</p>
<h3>☁️ שגרות (Routines) בענן</h3>
<p><span class="term">Routine</span> היא משימה מתוזמנת שרצה <b>בענן</b> — גם כשהמחשב כבוי. מגדירים עם הפקודה <span class="kbd">/schedule</span> או מהאתר. למשל: "כל בוקר, בדוק חדשות בתחום שלי והכן לי סיכום".</p>
<h3>⚡ הרצה חד-פעמית בפקודה (למתקדמים)</h3>
<p>אפשר להריץ את קלוד ישירות משורת הפקודה בלי שיחה, עם הדגל <span class="kbd">-p</span>:</p>
<div class="code">claude -p "ספור כמה קבצי תמונה יש בתיקייה הזו ורשום את התוצאה בקובץ report.txt"</div>
<p>למה זה מעניין? כי כך משלבים את קלוד בתוך אוטומציות אחרות — הוא הופך מ"תוכנה שמדברים איתה" ל"פועל שאפשר לזמן מכל מקום".</p>
<h2>עיקרון הבטיחות באוטומציה</h2>
<div class="box warn"><b>⚠️ התחל בקטן ובצפייה</b>משימה אוטומטית רצה בלי הפיקוח שלך. לכן: (1) נסח אותה שתדווח ולא תמחק ("העבר לתיקיית ארכיון" ולא "מחק"), (2) הרץ אותה ידנית כמה פעמים לפני שמתזמנים, (3) בדוק את התוצאות בימים הראשונים.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>חשוב על משימה שאתה עושה ידנית כל שבוע. בתרגיל 3 נהפוך אחת כזו לאוטומציה אמיתית.</div>
`},
{id:"l8",title:"עבודה מכל מקום: הטלפון פוגש את המחשב",minutes:5,html:`
<h2>הסשן שלך לא כבול למסך אחד</h2>
<p>Claude Code בנוי כך שהעבודה זורמת בין המכשירים שלך:</p>
<h3>📱 Remote Control — שליטה מהטלפון בסשן שרץ במחשב</h3>

<li><b>מנתח</b> את הבקשה ובונה תוכנית (תראה אותה על המסך)</li>
<li><b>מפרק</b> לעבודה מסודרת — לפעמים עם תתי-סוכנים במקביל</li>
<li><b>מבצע</b>: קורא, יוצר ומעדכן קבצים; מריץ חישובים בסביבה מבודדת</li>
<li><b>מדווח</b> ומגיש את התוצרים</li>
</ol>
<h2>דוגמאות למשימות ראשונות מצוינות</h2>
<div class="prompt-ex"><div class="pl">ארגון</div>עבור על תיקיית הסריקות שלי. זהה מה כל מסמך (חשבונית, תעודה, מכתב...), תן שמות ברורים בעברית עם תאריך, ומיין לתת-תיקיות לפי סוג. הצג לי תוכנית לפני שאתה מבצע.</div>
<div class="prompt-ex"><div class="pl">מסמך מקבצים</div>יש בתיקייה הזו 4 קבצים עם הערות שכתבתי. אחד אותם למסמך Word מסודר אחד עם כותרות, בעברית תקנית, מוכן לשליחה.</div>
<div class="prompt-ex"><div class="pl">מחקר</div>חקור עבורי השוואה בין 3 תוכנות ניהול חשבונות לעסק קטן בישראל. הכן מסמך השוואה עם טבלה, יתרונות וחסרונות, והמלצה מנומקת.</div>
<h2>העיקרון החשוב: תוצאה, לא הוראות</h2>
<p>שים לב לניסוחים — הם מתארים <b>מה רוצים בסוף</b>, לא איך לעשות. זה הראש הנכון ב-Cowork: תן יעד ותן לקלוד לנווט. (כל עקרונות מודול 3 עדיין תקפים — ספציפיות לגבי התוצאה!)</p>
<div class="box tip"><b>💡 'הצג תוכנית לפני ביצוע'</b>במשימות שנוגעות בקבצים אמיתיים — הוסף את המשפט הזה. תקבל תוכנית, תאשר או תתקן, ורק אז הוא יגע בקבצים. מוכר לך ממודול 5? אותו עיקרון בדיוק.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>צור תיקיית ניסוי עם כמה עותקים של קבצים אמיתיים, ותן ל-Cowork משימת ארגון עם 'הצג תוכנית לפני ביצוע'. עקוב איך הוא עובד.</div>
`},
{id:"l3",title:"תוצרים מקצועיים: Excel, Word, PowerPoint",minutes:6,html:`
<h2>הקסם האמיתי של Cowork</h2>
<p>אחת היכולות הבולטות: Cowork מייצר <b>קבצי Office אמיתיים ומלוטשים</b> — לא טקסט שאתה מעתיק, אלא קבצים מוכנים:</p>
<ul>
<li>📊 <b>Excel</b> — גיליונות עם נוסחאות עובדות, עיצוב וגרפים</li>
<li>📝 <b>Word</b> — מסמכים מעוצבים עם כותרות, תוכן עניינים ועימוד</li>
<li>🎤 <b>PowerPoint</b> — מצגות שלמות עם עיצוב</li>
<li>📄 <b>PDF</b> — קריאה, מיזוג ויצירה</li>
</ul>
<h2>דוגמאות מהחיים</h2>
<div class="prompt-ex"><div class="pl">מעקב הוצאות</div>בנה לי קובץ Excel למעקב הוצאות הבית: גיליון לכל חודש, קטגוריות בעברית, נוסחאות סיכום אוטומטיות, וגיליון שנתי מרכז עם גרף עוגה של ההתפלגות.</div>
<div class="prompt-ex"><div class="pl">ממסמכים למצגת</div>קרא את שני מסמכי ה-Word בתיקייה והכן מהם מצגת של 8 שקפים לישיבת הצוות: תמציתית, עם נקודות מפתח, בעיצוב נקי בכחול.</div>
<div class="prompt-ex"><div class="pl">מטבלה לדוח</div>קח את קובץ האקסל של המכירות, נתח מגמות, והכן דוח Word של עמוד אחד עם 3 התובנות המרכזיות וגרף.</div>
<h2>עבודה על קבצים קיימים</h2>
<p>לא רק יצירה — גם עדכון: "הוסף לקובץ האקסל הקיים עמודת מע\"מ מחושבת", "תקן את העיצוב במצגת שתהיה אחידה". קלוד פותח, מעדכן ושומר.</p>
<div class="box tip"><b>💡 תבניות חוזרות = זהב</b>בנית פורמט דוח שאתה אוהב? שמור אותו ובקש בפעם הבאה: "הכן את הדוח החודשי לפי המבנה של הקובץ המצורף עם הנתונים החדשים". עקביות מושלמת בשניות.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>בקש מ-Cowork קובץ Excel אמיתי שחסר לך (מעקב הוצאות? רשימת מלאי? תכנון אירוע?) עם נוסחאות. פתח אותו ב-Excel ובדוק שהנוסחאות עובדות.</div>
`},
{id:"l4",title:"Dispatch, רקע וענן: העמית שעובד גם בלעדיך",minutes:6,html:`
<h2>משימות ברקע</h2>
<p>משימה גדולה ב-Cowork לא דורשת שתשב ותסתכל. שגר אותה — והמשך בעניינים אחרים; קלוד עובד ברקע ותקבל עדכון בסיום. אפשר לנהל <b>כמה משימות במקביל</b> — כמו מנהל עם צוות.</p>
<h2>Dispatch: לשגר ולשכוח</h2>
<p><span class="term">Dispatch</span> הוא מנגנון שיגור המשימות — כולל <b>מהטלפון</b>: נזכרת בדרך שצריך להכין משהו? שלח הודעה, המשימה תרוץ ותחכה לך מוכנה. בנוסף, Dispatch יודע להפעיל את <b>Claude in Chrome</b> — קלוד שפועל בתוך הדפדפן ומבצע פעולות באתרים (מילוי טפסים, איסוף מידע מאתר).</p>
<h2>Cowork בענן ובנייד</h2>
<p>Cowork כבר אינו רק בדסקטופ: סשנים יכולים לרוץ <b>בענן</b> ולהישמר בחשבון שלך — מתחילים בטלפון, ממשיכים במחשב, והקבצים והמצב מסתנכרנים. עבודה על קבצים מקומיים במחשב עדיין דורשת את הדסקטופ, אבל מחקר והכנת מסמכים אפשריים מכל מקום.</p>
<h2>הגנות מובנות</h2>
<p>שווה לדעת מה קורה מאחורי הקלעים: כשקלוד מריץ קוד וחישובים, זה קורה ב<b>סביבה מבודדת</b> (Sandbox) — מופרדת ומוגנת. ובגישה לקבצים — הוא ניגש רק לתיקיות שאישרת. השליטה בידיים שלך.</p>
<div class="box warn"><b>⚠️ אחריות על פעולות ברשת</b>כשקלוד פועל באתרים בשמך (דרך Chrome) — התחל במשימות צפייה ואיסוף בלבד, ואשר ידנית כל פעולה שמשנה משהו (שליחת טופס, רכישה). לעולם אל תיתן לו לבצע פעולות תשלום לבד.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>שגר ל-Cowork משימת מחקר ברקע ("השווה עבורי X ו-Y והכן סיכום") ובינתיים המשך בשלך. חזור כשהוא מסיים.</div>
`},
{id:"l5",title:"Cowork בשיא הכוח: הרחבות ושיטות עבודה",minutes:6,html:`
<h2>ההרחבות שכבר הכרת — עובדות גם כאן</h2>
<p>Cowork נטען עם אותן הרחבות של חשבון ה-claude.ai שלך, דרך <b>Customize</b> (התאמה אישית) בסרגל הצד:</p>
<ul>
<li><b>Connectors</b> — חיבורים לג'ימייל, יומן, דרייב ועוד (מודול 8) — קלוד יכול לשלב אותם במשימות: "עבור על המייל, מצא את החשבוניות מהחודש ורכז באקסל".</li>
<li><b>Skills</b> — כישורים מותאמים שתבנה במודול 7 — Cowork מפעיל אותם אוטומטית כשרלוונטי.</li>
<li><b>Plugins</b> — חבילות מוכנות, כמו ב-Claude Code.</li>
</ul>
<div class="box info"><b>ℹ️ שים לב להבדל קטן</b>Cowork קורא את ההרחבות מחשבון ה-claude.ai שלך (מה שמוגדר ב-Customize) — לא מהתיקיות המקומיות של Claude Code במחשב. Skill שיצרת ל-Claude Code צריך להוסיף גם ב-Customize כדי ש-Cowork יכיר אותו.</div>
<h2>ארגון עבודה: Projects והנחיות</h2>
<p>גם ב-Cowork יש ארגון בפרויקטים, ואפשר להגדיר הנחיות קבועות — גלובליות או ברמת תיקייה. עקרונות מודול 2 חלים כאן במלואם.</p>
<h2>מתכון העבודה המומלץ ב-Cowork</h2>
<ol>
<li><b>תאר תוצאה</b>, לא שלבים ("שיהיה לי דוח X מוכן" ולא "פתח קובץ, כתוב...").</li>
<li><b>בקש תוכנית</b> לפני נגיעה בקבצים אמיתיים.</li>
<li><b>צרף דוגמה</b> כשיש פורמט רצוי (הקובץ מהפעם הקודמת).</li>
<li><b>שגר ברקע</b> משימות ארוכות — אל תשב ותחכה.</li>
<li><b>בדוק את התוצר</b> — אתה העורך הראשי, תמיד (זוכר? Discernment).</li>
</ol>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>תן ל-Cowork משימה משולבת אמיתית: "עבור על תיקיית X, הכן סיכום Word של מה שיש בה + טבלת Excel מרכזת". שתי תבניות תוצר במשימה אחת.</div>
`}
