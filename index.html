{id:"l2",title:"הפקודות שאף אחד לא מכיר — כלים והפתעות",minutes:7,html:`
<h2>כלי איכות מובנים</h2>
<ul>
<li><span class="kbd">/code-review</span> — סקירת נכונות. יש רמות: <span class="kbd">low</span> עד <span class="kbd">max</span>, ו-<span class="kbd">ultra</span> לסקירה רב-סוכנית בענן. דגלים: <span class="kbd">--fix</span> לתיקון אוטומטי, <span class="kbd">--comment</span> להערות בבקשת מיזוג</li>
<li><span class="kbd">/security-review</span> — סריקת פרצות אבטחה בשינוי</li>
<li><span class="kbd">/simplify</span> — סוכני איכות מקבילים לאיתור כפילויות וסיבוכיות</li>
<li><span class="kbd">/test</span> · <span class="kbd">/verify</span> — כתיבת בדיקות ואימות שהתוצר עובד</li>
<li><span class="kbd">/deep-research &lt;שאלה&gt;</span> — <b>זרימת עבודה</b> שמפזרת חיפושי רשת, שולפת מקורות ומחזירה דוח מתועד</li>
</ul>
<h2>אבחון ותחזוקה</h2>
<ul>
<li><span class="kbd">/doctor</span> (או <span class="kbd">/checkup</span>) — בדיקת מערכת מלאה שגם מתקנת. גם מציע גיזומים ל-CLAUDE.md</li>
<li><span class="kbd">/debug</span> — הפעלת יומני אבחון</li>
<li><span class="kbd">/insights</span> — <b>דוח HTML שמנתח את הסשנים האחרונים שלך.</b> מראה איך אתה באמת עובד</li>
<li><span class="kbd">/fewer-permission-prompts</span> — סורק את ההיסטוריה ומציע רשימת היתר שתפסיק אישורים חוזרים</li>
<li><span class="kbd">/import codex</span> — ייבוא הגדרות מכלי קידוד אחרים</li>
</ul>
<h2>התאמה אישית</h2>
<ul>
<li><span class="kbd">/statusline</span> — שורת מצב מותאמת: מודל, הקשר שנותר, עלות</li>
<li><span class="kbd">/theme</span> · <span class="kbd">/color</span> — ערכת נושא, וצבע ייחודי לכל סשן מקביל</li>
<li><span class="kbd">/focus</span> — תצוגה מצומצמת רק למה שחיוני</li>
<li><span class="kbd">/keybindings</span> — עריכת קיצורי המקלדת שלך</li>
</ul>
<h2>ולסיום — ההפתעות</h2>
<div class="box info"><b>🎁 שלוש פקודות שיגרמו לך לחייך</b><br>• <span class="kbd">/powerup</span> — שיעורים אינטראקטיביים שמלמדים אותך יכולות שלא הכרת<br>• <span class="kbd">/radio</span> — פותח את Claude FM, רדיו לו-פיי לעבודה<br>• <span class="kbd">/passes</span> — שיתוף שבוע חינם של Claude Code עם חברים</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>הרץ <span class="kbd">/insights</span> וקבל דוח על איך אתה עובד בפועל. אחר כך <span class="kbd">/powerup</span> — ותן לכלי ללמד אותך את עצמו.</div>
`},

{id:"l3",title:"קיצורי המקלדת שמשנים הכול",minutes:8,html:`
<h2>המקשים שהופכים אותך למהיר</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>קיצור</th><th>מה הוא עושה</th></tr>
<tr><td><span class="kbd">Ctrl+O</span></td><td><b>מציג תמלול מלא</b> — כל קריאת כלי, חותמות זמן והמודל שענה בכל הודעה</td></tr>
<tr><td><span class="kbd">Ctrl+R</span></td><td>חיפוש הפוך בהיסטוריית הפרומפטים שלך — כולל סשנים קודמים</td></tr>
<tr><td><span class="kbd">Ctrl+G</span></td><td><b>פתיחת הפרומפט בעורך הטקסט שלך</b> — לכתיבת פרומפטים ארוכים ולעריכת תוכניות</td></tr>
<tr><td><span class="kbd">Ctrl+B</span></td><td>העברת פקודה רצה לרקע</td></tr>
<tr><td><span class="kbd">Ctrl+T</span></td><td>הצגה/הסתרה של רשימת המשימות של קלוד</td></tr>
<tr><td><span class="kbd">Ctrl+S</span></td><td>החבאת הטיוטה הנוכחית ושחזורה אחר כך</td></tr>
<tr><td><span class="kbd">Ctrl+L</span></td><td>ציור מחדש של המסך כשהתצוגה משתבשת</td></tr>
<tr><td><span class="kbd">Ctrl+X Ctrl+K</span></td><td>עצירת כל סוכני הרקע (פעמיים תוך 3 שניות)</td></tr>
<tr><td><span class="kbd">Alt+P</span></td><td>החלפת מודל בלי לאבד את מה שהקלדת</td></tr>
<tr><td><span class="kbd">Alt+T</span></td><td>הפעלה/כיבוי של חשיבה מורחבת</td></tr>
<tr><td><span class="kbd">Alt+O</span></td><td>הפעלה/כיבוי של מצב מהיר</td></tr>
<tr><td><span class="kbd">?</span></td><td>על שורה ריקה — לוח עזרה עם כל הקיצורים בסביבה שלך</td></tr>
</table></div>
<h2>ארבעת התווים שפותחים מצבים</h2>
<div class="tbl-wrap"><table class="cmp">

<h2>הזנת טקסט מרובה שורות</h2>
<p>לוחצים Enter וההודעה נשלחת לפני שסיימת? יש ארבע דרכים לשורה חדשה: <span class="kbd">\\</span>+Enter (עובד בכל מקום), <span class="kbd">Shift+Enter</span> (ברוב הטרמינלים המודרניים), <span class="kbd">Ctrl+J</span> (עובד תמיד), או <span class="kbd">Option+Enter</span> ב-Mac.</p>

{id:"l4",title:"מצב vim ועריכה מקצועית",minutes:6,html:`
<h2>למי זה מיועד?</h2>
<p>אם אתה לא מכיר vim — אפשר לדלג על השיעור הזה בלב שלם. אבל אם אי פעם שמעת את השם ותהית: כן, Claude Code תומך במצב vim מלא בשורת הפרומפט.</p>
<p>מפעילים ב-<span class="kbd">/config</span> ← Editor mode ← vim.</p>
<h2>מה נתמך</h2>
<ul>
<li><b>מצבים:</b> NORMAL, INSERT, VISUAL — עם <span class="kbd">i a o v V Esc</span></li>
<li><b>ניווט:</b> <span class="kbd">h j k l w e b 0 $ ^ gg G</span> וקפיצות <span class="kbd">f F t T</span></li>
<li><b>עריכה:</b> <span class="kbd">x dd D dw cc C cw yy p P u .</span></li>
<li><b>אובייקטי טקסט:</b> <span class="kbd">iw aw i" a" i( a(</span> ועוד</li>
</ul>
<div class="box pro"><b>🎓 הגדרה ששווה להכיר</b>ההגדרה <span class="kbd">vimInsertModeRemaps</span> ממפה רצף של שני תווים ל-Escape. הקלאסיקה: <span class="kbd">{"jj": "&lt;Esc&gt;"}</span> — מקלידים jj מהר וחוזרים ל-NORMAL בלי להושיט יד ל-Esc.</div>
<h2>עריכה מתקדמת גם בלי vim</h2>
<p>הקיצורים האלה עובדים תמיד, בלי להפעיל שום מצב:</p>
<ul>
<li><span class="kbd">Ctrl+A</span> / <span class="kbd">Ctrl+E</span> — לתחילת השורה / לסופה</li>
<li><span class="kbd">Ctrl+W</span> — מחיקת המילה הקודמת</li>
<li><span class="kbd">Ctrl+U</span> / <span class="kbd">Ctrl+K</span> — מחיקה עד תחילת השורה / עד סופה</li>
<li><span class="kbd">Ctrl+Y</span> — הדבקת מה שנמחק (וגם <span class="kbd">Alt+Y</span> לדפדוף בהיסטוריית המחיקות)</li>
<li><span class="kbd">Ctrl+_</span> — ביטול העריכה האחרונה בשורת הקלט</li>
</ul>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>גם בלי vim: הקלד משפט ארוך ונסה <span class="kbd">Ctrl+W</span> למחיקת מילה ו-<span class="kbd">Ctrl+Y</span> להחזרתה. שני קיצורים שחוסכים המון.</div>
`},

{id:"l5",title:"דגלי שורת פקודה מתקדמים",minutes:7,html:`
<h2>מה שלא רואים ב---help</h2>
<div class="box info"><b>ℹ️ עובדה מהתיעוד הרשמי</b>הפקודה <span class="kbd">claude --help</span> <b>אינה</b> מציגה את כל הדגלים. היעדרות מהעזרה אינה אומרת שהדגל לא קיים.</div>
<h2>בטיחות ותקציב</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>דגל</th><th>מה הוא נותן</th></tr>
<tr><td><span class="kbd">--max-budget-usd 5</span></td><td>תקרת הוצאה קשיחה בדולרים</td></tr>
<tr><td><span class="kbd">--max-turns 3</span></td><td>הגבלת מספר סבבי עבודה</td></tr>
<tr><td><span class="kbd">--allowedTools "Read,Edit"</span></td><td>בדיוק אילו כלים מותרים</td></tr>
<tr><td><span class="kbd">--tools "Bash,Read"</span></td><td>הגבלת הכלים המובנים שקלוד רשאי להשתמש בהם</td></tr>
</table></div>
<h2>התאמת התנהגות</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>דגל</th><th>מה הוא נותן</th></tr>
<tr><td><span class="kbd">--append-system-prompt "…"</span></td><td>הוספת הוראות קבועות לסשן</td></tr>
<tr><td><span class="kbd">--agents '{...}'</span></td><td>הגדרת סוכני משנה מותאמים ישירות בשורת הפקודה</td></tr>
<tr><td><span class="kbd">--fallback-model sonnet,haiku</span></td><td>מודלי גיבוי אם הראשי לא זמין</td></tr>
<tr><td><span class="kbd">--json-schema '{...}'</span></td><td>פלט מובנה ומאומת לפי סכמה</td></tr>
</table></div>
<h2>אבחון והאצה</h2>
<ul>
<li><span class="kbd">--safe-mode</span> — כיבוי כל ההתאמות. <b>הכלי הראשון כשמשהו מתנהג מוזר</b></li>
<li><span class="kbd">--bare</span> — דילוג על גילוי הגדרות; הפעלה מהירה פי כ-10 לסקריפטים</li>
<li><span class="kbd">--debug='mcp,startup'</span> — יומני אבחון ממוקדים</li>
<li><span class="kbd">claude doctor</span> — אבחון התקנה מלא</li>
</ul>
<h2>וכמה פקודות משנה שכדאי להכיר</h2>
<ul>
<li><span class="kbd">claude setup-token</span> — יצירת אסימון ארוך-טווח לסקריפטים ולשרתים</li>
<li><span class="kbd">claude project purge</span> — ניקוי המצב המקומי של פרויקט</li>
<li><span class="kbd">claude import codex|gemini</span> — ייבוא הגדרות מכלים אחרים</li>
<li><span class="kbd">claude --from-pr 123</span> — פתיחת הסשן שיצר בקשת מיזוג מסוימת</li>
</ul>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>הרץ <span class="kbd">claude doctor</span> וראה את דוח האבחון של ההתקנה שלך. שווה גם סתם לדעת שהוא קיים.</div>
`},

{id:"l6",title:"יכולות נסתרות ב-Claude.ai ובמובייל",minutes:7,html:`
<h2>באתר ובאפליקציה</h2>
<h3>👻 שיחות אינקוגניטו</h3>
<p>אייקון הרוח בפינה העליונה פותח <b>שיחת אינקוגניטו</b>: היא לא נשמרת בהיסטוריה ולא נכנסת לזיכרון של קלוד. זמין בכל המנויים — מצוין לשאלות אישיות או לניסויים שלא רוצים שיישארו.</p>
<h3>🧠 זיכרון וחיפוש בשיחות</h3>
<p>קלוד זוכר פרטים עליך בין שיחות — התפקיד שלך, ההעדפות, איך אתה אוהב תשובות. אפשר לנהל את זה בהגדרות, לבקש ממנו לזכור משהו, או לשאול מה הוא זוכר. בנוסף יש חיפוש בשיחות קודמות והפניה אליהן.</p>
<h3>⌨️ קיצורים באתר</h3>
<ul>
<li><span class="kbd">Ctrl/Cmd + Shift + O</span> — שיחה חדשה</li>
<li><span class="kbd">Ctrl/Cmd + Shift + ;</span> — מיקוד בתיבת ההקלדה</li>
<li><span class="kbd">Ctrl/Cmd + Shift + S</span> — פתיחה/סגירה של סרגל הצד</li>
<li><span class="kbd">/</span> בתיבת ההודעה — תפריט האפשרויות</li>
</ul>
<h3>📎 מגבלות ששווה להכיר</h3>
<p>עד 20 קבצים בשיחה, 30MB לקובץ. וטיפ חשוב: <b>תוכן שנמצא בידע של פרויקט נשמר במטמון ואינו נספר מול מגבלת ההודעה</b> — עוד סיבה טובה לעבוד בפרויקטים.</p>
<h2>בטלפון — מה שכמעט אף אחד לא מפעיל</h2>
<h3>🍎 באייפון</h3>
<ul>
<li><b>"Ask Claude" דרך סירי</b> — שאלה בקול בלי לפתוח את האפליקציה, גם מהחיפוש</li>
<li><b>קיצורים (Shortcuts)</b> — בניית אוטומציות: לסמן טקסט בכל מקום ← שיתוף ← עיבוד בקלוד. אפשר גם לשרשר כמה פעולות</li>
<li><b>וידג'ט</b> — שלושה כפתורים במסך הבית: שיחה חדשה, הכתבה, וצילום לניתוח</li>
<li><b>מסך נעילה ומרכז הבקרה</b> — פקד "נתח תמונה עם קלוד" בלי לפתוח את המכשיר</li>
</ul>
<h3>🤖 באנדרואיד ובכלל</h3>
<p>שיתוף מכל אפליקציה ← Claude, הכתבה קולית, וצילום ישיר מהמצלמה כקלט.</p>

<h2>קובץ ההגדרות</h2>
<p>ההתנהגות של Claude Code נשלטת מקובץ <span class="kbd">settings.json</span>, שקיים בשלוש רמות: משתמש (כל הפרויקטים), פרויקט (משותף לצוות ונשמר ב-Git), ומקומי (רק אצלך).</p>
<div class="box pro"><b>🎓 לא צריך לזכור שדות</b>אף פעם אל תערוך אותו ידנית בניחוש. פשוט תאר מה אתה רוצה: <b>"הוסף להגדרות שהמודל ברירת המחדל יהיה Sonnet ושתמיד יורץ typecheck לפני commit"</b> — וקלוד יערוך את הקובץ נכון.</div>
<h2>הגדרות ששווה להכיר</h2>
<ul>
<li><span class="kbd">/config key=value</span> — שינוי הגדרה ישירות מהפרומפט, בלי לפתוח תפריט</li>
<li><span class="kbd">editorMode: "vim"</span> — מצב עריכה</li>
<li><span class="kbd">keybindingFlavor: "readline"</span> — שינוי התנהגות מקשי העריכה</li>
<li><span class="kbd">respondToBashCommands: false</span> — שקלוד לא יגיב אוטומטית לפלט של פקודות <span class="kbd">!</span></li>
<li><span class="kbd">additionalDirectories</span> — תיקיות נוספות שקלוד רשאי לגשת אליהן (לעבודה על כמה מאגרים)</li>
<li><span class="kbd">fallbackModel</span> — עד שלושה מודלי גיבוי</li>
<li><span class="kbd">skillOverrides</span> — הסתרת כישור של מישהו אחר מקלוד, בלי לערוך את הקובץ שלו</li>
<li><span class="kbd">spinner verbs</span> — הודעות ההמתנה. אפשר להתאים, ולשמור ב-Git לכיף של הצוות</li>
</ul>
<h2>סגנונות פלט <span class="en">(Output Styles)</span></h2>
<p>משנים את אופן התקשורת של קלוד בסשן: <b>Explanatory</b> (מסביר תוך כדי — מצוין ללמידה), <b>Learning</b> (מאמן ומלמד), <b>Concise</b> (מוביל עם התוצאה, בלי הקדמות). ואפשר לבנות סגנון משלך.</p>
<div class="box info"><b>ℹ️ שווה במיוחד לך</b>נסה את <b>Explanatory</b> בסשן הבא. במקום רק לבצע, קלוד יסביר תוך כדי מה הוא עושה ולמה — מה שהופך כל משימה גם לשיעור.</div>

<h2>המטרה של המודול הזה</h2>
<p>עד כאן למדת יכולות. עכשיו נחבר את כולן לדבר אחד: <b>מוצר אמיתי, מההתחלה ועד הסוף</b> — כזה שאתה יכול להראות, להשתמש בו, ואולי גם למכור.</p>
<h2>שלושת קריטריוני הבחירה</h2>
<h3>1. הוא פותר בעיה אמיתית שלך</h3>
<p>לא תרגיל. משהו שאם יעבוד — תשתמש בו בפועל. מוטיבציה אמיתית שורדת את השלב שבו נתקעים.</p>
<h3>2. הוא קטן מספיק כדי להסתיים</h3>
<p>הטעות הכי נפוצה בפרויקט ראשון: היקף גדול מדי. פרויקט שמסתיים <b>תמיד</b> שווה יותר מפרויקט שאפתני שנזנח.</p>
<div class="box pro"><b>🎓 מבחן השבוע</b>אם אתה לא מאמין שתוכל לסיים גרסה ראשונה שעובדת <b>בתוך שבוע</b> של עבודה בקצב שלך — צמצם. תמיד אפשר להרחיב אחר כך; קשה מאוד להחיות פרויקט מת.</div>
<h3>3. אפשר להראות אותו</h3>
<p>משהו ויזואלי או מוחשי: אתר, כלי, דוח, אוטומציה שאפשר להדגים. פרויקט שאי אפשר להראות אינו פריט בתיק עבודות.</p>
<h2>רעיונות לפי תחומי עניין</h2>
<div class="tbl-wrap"><table class="cmp">

<tr><td>נתונים</td><td>כלי שקורא נתונים גולמיים ומפיק דוח Excel עם גרפים</td></tr>

{id:"l2",title:"שלב 1: אפיון — הראיון והמפרט",minutes:6,html:`
<h2>לא מתחילים לבנות. מתחילים לחשוב.</h2>
<p>כאן מפעילים את הטכניקה ממודול 12: <b>תן לקלוד לראיין אותך</b>.</p>
<div class="prompt-ex"><div class="pl">פרומפט הפתיחה של הפרויקט</div>אני רוצה לבנות [תיאור בשתי שורות]. אני לא מתכנת, אבל אני עובד עם Claude Code.<br><br>ראיין אותי לעומק לפני שנתחיל: שאל על מטרת המוצר, מי המשתמש, מה חייב להיות בגרסה ראשונה ומה יכול לחכות, מקרי קצה, ואיך נדע שזה עובד.<br><br>אל תשאל שאלות מובנות מאליהן — תחפור בחלקים שאולי לא חשבתי עליהם. כשנסיים, כתוב מפרט מלא ל-SPEC.md.</div>
<h2>מה חייב להיות במפרט</h2>
<ul>
<li><b>מטרה במשפט אחד</b> — אם אי אפשר, ההיקף עוד לא ברור</li>
<li><b>מי המשתמש</b> ומה הוא מנסה להשיג</li>
<li><b>מה בפנים בגרסה 1</b> — רשימה סגורה</li>
<li><b>מה מחוץ להיקף</b> — רשימה מפורשת! זה מה שמונע זחילת היקף</li>
<li><b>איך נדע שזה עובד</b> — שלב אימות מקצה לקצה</li>
</ul>
<div class="box pro"><b>🎓 סעיף 'מחוץ להיקף' הוא הסעיף החשוב ביותר</b>הוא נראה מיותר וזה בדיוק מה שהופך אותו לקריטי. בלעדיו כל רעיון טוב שיצוץ באמצע ייכנס פנימה, והפרויקט לא ייגמר לעולם. רשום במפורש: "לגרסה 1 <b>אין</b> התחברות משתמשים, <b>אין</b> אפליקציית מובייל, <b>אין</b> תשלומים".</div>
<div class="box try"><b>🚀 נסה עכשיו</b>הרץ את הראיון על הפרויקט שבחרת. תן לו לחפור — ואל תפחד לגלות שהרעיון צריך צמצום.</div>
`},

{id:"l3",title:"שלב 2: בנייה — סביבה, תוכנית, ביצוע",minutes:7,html:`
<h2>הכנת הסביבה (10 דקות שחוסכות שעות)</h2>
<ol>
<li>תיקייה ייעודית לפרויקט + <span class="kbd">claude</span> בתוכה</li>
<li><span class="kbd">/init</span> ליצירת CLAUDE.md, ואז הוספת הכללים שלך — עברית, סגנון, העדפות</li>
<li>העברת ה-SPEC.md לתיקייה, והוראה ב-CLAUDE.md: "המפרט המחייב נמצא ב-SPEC.md"</li>
<li>בקשה ליצירת NOTES.md עם התוכנית והמצב, והוראה לעדכן אותו בכל שלב</li>
<li>הגדרת Git מההתחלה: "אתחל מאגר Git ושמור גרסה אחרי כל שלב שעובד"</li>
</ol>
<h2>סשן נקי לביצוע</h2>
<p>זוכר את הכלל ממודול 12? שיחת האפיון לא צריכה להיות בהקשר בזמן הבנייה. פתח סשן חדש והתחל כך:</p>
<div class="prompt-ex"><div class="pl">פרומפט הביצוע</div>קרא את SPEC.md. בנה תוכנית מימוש מחולקת לשלבים, כאשר כל שלב מסתיים במשהו שאפשר להריץ ולראות שעובד. אל תבנה עדיין — הצג לי את התוכנית ונאשר אותה יחד.</div>
<h2>עבודה בשלבים — הכלל שמונע כאב</h2>
<div class="box pro"><b>🎓 כל שלב חייב להסתיים במשהו שרץ</b>לא "נבנה את כל השלד ואז נבדוק". כל שלב — משהו שאפשר לפתוח, ללחוץ, ולראות. כך תקלה מתגלה כשהיא קטנה ומקומית, ולא כשהכול מסובך ולא ברור מאיפה היא הגיעה.</div>
<h2>קצב העבודה</h2>
<ul>
<li>אחרי כל שלב: הרץ, בדוק בעצמך, ובקש שמירת גרסה</li>
<li>נתקעת? תאר בדיוק מה קרה — לא "לא עובד"</li>
<li>שני תיקונים ולא הסתדר? <span class="kbd">/clear</span> ופרומפט חדש שמשלב את הלקחים</li>
<li>עייף? <span class="kbd">/clear</span> ומחר מהנקודה — NOTES.md ישמור את המקום</li>
</ul>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>הקם את הסביבה לפי חמשת השלבים ובקש את תוכנית המימוש. אל תתחיל לבנות לפני שהתוכנית מרגישה נכונה.</div>
`,

{id:"l4",title:"שלב 3: אימות — הוכחה שזה עובד",minutes:6,html:`
<h2>ההבדל בין 'נראה מוכן' ל'מוכן'</h2>
<p>זהו השלב שמפריד בין פרויקט חובבני למקצועי — והוא גם הכי מדולג. הכלל ממודול 12 חוזר: <b>אם אי אפשר לאמת, אי אפשר לסמוך.</b></p>
<h2>ארבע שכבות אימות</h2>
<h3>1. אימות עצמי של קלוד</h3>
<div class="prompt-ex"><div class="pl">בקשת בדיקה עצמית</div>עבור על המוצר מול SPEC.md ובדוק: כל דרישה מומשה? העברית תקינה ומיושרת לימין בכל מקום? הכול עובד גם במסך צר? יש קלט שיכול לשבור אותו? תקן מה שמצאת ודווח לי בטבלה.</div>
<h3>2. סקירה בהקשר נקי</h3>
<p><span class="kbd">/code-review</span> או סוכן משנה שרואה רק את התוצר ואת המפרט — לא את הדרך אליו. זכור להגדיר סף: רק פערי נכונות, לא העדפות סגנון.</p>
<h3>3. בדיקה אנושית — אתה</h3>
<p>השתמש במוצר כאילו אתה המשתמש. נסה לשבור אותו: קלט ריק, טקסט ארוך מדי, לחיצות מהירות, מסך צר.</p>
<h3>4. בדיקה חיצונית</h3>
<p>תן לאדם אחד — לא אתה — לנסות. <b>אל תסביר לו איך להשתמש.</b> מה שהוא לא מבין לבד הוא בעיה במוצר, לא בו.</p>
<div class="box pro"><b>🎓 המבחן האמיתי</b>אם אתה צריך לעמוד לידו ולהסביר — המוצר עוד לא מוכן. זה נכון לאתר, לכלי, לדוח ולאוטומציה כאחד.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>הרץ את ארבע השכבות על מה שבנית. השכבה הרביעית תגלה לך הכי הרבה — ותהיה הכי לא נוחה.</div>
`},

{id:"l5",title:"שלב 4: פרסום, תחזוקה ותיק עבודות",minutes:6,html:`
<h2>להוציא לעולם</h2>
<p>לפי סוג הפרויקט:</p>
<ul>
<li><b>אתר או כלי מבוסס דפדפן</b> — GitHub Pages (מודול 5). חינם, ומקבלים כתובת אמיתית</li>
<li><b>Skill או תבנית</b> — משתפים את התיקייה, או אורזים כתוסף</li>
<li><b>אוטומציה</b> — מגדירים כמשימה מתוזמנת שרצה לבד</li>
<li><b>Artifact</b> — מפרסמים ומקבלים קישור לשיתוף</li>
</ul>
<div class="box warn"><b>⚠️ בדיקת פרטיות לפני פרסום</b>לפני שמשהו יוצא לרשת: אין מפתחות API בקוד? אין נתונים אישיים לדוגמה? אין קבצים פנימיים בתיקייה? בקש מקלוד במפורש: <b>"סרוק את הפרויקט לפני פרסום — חפש סודות, מפתחות ומידע אישי"</b>.</div>
<h2>תחזוקה: מה שהופך פרויקט למוצר</h2>
<ul>
<li><b>README</b> — מה זה, איך משתמשים, איך מריצים</li>
<li><b>CLAUDE.md מעודכן</b> — כדי שתוכל לחזור בעוד חצי שנה ולהמשיך</li>
<li><b>גרסאות ב-Git</b> — היסטוריה שאפשר לחזור אליה</li>
<li><b>רשימת "מה הלאה"</b> — כל הרעיונות שדחית לגרסה 2, בקובץ</li>
</ul>
<h2>הפיכה לפריט בתיק עבודות</h2>
<p>לכל פרויקט הכן תיאור קצר בשפה של לקוח — לא של מפתח:</p>
<div class="tbl-wrap"><table class="cmp">
<tr><th>סעיף</th><th>דוגמה</th></tr>
<tr><td>הבעיה</td><td>"בעלי עסקים קטנים מבזבזים שעה על כל הצעת מחיר"</td></tr>
<tr><td>הפתרון</td><td>"כלי שמייצר הצעה מעוצבת ב-2 דקות"</td></tr>
<tr><td>התוצאה</td><td>"מהשעה לשתי דקות, ובפורמט אחיד"</td></tr>
<tr><td>קישור</td><td>הדגמה חיה או צילומי מסך</td></tr>
</table></div>
<div class="box try"><b>🚀 נסה עכשיו</b>כתוב את ארבעת הסעיפים לפרויקט שלך. אם קשה לך למלא את "התוצאה" — אולי הפרויקט לא פותר בעיה חדה מספיק.</div>
`},

{id:"l6",title:"סיכום המסע — ומה עכשיו",minutes:5,html:`
<h2>מאיפה התחלת ולאן הגעת</h2>
<p>בתחילת הקורס לא ידעת מה זה טרמינל. עכשיו אתה יודע להתקין Claude Code, לנהל הקשר, להריץ סוכנים במקביל, לבנות Skills, לחבר שירותים, לתכנן ארכיטקטורת סוכנים — ולבנות מוצר מקצה לקצה.</p>
<h2>מה באמת לקחת מכאן</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>לא רק…</th><th>אלא גם…</th></tr>
<tr><td>איך לכתוב פרומפט</td><td>איך לעצב את הסביבה שבה הוא פועל</td></tr>
<tr><td>אילו פקודות קיימות</td><td>מתי כל כלי הוא הבחירה הנכונה</td></tr>
<tr><td>שקלוד יכול לעשות דברים</td><td>איך לוודא שהוא עשה אותם נכון</td></tr>
<tr><td>שיש דפוסי עבודה</td><td>מתי לשבור אותם</td></tr>
</table></div>
<h2>שלושת ההרגלים שישאירו אותך בחזית</h2>
<ol>
<li><b>יכולת אחת חדשה בשבוע</b> — חמש דקות ביומן החידושים, ניסוי אחד.</li>
<li><b>שאל את הכלי על עצמו</b> — "מה התחדש?", "איך היית פותר את זה היום?", <span class="kbd">/powerup</span>.</li>
<li><b>תמשיך לבנות</b> — הידע הזה מתנדף בלי שימוש ומתחזק עם כל פרויקט.</li>
</ol>
<div class="box pro"><b>🎓 והדבר האחרון</b>הפער בינך לבין מומחה אינו ידע — הוא <b>שעות טיסה</b>. כל מה שנשאר זה להשתמש. הכלים בידיים שלך, והם עובדים.</div>
<h2>לאן ממשיכים</h2>
<ul>
<li><b>Claude Academy</b> — קורסים רשמיים בחינם עם תעודות</li>
<li><b>התיעוד הרשמי</b> — code.claude.com/docs · claude.com/docs · platform.claude.com/docs</li>
<li><b>תרגול מעורב</b> באפליקציה הזו — חזור אליו מדי פעם כדי לשמר</li>
<li><b>הפרויקט הבא</b> — כי זה מה שבאמת מלמד</li>
</ul>
<div class="box try"><b>🚀 נסה עכשיו</b>עבור למסך ההתקדמות. ראה מה נשאר לא מסומן — וסגור את הפינות. ואז תתחיל את הפרויקט הבא.</div>
`}

L("m3",{id:"l9",title:"טכניקות מתקדמות: חשיבה, כלים וסוכנים",minutes:8,html:`
<h2>מעבר לפרומפט הרגיל</h2>
<p>שלוש שכבות שמופיעות במדריך הרשמי ונוגעות לעבודה מתקדמת — גם בצ'אט וגם בכלים.</p>
<h2>1. הכוונת חשיבה</h2>
<p>למודלים החדשים יש <span class="term">חשיבה מורחבת</span> — הם מתכננים לפני שהם עונים. אפשר לכוון גם את זה:</p>
<div class="prompt-ex"><div class="pl">הכוונת חשיבה</div>לפני שאתה עונה, שקול שלוש גישות אפשריות, בחן את החולשה של כל אחת, ורק אז בחר. הצג לי בקצרה את השיקול לפני התשובה.</div>
<p>ב-Claude Code יש חוגה ייעודית: <span class="kbd">/effort</span> עם רמות low עד max. הצוות של Anthropic עובד ב-high, ועובר ל-xhigh לבעיות קשות.</p>

<tr><td>"מה דעתך על X?"</td><td>"בצע X. תנאי סיום: Y מתקיים"</td></tr>
<tr><td>מצפה לתשובה</td><td>מצפה לתוצאה מאומתת</td></tr>
<tr><td>אתה בלולאה</td><td>הסוכן סוגר את הלולאה</td></tr>
</table></div>
<p>שלושת הרכיבים שכל פרומפט סוכני צריך: <b>מטרה</b> (מה צריך להיות נכון בסוף), <b>גבולות</b> (מה אסור לגעת בו), ו<b>אימות</b> (איך נדע שהצליח).</p>

<ul>

<li><b>ביטול נוסחאות מתמטיות</b> — המודלים נוטים לפורמט LaTeX. אם אתה רוצה טקסט רגיל, בקש זאת מפורשות.</li>
</ul>
<div class="box pro"><b>🎓 הכלל שמאחד את הכול</b>ככל שהמשימה אוטונומית יותר, כך הפרומפט צריך להיות פחות "מה לכתוב" ויותר <b>"איך ייראה הצלחה"</b>. זה המעבר מהנחיית כתיבה להגדרת יעד.</div>

`},[
{id:"m3q19",q:"מה מייחד פרומפט לסוכן מפרומפט לשיחה?",opts:["הוא מגדיר מטרה, גבולות ואימות — ומצפה לתוצאה מאומתת ולא לתשובה","הוא ארוך יותר","הוא נכתב באנגלית","הוא כולל קוד"],a:0,exp:"בשיחה אתה בלולאה; בסוכן — הסוכן סוגר אותה בעצמו."},

"m5/l3":`Git שומר <b>צילומי מצב</b> של הפרויקט. כל שמירת גרסה מתעדת מה השתנה מאז הקודמת, כך שאפשר לחזור לכל נקודה בזמן. זה שונה מנקודות השמירה של קלוד עצמו: אלה עוקבות רק אחרי עריכות שהוא ביצע בכלים שלו, ואילו Git מתעד את הפרויקט כולו — כולל שינויים שעשית ידנית.`,
"m5/l5":`סוכן משנה הוא <b>עותק של קלוד עם חלון הקשר נקי משלו</b>. הוא מקבל משימה מוגדרת, עובד עליה בנפרד — קורא קבצים, מריץ חיפושים — ומחזיר רק סיכום מזוקק. כל הרעש של העבודה נשאר אצלו. זו הסיבה שהאצלה לסוכן חוסכת הקשר ולא רק זמן.`,
"m5/l6":`Hook אינו בקשה מהמודל אלא <b>פקודה שהמערכת מריצה בעצמה</b> באירוע מסוים — לפני שימוש בכלי, אחריו, בסיום תור, או אחרי דחיסה. בגלל שהוא רץ מחוץ לשיקול הדעת של קלוד, הוא מתקיים תמיד ובאותה צורה. זה ההבדל בין "אנא אל תעשה" לבין "אי אפשר לעשות".`,
"m5/l7":`תוסף הוא <b>חבילה</b> שאורזת יחד כישורים, Hooks, סוכנים וחיבורים. בהתקנה הוא לא מעתיק קבצים לפרויקט שלך אלא נרשם במערכת, וכישוריו מקבלים שם מרחב משלהם — כך שכמה תוספים יכולים לחיות זה לצד זה בלי שפקודות יתנגשו.`,
"m5/l8":`יש שני סוגי תזמון שעובדים אחרת לגמרי. משימת <b>ענן</b> רצה על שרתי Anthropic, ולכן ממשיכה גם כשהמחשב כבוי — אבל אין לה גישה לקבצים המקומיים שלך. משימה <b>מקומית</b> רצה על המחשב עם גישה מלאה לקבצים — אבל רק כשהוא דולק.`,
"m6/l1":`Cowork משתמש באותו מנוע סוכני של Claude Code, בלי שורת פקודה. ההבדל המהותי: הוא <b>עובד ישירות על הקבצים שבתיקייה שאישרת</b>, בלי העלאה והורדה. הגישה מוגבלת בדיוק לתיקייה הזו — זו הסיבה שחשוב לבחור תיקייה ממוקדת ולא את כל המחשב.`,
"m6/l4":`משימת רקע ממשיכה לרוץ כי היא <b>מנותקת מהחלון שפתחת</b>. הסשן חי בצד שלו, מדווח על התקדמות, ועוצר רק אם נדרש אישור שלך. לכן משימה שנוסחה היטב — עם תוצר מוגדר וכללי החלטה ברורים — תסתיים לבד, ואילו משימה מעורפלת תמתין לך.`,
"m7/l3":`כישור עובד בשיטת <b>חשיפה הדרגתית</b>. קלוד רואה תמיד רק את השם והתיאור שלו — כמה עשרות מילים. רק כשהתיאור מתאים למה שביקשת, גוף הקובץ נטען במלואו, וקבצי העזר נטענים רק אם ההוראות מפנות אליהם. לכן אפשר להחזיק עשרות כישורים בלי לשלם על אף אחד מהם עד שהוא נחוץ — וגם למה התיאור הוא החלק הכי חשוב.`,
"m7/l5":`כישור בפרויקט חי בתיקיית <span class="kbd">.claude/skills/</span> ונטען בתחילת סשן. מכיוון שהוא יושב בתוך הפרויקט, הוא נשמר יחד איתו בגרסאות — וכל מי שיעבוד על הפרויקט יקבל את אותם נהלים בדיוק.`,
"m8/l3":`חיבור אינו נותן לקלוד את הסיסמה שלך. תהליך האישור מייצר <b>אסימון גישה</b> מוגבל — לשירות מסוים, להרשאות מסוימות, וניתן לביטול בכל רגע. כשאתה שואל שאלה, קלוד קורא לכלי של השירות עם האסימון הזה, מקבל תשובה, ומשלב אותה בתשובה שלו.`,
"m8/l5":`MCP הוא <b>תקן פתוח</b>, כמו שקע חשמל: כל שירות שמייצר "תקע" תואם מתחבר לכל כלי שמכיר את התקן. השרת מכריז אילו כלים הוא מספק, קלוד רואה את הרשימה ומחליט מתי לקרוא לכל אחד. בזכות התקן, אותו חיבור עובד גם בקלוד וגם בכלים אחרים שתומכים בו.`,
"m9/l2":`מפתח API הוא <b>סיסמה לכל דבר</b> — מי שמחזיק בו יכול לבצע בקשות על חשבונך ולחייב אותך. לכן הוא מוצג פעם אחת בלבד, לכן שומרים אותו במשתנה סביבה ולא בתוך הקוד, ולכן תקרת ההוצאה היא לא המלצה אלא הכרח.`,
"m9/l4":`ל-API אין זיכרון. כל בקשה עומדת בפני עצמה, ולכן כדי לנהל שיחה שולחים בכל פעם את <b>כל ההיסטוריה</b> מחדש במערך ההודעות. זו הסיבה ששיחה ארוכה מתייקרת בהדרגה — ובדיוק מכאן מגיעה החשיבות של מטמון פרומפטים.`,
"m11/l8":`חלון ההקשר הוא כמות הטקסט שהמודל רואה בבת אחת. הוא לא "זוכר" — בכל תור נשלח אליו מחדש כל מה שנמצא בחלון. לכן <span class="kbd">/clear</span> מוזיל ומזרז מיידית, ולכן דחיסה עובדת: היא מחליפה טקסט ארוך בתקציר קצר שאומר את אותו הדבר.`,
"m12/l1":`<span class="kbd">/goal</span> מפעיל <b>מעריך נפרד</b> שבודק אחרי כל סבב אם התנאי התקיים. ההפרדה הזו היא העיקר: מי שביצע את העבודה אינו מי שקובע אם היא הצליחה — בדיוק כמו שבודק חיצוני מוצא דברים שהכותב מפספס.`,
"m12/l5":`במצב האוטומטי פועל <b>מודל מסווג נפרד</b> שבוחן כל פעולה לפני ביצועה ומחליט אם היא שגרתית או מסוכנת. כללי ההיתר שאתה מוסיף מדלגים על הבדיקה לפקודות שאתה סומך עליהן, וארגז החול מוסיף שכבה שונה לגמרי — הגבלה ברמת מערכת ההפעלה, שלא תלויה בשיקול דעת של אף מודל.`,
"m12/l8":`סוכן מותאם הוא קובץ הגדרות: תיאור תפקיד, רשימת כלים מותרים ומודל. כשמפעילים אותו, נפתח סוכן משנה עם ההגדרות האלה בלבד. הגבלת הכלים אינה נימוס — היא <b>מונעת פיזית</b> פעולות שלא התכוונת אליהן, כמו סוקר שאין לו יכולת עריכה.`,
"m13/l3":`עץ עבודה הוא <b>עותק נוסף של קבצי הפרויקט</b> באותה תיקייה-אב, המקושר לאותה היסטוריית גרסאות אך על ענף נפרד. לכן שני סשנים יכולים לערוך "את אותו קובץ" בלי להתנגש: כל אחד עורך את העותק שלו, והמיזוג קורה מאוחר יותר ובאופן מבוקר.`,
"m13/l4":`משימת רקע היא תהליך נפרד שמנוהל על ידי שירות רקע. הוא לא תלוי בחלון הטרמינל שממנו הפעלת אותו — ולכן סגירת החלון לא עוצרת אותו, והפלט נשמר לקובץ שאפשר לקרוא בכל רגע.`,
"m16/l3":`התו <span class="kbd">!</span> אינו פקודה של קלוד — הוא אומר לממשק להריץ את השורה <b>ישירות במערכת ההפעלה</b>, בלי לשלוח אותה למודל. לכן זה לא עולה טוקנים ולא לוקח זמן חשיבה. הפלט נכנס אחר כך להקשר, וקלוד מגיב עליו כאילו הדבקת אותו בעצמך.`,
"m16/l7":`ההגדרות נשמרות בקבצים בשלוש רמות — משתמש, פרויקט ומקומי — והמערכת ממזגת ביניהן, כשהספציפי גובר על הכללי. זו הסיבה שאפשר להגדיר כללי צוות שנשמרים בפרויקט, ולצידם העדפות אישיות שחלות רק אצלך.`,
"m16/l6":`אפליקציית הטלפון נרשמת במערכת ההפעלה כ"מקבלת שיתופים" ומספקת קיצורי פעולה. לכן היא מופיעה בתפריט השיתוף של אפליקציות אחרות ובעוזר הקולי — המערכת מעבירה לה את התוכן, והיא פותחת איתו שיחה.`,
"m17/l5":`GitHub Pages לוקח קבצים מהמאגר שלך <b>ומגיש אותם כאתר</b>. אין שם שרת שמריץ קוד — רק קבצים שנשלחים לדפדפן. זו הסיבה שהאירוח חינמי, שהאתר מהיר מאוד, ושכל מה שהאפליקציה עושה חייב לקרות בדפדפן של המבקר.`
};

function card(o, how){
  return '<div class="howto"><b>🔧 מדריך הפעלה: ' + o.t + '</b><div class="ht-in">' +
    (o.req  ? '<div class="ht-req">📋 <b>צריך מראש:</b> ' + o.req + '</div>' : '') +
    '<ol class="ht-steps">' + o.steps.map(s => '<li>' + s + '</li>').join('') + '</ol>' +
    (o.check ? '<div class="ht-check">✅ <b>איך יודעים שהצליח:</b> ' + o.check + '</div>' : '') +
    (o.fix   ? '<div class="ht-fix">🔧 <b>לא עובד?</b> ' + o.fix + '</div>' : '') +
    (how     ? '<div class="box info" style="margin:11px 0 0">⚙️ <b>איך זה עובד מאחורי הקלעים</b>' + how + '</div>' : '') +
    '</div></div>';
}
function add(mid, lid, o){
  const m = by(mid), l = m && m.lessons.find(x => x.id === lid);
  if(!l) return;
  const html = card(o, HOW[mid + "/" + lid]);
  const i = l.html.lastIndexOf('<div class="box try">');
  l.html = (i >= 0) ? l.html.slice(0,i) + html + l.html.slice(i) : l.html + html;
}

add("m4","l4",{t:"התקנת Git for Windows (מומלץ לפני Claude Code)",
req:`Windows · הרשאת התקנה במחשב`,
steps:[
`היכנס ל-<span class="kbd">git-scm.com/downloads/win</span> והורד את הגרסה ל-64-bit.`,

`בסיום פתח PowerShell חדש והקלד <span class="kbd">git --version</span>.`
],
check:`מופיעה שורה כמו <span class="kbd">git version 2.55.0.windows.5</span>.`,
fix:`הפקודה לא מוכרת? סגור את כל חלונות הטרמינל ופתח חדש — התקנה מעדכנת את המערכת רק בחלונות שנפתחים אחריה.`});

add("m4","l8",{t:"אפליקציית הדסקטופ ותוסף VS Code",
req:`מנוי Pro · Windows`,
steps:[
`<b>אפליקציית הדסקטופ:</b> הורד מ-<span class="kbd">claude.ai/download</span> והתקן. פתח, התחבר, ולחץ על לשונית <b>Code</b>.`,
`בלשונית Code לחץ <b>Open folder</b> ובחר את תיקיית הפרויקט שלך. זהו — אותו Claude Code, בלי טרמינל.`,
`<b>תוסף VS Code (למי שמשתמש):</b> ב-VS Code לחץ <span class="kbd">Ctrl+Shift+X</span>, חפש "Claude Code", והתקן.`,

],

/* ============ מודול 5 — Claude Code מקצועי ============ */
add("m5","l1",{t:"יצירת קובץ הזיכרון CLAUDE.md",
req:`Claude Code מותקן · תיקיית פרויקט`,
steps:[
`פתח טרמינל בתיקיית הפרויקט והרץ <span class="kbd">claude</span>.`,
`הקלד <span class="kbd">/init</span> ולחץ Enter. קלוד יסרוק את הפרויקט וייצור CLAUDE.md אוטומטית.`,
`הוסף את הכללים שלך — פשוט בקש: "הוסף ל-CLAUDE.md שכל הטקסטים בעברית ושתסביר לי כל מונח טכני".`,
`גזום את מה שמיותר: הרץ <span class="kbd">/doctor</span> וקבל הצעות למחיקה.`
],
check:`הרץ <span class="kbd">/clear</span> ואז שאל "מה הכללים שלי בפרויקט הזה?" — הוא אמור לדעת בלי שתזכיר.`,
fix:`קלוד מתעלם מכלל מסוים? הקובץ כנראה ארוך מדי. קצר אותו, והוסף <span class="kbd">IMPORTANT</span> לפני הכלל החשוב — אבל רק לאחד.`});

add("m5","l3",{t:"שמירת גרסאות עם Git",
req:`Git מותקן · תיקיית פרויקט`,
steps:[
`בסשן Claude Code בקש: <b>"אתחל מאגר Git בפרויקט הזה"</b>.`,
`אם זו הפעם הראשונה, קלוד יבקש שם ומייל. אמור לו: "הגדר את השם והמייל שלי" ותן לו את הפרטים.`,
`אחרי כל שלב שעובד, בקש: <b>"שמור גרסה עם תיאור מתאים"</b>.`,
`לראות היסטוריה: "הצג לי את חמש הגרסאות האחרונות". לחזור אחורה: "תחזיר את הקובץ לגרסה הקודמת".`
],
check:`בקש "מה השתנה מאז הגרסה האחרונה?" — הוא אמור להציג רשימת שינויים.`,
fix:`שגיאה על זהות חסרה? בקש: "הגדר git user.name ו-user.email גלובלית".`});

add("m5","l5",{t:"הפעלת סוכני משנה (Subagents)",
req:`Claude Code · מנוי Pro`,
steps:[
`בסשן רגיל, בקש במפורש: <b>"הפעל סוכן משנה שיחקור את X ויחזיר לי סיכום קצר"</b>.`,
`למקביליות: "הפעל שלושה סוכנים במקביל — אחד לכל קובץ — ורכז את הממצאים".`,
`לתפקיד קבוע, צור סוכן מותאם: בקש "צור סוכן ב-.claude/agents שתפקידו לבדוק עברית ותקינות טקסטים".`,
`להפעלת סוכן מותאם: "השתמש בסוכן bodek-ivrit כדי לבדוק את הקבצים".`,
`למעקב אחרי מה שרץ: <span class="kbd">/tasks</span>, או <span class="kbd">claude agents</span> למסך מלא.`
],
check:`אתה רואה בסשן שורות שמציינות שסוכן משנה הופעל, ובסוף מגיע סיכום — בלי שכל הקבצים שקרא ייכנסו לשיחה שלך.`,
fix:`הכול נכנס לשיחה במקום לסיכום? כנראה לא הופעל סוכן. בקש מפורשות "בסוכן משנה נפרד".`});

add("m5","l6",{t:"הגדרת Hook (אכיפה אוטומטית)",
req:`Claude Code · תיקיית פרויקט`,
steps:[
`בסשן, פשוט תאר מה אתה רוצה שיקרה תמיד. למשל: <b>"כתוב Hook שמריץ עיצוב קוד אחרי כל עריכת קובץ"</b>.`,
`קלוד ייצור את ההגדרה בקובץ ההגדרות של הפרויקט ויסביר מה היא עושה.`,
`אפשר גם חסימות: "כתוב Hook שחוסם כל עריכה של קובץ .env".`,
`לצפייה ולעריכה של מה שמוגדר: הרץ <span class="kbd">/hooks</span>.`
],
check:`בצע פעולה שאמורה להפעיל את ה-Hook (למשל ערוך קובץ) — ותראה שהפעולה האוטומטית קרתה.`,
fix:`ה-Hook לא רץ? הרץ <span class="kbd">/hooks</span> ובדוק שהוא רשום. אם לא — בקש מקלוד לבדוק את ההגדרה ולתקן.`});

add("m5","l7",{t:"התקנת תוספים (Plugins)",
req:`Claude Code · מנוי Pro`,
steps:[
`בסשן הרץ <span class="kbd">/plugin</span> — נפתח מסך ניהול התוספים.`,
`עבור על התוספים הזמינים במאגרים הרשמיים ובחר מה שמתאים לך.`,
`להתקנה מהירה מהפרומפט: <span class="kbd">/plugin install שם-התוסף</span>.`,
`אחרי התקנה, הרץ <span class="kbd">/</span> וראה את הפקודות החדשות שהתוסף הוסיף.`
],
check:`הפקודות של התוסף מופיעות ברשימת <span class="kbd">/</span> ואפשר להפעיל אותן.`,
fix:`התוסף לא מופיע? הרץ <span class="kbd">/reload-plugins</span>, ואם לא עזר — סגור ופתח את הסשן מחדש.`});

add("m5","l8",{t:"תזמון משימות שרצות לבד",
req:`Claude Code · מנוי Pro`,
steps:[
`<b>בענן (ממשיך גם כשהמחשב כבוי):</b> בסשן הרץ <span class="kbd">/schedule</span> ותאר מה לעשות ומתי — למשל "כל יום ראשון ב-9 בבוקר, סכם את השינויים מהשבוע לקובץ".`,
`<b>במחשב:</b> באפליקציית הדסקטופ יש לשונית משימות מתוזמנות שרצות מקומית עם גישה לקבצים שלך.`,
`<b>לולאה בתוך סשן:</b> <span class="kbd">/loop 5m</span> ואחריה המשימה — חוזר על עצמו כל 5 דקות כל עוד הסשן פתוח.`,
`לצפייה ולביטול: הרץ <span class="kbd">/schedule</span> שוב ובחר מהרשימה.`
],
check:`המשימה מופיעה ברשימת המתוזמנות עם השעה הבאה שבה תרוץ.`,
fix:`לא רץ בזמן? משימות ענן דורשות שהמשימה תהיה מנוסחת כעצמאית לגמרי — בלי הנחות על מה שנמצא בסשן.`});

/* ============ מודול 6 — Cowork ============ */
add("m6","l1",{t:"פתיחת Cowork בפעם הראשונה",
req:`מנוי Pro ומעלה · אפליקציית הדסקטופ מותקנת`,
steps:[
`התקן את אפליקציית הדסקטופ מ-<span class="kbd">claude.ai/download</span> אם עוד לא עשית זאת.`,
`פתח אותה והתחבר לחשבון שבו יש מנוי Pro.`,
`בראש החלון לחץ על לשונית <b>Cowork</b>.`,
`בפעם הראשונה הוא יבקש הרשאת גישה לתיקיות. בחר <b>תיקייה ספציפית</b> שרלוונטית לעבודה — לא את כל המחשב.`,
`תאר משימה בשפה חופשית, למשל: "עבור על הקבצים בתיקייה הזו וסדר אותם לפי נושא".`
],
check:`Cowork מציג תוכנית פעולה, ואז מתחיל לעבוד ומייצר קבצים אמיתיים בתיקייה שבחרת.`,
fix:`הלשונית לא מופיעה? ודא שהאפליקציה מעודכנת ושאתה מחובר לחשבון עם מנוי בתשלום.`});

add("m6","l4",{t:"הפעלת Dispatch — משימות ברקע",
req:`Cowork פעיל · מנוי Pro`,
steps:[
`בתוך Cowork, נסח משימה שלוקחת זמן ותאר תוצר סופי — למשל: "חקור את הנושא הזה וכתוב לי דוח לקובץ".`,
`שגר אותה והמשך לעבוד על משהו אחר; היא ממשיכה לרוץ ברקע.`,
`אפשר לשגר משימה גם מהטלפון — פתח את אפליקציית קלוד בנייד ושלח את המשימה לסשן שלך.`,
`חזור אחר כך ובדוק את התוצאה ברשימת המשימות של Cowork.`
],
check:`המשימה מופיעה כפעילה ואתה יכול לעבור למשימה אחרת בלי שהיא נעצרת.`,
fix:`המשימה נעצרה באמצע? כנראה חיכתה לאישור שלך. בדוק אם יש התראה שממתינה למענה.`});

/* ============ מודול 7 — Skills ============ */
add("m7","l3",{t:"יצירת Skill והעלאתו ל-Claude.ai",
req:`מנוי Pro · תיקייה במחשב`,
steps:[
`צור תיקייה בשם הכישור באותיות אנגליות קטנות עם מקפים, למשל <span class="kbd">meeting-summary</span>.`,
`בתוכה צור קובץ בשם <span class="kbd">SKILL.md</span> שמתחיל כך:<div class="code">---
name: meeting-summary
description: מסכם תמלול פגישה לסיכום עם החלטות ומשימות
---

# הוראות
1. קרא את התמלול
2. חלץ החלטות ומשימות
3. הצג בטבלה: משימה, אחראי, תאריך</div>`,
`ארוז את <b>התיקייה</b> ל-ZIP (לחיצה ימנית ← שלח אל ← תיקייה דחוסה). חשוב: התיקייה עצמה, לא הקבצים שבתוכה.`,
`ב-claude.ai לחץ <b>Customize</b> בסרגל הצד ← <b>Skills</b> ← <b>Upload skill</b> ובחר את קובץ ה-ZIP.`,
`הפעל את המתג ליד הכישור כדי שיהיה זמין.`
],
check:`פתח שיחה חדשה ובקש משהו שהכישור אמור לטפל בו — קלוד אמור להפעיל אותו לבד ולעבוד לפי ההוראות שכתבת.`,
fix:`לא מופעל אוטומטית? התיאור לא ברור מספיק. שכתב אותו כך שיכלול בדיוק מתי להשתמש ובאילו מילים אתה מבקש זאת. אפשר גם להפעיל ידנית עם <span class="kbd">/meeting-summary</span>.`});

add("m7","l5",{t:"יצירת Skill בתוך Claude Code",
req:`Claude Code · תיקיית פרויקט`,
steps:[
`בסשן, פשוט בקש: <b>"צור כישור בשם X שעושה Y"</b> — קלוד ייצור את המבנה הנכון לבד.`,
`הכישור נשמר בתיקייה <span class="kbd">.claude/skills/</span> בתוך הפרויקט.`,
`לניהול הכישורים הרץ <span class="kbd">/skills</span>.`,
`להפעלה ידנית הקלד <span class="kbd">/</span> ואת שם הכישור.`
],
check:`הכישור מופיע ברשימה של <span class="kbd">/</span> ואפשר להפעיל אותו.`,
fix:`לא מופיע? סגור ופתח את הסשן — כישורים נטענים בתחילת סשן. ודא ששם התיקייה זהה לשדה name בקובץ.`});

/* ============ מודול 8 — חיבורים ו-MCP ============ */
add("m8","l3",{t:"חיבור שירות (Connector) ב-Claude.ai",
req:`מנוי Pro · חשבון בשירות שרוצים לחבר`,
steps:[
`ב-claude.ai לחץ <b>Customize</b> בסרגל הצד ואז <b>Connectors</b>.`,
`בחר את השירות (Google Drive, Gmail, Calendar, GitHub, Slack ועוד) ולחץ <b>Connect</b>.`,
`ייפתח מסך התחברות של אותו שירות. התחבר ואשר את ההרשאות שקלוד מבקש — קרא מה הוא מבקש לפני שאתה מאשר.`,
`חזור לקלוד. השירות אמור להופיע כמחובר.`,
`בשיחה, בקש בשפה חופשית: "מה יש לי ביומן מחר?" — או לחץ על <b>+</b> בשיחה כדי לצרף קובץ ספציפי.`
],
check:`שאלה על נתונים מהשירות מקבלת תשובה אמיתית מהחשבון שלך.`,
fix:`החיבור פג? חזור ל-Connectors ולחץ Reconnect. לא רואה נתונים? ודא שיש לך גישה אליהם בשירות עצמו.`});

add("m8","l5",{t:"הוספת שרת MCP ב-Claude Code",
req:`Claude Code · כתובת או שם של שרת MCP`,
steps:[
`בסשן הרץ <span class="kbd">/mcp</span> כדי לראות מה כבר מחובר.`,
`להוספה, הדרך הפשוטה: בקש מקלוד — <b>"חבר את שרת ה-MCP של [השירות]"</b> והוא יטפל בפקודות.`,
`אם השירות דורש התחברות, הרץ <span class="kbd">claude mcp login שם-השרת</span> בטרמינל.`,
`להגדרה ברמת הפרויקט (כדי שתישמר איתו), בקש: "הוסף את החיבור להגדרות הפרויקט".`
],
check:`הרץ <span class="kbd">/mcp</span> — השרת מופיע כמחובר, והכלים שלו זמינים לקלוד.`,
fix:`מופיע כמנותק? בדוק חיבור אינטרנט ואת נכונות הכתובת. אם נדרש אימות — הרץ את פקודת ההתחברות שוב.`});

add("m9","l2",{t:"פתיחת חשבון Console וקבלת מפתח API",
req:`כתובת מייל · אמצעי תשלום · <b>שלב זה אינו חובה</b> — אפשר ללמוד את המודול כולו בלי לפתוח חשבון`,
steps:[
`היכנס ל-<span class="kbd">platform.claude.com</span> והירשם. <b>שים לב:</b> זהו חשבון נפרד מ-claude.ai — מנוי Pro אינו כולל שימוש ב-API.`,
`טען קרדיט ראשוני קטן (אפשר להתחיל בסכום מינימלי) תחת Billing.`,
`עבור ל-<b>Settings ← API keys</b> ולחץ <b>Create Key</b>. תן לו שם מזהה.`,
`<b>העתק את המפתח מיד ושמור אותו במקום בטוח</b> — הוא מוצג פעם אחת בלבד.`,
`הגדר תקרת הוצאה חודשית תחת Billing ← Limits. זו ההגנה החשובה ביותר שלך.`
],
check:`המפתח מופיע ברשימת המפתחות (מוסתר חלקית) ויש לך יתרת קרדיט.`,
fix:`שגיאת 401 בשימוש? המפתח שגוי או הועתק חלקית. שגיאת credit? היתרה נגמרה — טען שוב.`});

add("m9","l4",{t:"הבקשה הראשונה ל-API",
req:`מפתח API · Python מותקן (או לתת לקלוד להתקין)`,
steps:[

<h2>המשאב האמיתי שלך: מכסת שימוש</h2>
<p>המנוי אינו "בלתי מוגבל", אבל הוא גם לא נגמר מהר. חשוב להבין איך הוא עובד — כי הידיעה הזו שווה כסף, וחוסכת תסכול.</p>
<h2>שתי מכסות שפועלות במקביל</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>מכסה</th><th>איך היא עובדת</th></tr>
<tr><td><b>חלון של חמש שעות</b></td><td>מתאפס כל חמש שעות מרגע ההודעה הראשונה שלך בחלון</td></tr>
<tr><td><b>מכסה שבועית</b></td><td>מתאפסת במועד קבוע שמשויך לחשבון שלך</td></tr>
</table></div>
<div class="box warn"><b>⚠️ העובדה שהכי חשוב לדעת</b>הצ'אט, Claude Code ו-Cowork <b>חולקים את אותה מכסה</b>. סשן ארוך ומבוזבז ב-Claude Code בבוקר יקצר לך את הצ'אט בערב. זו בדיוק הסיבה שניהול ההקשר שנלמד בהמשך הוא לא רק עניין של איכות — הוא גם חיסכון ישיר.</div>
<h2>שבעה הרגלים שמותחים את המכסה</h2>
<ol>
<li><b>הרץ <span class="kbd">/clear</span> בין משימות.</b> כל תור שולח מחדש את כל ההקשר — הקשר מנופח = יותר צריכה, בלי שום תועלת.</li>
<li><b>העבר חקירות לסוכן משנה.</b> הוא עובד בחלון נפרד ומחזיר סיכום קצר במקום להעמיס עליך.</li>
<li><b>השתמש ב-<span class="kbd">!</span> לפקודות.</b> פקודה שמורצת ישירות <b>לא צורכת מכסה בכלל</b> — רק התגובה של קלוד עליה.</li>
<li><b>בקש תשובות קצרות כשזה מספיק.</b> "תענה בקצרה" הוא חיסכון אמיתי.</li>
<li><b>התאם את עומק החשיבה למשימה.</b> לא כל שאלה צריכה חשיבה עמוקה — <span class="kbd">/effort</span> שולט בזה.</li>
<li><b>תכנן לפני שמבצעים.</b> תוכנית טובה חוסכת שלושה ניסיונות כושלים — וזה החיסכון הגדול מכולם.</li>
<li><b>עקוב.</b> <span class="kbd">/usage</span> מראה מה מנצל את המכסה, ו-<span class="kbd">/context</span> מראה מה תופס מקום עכשיו.</li>
</ol>
<h2>נגמרה המכסה — מה עושים?</h2>
<ul>
<li><b>ממתינים לאיפוס.</b> חלון חמש השעות חוזר מהר יותר משנדמה.</li>
<li><b>עוברים למודל קל יותר</b> למשימות פשוטות — הוא צורך פחות.</li>
<li><b>מנצלים את הזמן</b> לקריאת שיעורים באפליקציה או לתכנון המשימה הבאה על נייר.</li>
<li>הרץ <span class="kbd">/rate-limit-options</span> בסשן כדי לראות מה זמין לך.</li>
</ul>

/* ================== ENGINE ================== */
(function(){
const $=s=>document.querySelector(s);
const app=$("#app");
const MODS=window.COURSE_MODULES, GLOSS=window.GLOSSARY;

/* ---------- state ---------- */
const KEY="claude_master_v1";
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S.lessons=S.lessons||{}; S.crit=S.crit||{}; S.exDone=S.exDone||{};
S.seen=S.seen||{}; S.qstats=S.qstats||{}; S.pts=S.pts||0; S.theme=S.theme||"";
S.ach=S.ach||{}; S.streak=S.streak||{n:0,last:""}; S.voice=S.voice||{rate:1};
S.flags=S.flags||{};
if(S.freeOnly===undefined)S.freeOnly=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function addPts(n){S.pts+=n;save();paintBar()}
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function touchStreak(){
  const t=today();if(S.streak.last===t)return;
  const y=new Date(Date.now()-864e5);const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  S.streak.n=(S.streak.last===ys)?S.streak.n+1:1;S.streak.last=t;save();paintBar();
}
/* ---------- theme ---------- */
function applyTheme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme")}
applyTheme();
$("#themebtn").onclick=()=>{
  const cur=S.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  S.theme=cur==="dark"?"light":"dark";save();applyTheme();
};
/* ---------- splash ---------- */
if(S.flags.splashSeen){$("#splash").style.display="none"}
$("#splashgo").onclick=()=>{S.flags.splashSeen=1;save();const s=$("#splash");s.classList.add("hide");setTimeout(()=>s.style.display="none",500)};
/* ---------- helpers ---------- */
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function toast(msg,gold){const t=document.createElement("div");t.className="toast"+(gold?" gold":"");t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function modById(id){return MODS.find(m=>m.id===id)}
function isPaid(x){return x&&x.cost==="extra"}
function visibleMods(){return S.freeOnly?MODS.filter(m=>!isPaid(m)):MODS}
function costChip(x){return isPaid(x)?'<span class="chip pay">💳 תשלום נפרד</span>':'<span class="chip ph">✅ כלול במנוי</span>'}
function lessonKey(m,l){return m.id+"/"+l.id}
function exKey(m,x){return m.id+"/"+x.id}
function modLessonsDone(m){return m.lessons.filter(l=>S.lessons[lessonKey(m,l)]).length}
function modExDone(m){return m.exercises.filter(x=>S.exDone[exKey(m,x)]).length}
function modPct(m){const t=m.lessons.length+m.exercises.length;return t?Math.round(100*(modLessonsDone(m)+modExDone(m))/t):0}
function totLessons(){return MODS.reduce((a,m)=>a+m.lessons.length,0)}
function totEx(){return MODS.reduce((a,m)=>a+m.exercises.length,0)}
function doneLessons(){return MODS.reduce((a,m)=>a+modLessonsDone(m),0)}
function doneEx(){return MODS.reduce((a,m)=>a+modExDone(m),0)}
function qTotals(){let a=0,c=0;Object.values(S.qstats).forEach(s=>{a+=s.a;c+=s.c});return{a,c}}
function overallPct(){const t=totLessons()+totEx();return t?Math.round(100*(doneLessons()+doneEx())/t):0}
function ring(pct,size){
  const r=(size-8)/2,c=2*Math.PI*r;
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'">'+
  '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="7"/>'+
  '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" '+
  'stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct/100))+'"/>'+
  '<text x="'+size/2+'" y="'+(-size/2)+'" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="16" font-weight="800">'+pct+'%</text>'+
  '</svg></div>';
}
function paintBar(){
  $("#bar-pts").textContent="⭐ "+S.pts;
  const st=$("#bar-streak");
  if(S.streak.n>0){st.style.display="flex";st.textContent="🔥 "+S.streak.n}else st.style.display="none";
}
function setBar(title,back){$("#bar-title").textContent=title;$("#backbtn").style.display=back?"flex":"none";paintBar()}
$("#backbtn").onclick=()=>history.back();
$("#searchbtn").onclick=()=>{location.hash="search"};

/* ---------- achievements ---------- */
const ACH=[
 {id:"l1",i:"🌱",t:"הצעד הראשון",c:()=>doneLessons()>=1},
 {id:"l10",i:"📚",t:"10 שיעורים",c:()=>doneLessons()>=10},
 {id:"l50",i:"🎓",t:"50 שיעורים",c:()=>doneLessons()>=50},
 {id:"lall",i:"🏅",t:"כל השיעורים",c:()=>doneLessons()>=totLessons()&&totLessons()>0},
 {id:"x1",i:"🛠️",t:"תרגיל ראשון",c:()=>doneEx()>=1},
 {id:"x10",i:"⚒️",t:"10 תרגילים",c:()=>doneEx()>=10},
 {id:"xall",i:"🏗️",t:"כל התרגילים",c:()=>doneEx()>=totEx()&&totEx()>0},
 {id:"q50",i:"🧠",t:"50 שאלות",c:()=>qTotals().a>=50},
 {id:"q150",i:"🦉",t:"150 שאלות",c:()=>qTotals().a>=150},
 {id:"acc",i:"🎯",t:"דיוק 90%",c:()=>{const t=qTotals();return t.a>=30&&t.c/t.a>=.9}},
 {id:"s3",i:"🔥",t:"3 ימים ברצף",c:()=>S.streak.n>=3},
 {id:"s7",i:"⚡",t:"7 ימים ברצף",c:()=>S.streak.n>=7},
 {id:"m1",i:"👑",t:"מודול מושלם",c:()=>MODS.some(m=>modPct(m)===100)},
 {id:"mall",i:"🏆",t:"הקורס כולו",c:()=>MODS.length>0&&MODS.every(m=>modPct(m)===100)},
 {id:"voice",i:"🔊",t:"המורה הקולי",c:()=>!!S.flags.usedVoice},
 {id:"demo",i:"🎬",t:"הדגמה ראשונה",c:()=>!!S.flags.usedDemo}
];
function checkAch(){
  ACH.forEach(a=>{if(!S.ach[a.id]&&a.c()){S.ach[a.id]=1;save();setTimeout(()=>toast("🏆 הישג חדש: "+a.t,true),400)}});
}

/* ================== VOICE (TTS) ================== */
const V={on:false,sents:[],i:0,voice:null,ready:false,gen:0};
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices()||[];
  V.voice=vs.find(v=>v.lang==="he-IL")||vs.find(v=>/^he/i.test(v.lang))||null;
  V.ready=vs.length>0;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function extractSentences(root){
  const out=[];
  root.querySelectorAll("h2,h3,p,li,.box,.prompt-ex").forEach(el=>{
    if(el.closest(".code")||el.closest(".demo"))return;
    let t=el.textContent.replace(/\s+/g," ").trim();
    if(!t||t.length<2)return;
    t.split(/(?<=[.!?:])\s+/).forEach(s=>{s=s.trim();if(s.length>1)out.push(s)});
  });
  return out;
}
function stopVoice(){
  if("speechSynthesis" in window)speechSynthesis.cancel();
  V.on=false;document.body.classList.remove("has-voice");
  const b=$("#voicebar");if(b)b.remove();
}
function speakCur(){
  if(!V.on||V.i>=V.sents.length){finishVoice();return}
  // each utterance carries a generation tag; a cancelled one must not advance the index
  const gen=++V.gen;
  const u=new SpeechSynthesisUtterance(V.sents[V.i]);
  u.lang="he-IL";u.rate=S.voice.rate;
  if(V.voice)u.voice=V.voice;
  u.onend=()=>{if(!V.on||gen!==V.gen)return;V.i++;paintVoice();speakCur()};
  u.onerror=()=>{if(!V.on||gen!==V.gen)return;V.i++;paintVoice();setTimeout(speakCur,60)};
  speechSynthesis.speak(u);
  paintVoice();
}
function finishVoice(){toast("🔊 סיום ההקראה");stopVoice()}
function paintVoice(){
  const b=$("#voicebar");if(!b)return;
  const pct=V.sents.length?Math.round(100*V.i/V.sents.length):0;
  b.querySelector(".vb-txt").innerHTML="<b>"+esc(V.sents[V.i]||"")+"</b>";
  b.querySelector(".vb-prog>i").style.width=pct+"%";
  b.querySelector(".vb-count").textContent=(V.i+1)+"/"+V.sents.length;
  b.querySelector("#vbplay").textContent=speechSynthesis.paused?"▶":"⏸";
}
function startVoice(){
  if(!("speechSynthesis" in window)){toast("הדפדפן הזה לא תומך בהקראה");return}
  const root=$(".lesson");if(!root)return;
  V.sents=extractSentences(root);
  if(!V.sents.length){toast("אין טקסט להקראה");return}
  V.i=0;V.on=true;S.flags.usedVoice=1;save();checkAch();
  document.body.classList.add("has-voice");
  const bar=document.createElement("div");
  bar.className="voicebar";bar.id="voicebar";
  bar.innerHTML='<div class="voicebar-in">'+
    '<div class="vb-row">'+
      '<button class="vb-btn" id="vbprev" aria-label="הקודם">⏮</button>'+
      '<button class="vb-btn main" id="vbplay" aria-label="הפעל/השהה">⏸</button>'+
      '<button class="vb-btn" id="vbnext" aria-label="הבא">⏭</button>'+
      '<div class="vb-txt"></div>'+
      '<button class="vb-btn" id="vbstop" aria-label="עצור">✕</button>'+
    '</div>'+
    '<div class="vb-meta"><span class="vb-count">0/0</span>'+
      '<div class="progress-bar vb-prog"><i style="width:0%"></i></div>'+
      '<button class="vb-speed" id="vbspeed">'+S.voice.rate+'x</button></div>'+
  '</div>';
  document.body.appendChild(bar);
  $("#vbplay").onclick=()=>{
    if(speechSynthesis.paused){speechSynthesis.resume()}else{speechSynthesis.pause()}
    setTimeout(paintVoice,50);
  };
  $("#vbnext").onclick=()=>{speechSynthesis.cancel();V.i=Math.min(V.i+1,V.sents.length-1);speakCur()};
  $("#vbprev").onclick=()=>{speechSynthesis.cancel();V.i=Math.max(V.i-1,0);speakCur()};
  $("#vbstop").onclick=stopVoice;
  $("#vbspeed").onclick=()=>{
    const opts=[0.8,1,1.2,1.5];S.voice.rate=opts[(opts.indexOf(S.voice.rate)+1)%opts.length];save();
    $("#vbspeed").textContent=S.voice.rate+"x";
    speechSynthesis.cancel();speakCur();
  };
  speakCur();
}

/* ================== DEMOS ================== */
function mountDemo(slot,d){
  const el=document.createElement("div");el.className="demo";
  const head='<div class="demo-head"><span>'+(d.type==="terminal"?"⌨️":d.type==="chat"?"💬":d.type==="flow"?"🔄":"⚖️")+
    '</span><span class="dt">'+esc(d.title||"הדגמה")+'</span>'+
    (d.type==="compare"?"":'<button class="demo-play">▶ הפעל</button>')+'</div>';
  let body="";
  if(d.type==="terminal")body='<div class="termbox"></div>';
  else if(d.type==="chat")body='<div class="chat"></div>';
  else if(d.type==="flow")body='<div class="flow">'+d.steps.map(s=>
    '<div class="fstep"><span class="fi">'+s.icon+'</span><div><b>'+esc(s.t)+'</b><span>'+esc(s.d)+'</span></div></div>').join("")+'</div>';
  else if(d.type==="compare")body='<div class="cmp2">'+
    '<div class="side bad"><div class="cl">'+esc(d.bad.label||"❌ פחות טוב")+'</div>'+esc(d.bad.text)+'</div>'+
    '<div class="side good"><div class="cl">'+esc(d.good.label||"✅ טוב יותר")+'</div>'+esc(d.good.text)+'</div>'+
    (d.note?'<div class="note">💡 '+esc(d.note)+'</div>':"")+'</div>';
  el.innerHTML=head+body;
  slot.replaceWith(el);
  const btn=el.querySelector(".demo-play");
  if(!btn)return;
  let running=false;
  btn.onclick=()=>{
    if(running)return;running=true;btn.textContent="● רץ";
    S.flags.usedDemo=1;save();checkAch();
    const done=()=>{running=false;btn.textContent="↻ שוב"};
    if(d.type==="terminal")playTerminal(el.querySelector(".termbox"),d.lines,done);
    else if(d.type==="chat")playChat(el.querySelector(".chat"),d.turns,done);
    else if(d.type==="flow")playFlow(el.querySelectorAll(".fstep"),done);
  };
}
function playTerminal(box,lines,done){
  box.innerHTML="";let li=0;
  function nextLine(){
    if(li>=lines.length){done();return}
    const L=lines[li++];
    const span=document.createElement("span");
    span.className="c-"+(L.t||"out");
    box.appendChild(span);
    if(L.t==="cmd"){
      const pre=document.createElement("span");pre.className="c-ok";pre.textContent="> ";
      box.insertBefore(pre,span);
      let ci=0;const cur=document.createElement("span");cur.className="cur";box.appendChild(cur);
      (function type(){
        if(ci<L.v.length){span.textContent+=L.v[ci++];box.scrollTop=box.scrollHeight;setTimeout(type,28)}
        else{cur.remove();box.appendChild(document.createTextNode("\n"));setTimeout(nextLine,320)}
      })();
    }else{
      span.textContent=L.v;box.appendChild(document.createTextNode("\n"));
      box.scrollTop=box.scrollHeight;setTimeout(nextLine,420);
    }
  }
  nextLine();
}
function playChat(box,turns,done){
  box.innerHTML="";let ti=0;
  function next(){
    if(ti>=turns.length){done();return}
    const T=turns[ti++];
    const b=document.createElement("div");
    b.className="bub "+(T.who==="user"?"u":T.who==="tool"?"t":"c");
    box.appendChild(b);
    let ci=0;
    (function type(){
      if(ci<T.v.length){b.textContent+=T.v[ci];ci+=T.who==="user"?1:2;setTimeout(type,T.who==="user"?26:14)}
      else{b.textContent=T.v;setTimeout(next,430)}
    })();
  }
  next();
}
function playFlow(steps,done){
  steps.forEach(s=>s.classList.remove("on"));
  let i=0;
  (function step(){
    if(i>=steps.length){done();return}
    steps[i].classList.add("on");i++;setTimeout(step,900);
  })();
}

/* ---------- router ---------- */
function route(){
  const h=(location.hash||"#home").slice(1);
  const p=h.split("/");
  stopVoice();
  window.scrollTo(0,0);
  document.querySelectorAll(".bnav a").forEach(a=>a.classList.toggle("on",a.dataset.nav===p[0]));
  if(p[0]==="home")return home();
  if(p[0]==="m")return modulePage(p[1],p[2]||"lessons");
  if(p[0]==="l")return lessonPage(p[1],p[2]);
  if(p[0]==="x")return exercisePage(p[1],p[2]);
  if(p[0]==="q")return quizPage(p[1]);
  if(p[0]==="mix")return mixPage();
  if(p[0]==="gloss")return glossPage();
  if(p[0]==="prog")return progPage();
  if(p[0]==="search")return searchPage();
  if(p[0]==="about")return aboutPage();
  home();
}
addEventListener("hashchange",route);

/* ---------- LESSON ---------- */
function lessonPage(mid,lid){
  const m=modById(mid);if(!m)return home();
  const li=m.lessons.findIndex(l=>l.id===lid);if(li<0)return modulePage(mid,"lessons");
  const l=m.lessons[li],key=lessonKey(m,l),done=S.lessons[key];
  setBar(m.title,true);
  const prev=m.lessons[li-1],next=m.lessons[li+1];
  const body=l.html.replace(/\[\[demo:(\d+)\]\]/g,'<div class="demo-slot" data-i="$1"></div>');
  app.innerHTML='<div class="screen">'+
    '<div class="sub" style="margin-bottom:8px">'+m.icon+' שיעור '+(li+1)+' מתוך '+m.lessons.length+
      (isPaid(l)?' · <span class="chip pay">💳 ביצוע דורש תשלום</span>':'')+'</div>'+
    '<h1 style="margin-bottom:14px">'+esc(l.title)+'</h1>'+
    '<button class="voice-cta" id="voicego"><span class="vi">🔊</span><div><b>הַקְרֵא לי את השיעור</b>'+
      '<span>המורה הקולי יקריא בעברית — אפשר להאזין תוך כדי הליכה</span></div></button>'+
    '<div class="lesson">'+body+'</div>'+
    '<button class="btn wide mt '+(done?"sec":"")+'" id="donebtn">'+(done?"✓ השיעור הושלם":"סיימתי את השיעור ✓")+'</button>'+
    '<div class="lesson-nav">'+
      (prev?'<a class="btn sec" href="#l/'+mid+'/'+prev.id+'">→ הקודם</a>':"")+
      (next?'<a class="btn sec" href="#l/'+mid+'/'+next.id+'">הבא ←</a>':'<a class="btn sec" href="#m/'+mid+'/ex">לתרגילים 🛠️</a>')+
    '</div></div>';
  // demos placed inline via [[demo:N]] markers; any left over are appended at the end
  const demos=l.demos||[], placed=new Set();
  document.querySelectorAll(".demo-slot").forEach(sl=>{
    const i=+sl.dataset.i, d=demos[i];
    if(d){placed.add(i);mountDemo(sl,d)}else sl.remove();
  });
  const rest=demos.map((d,i)=>({d,i})).filter(o=>!placed.has(o.i));
  if(rest.length){
    const host=$(".lesson");
    rest.forEach(o=>{const sl=document.createElement("div");host.appendChild(sl);mountDemo(sl,o.d)});
  }
  enhancePromptExamples($(".lesson"));
  applyDeviceHints($(".lesson"));
  $("#voicego").onclick=startVoice;
  $("#donebtn").onclick=()=>{
    if(!S.lessons[key]){S.lessons[key]=1;save();touchStreak();addPts(10);checkAch();
      toast("⭐ +10 נקודות! כל הכבוד");
      const b=$("#donebtn");b.textContent="✓ השיעור הושלם";b.classList.add("sec");}
  };
}

  const m=modById(mid);if(!m)return home();
  const x=m.exercises.find(e=>e.id===xid);if(!x)return modulePage(mid,"ex");
  const key=exKey(m,x);
  setBar("תרגיל מעשי",true);
  let html='<div class="screen"><div class="sub" style="margin-bottom:6px">'+m.icon+' '+esc(m.title)+'</div>'+
    '<h1>'+esc(x.title)+'</h1><div style="margin:8px 0 14px">'+
    (x.where==="pc"?'<span class="chip pc">💻 דורש מחשב</span>':'<span class="chip ph">📱 גם מהטלפון</span>')+
    ' <span class="chip brand">🎯 תרגיל מעשי</span></div>'+
    '<div class="card"><b>המטרה</b><p class="sub" style="font-size:15px;margin-top:4px">'+esc(x.goal)+'</p></div>'+
    '<div class="card"><h2 style="margin-top:0">שלבי הביצוע</h2><ol class="steps">'+
      x.steps.map(s=>"<li>"+esc(s)+"</li>").join("")+'</ol></div>'+
    '<div class="card"><h2 style="margin-top:0">✅ קריטריוני הצלחה — סמן מה שהשגת</h2>';
  x.criteria.forEach((c,i)=>{
    html+='<label class="crit"><input type="checkbox" data-i="'+i+'" '+(S.crit[key+":"+i]?"checked":"")+'><span>'+esc(c)+'</span></label>';
  });
  html+='</div><div id="exmsg"></div></div>';
  app.innerHTML=html;
  enhancePromptExamples(app);
  applyDeviceHints(app);
  document.querySelectorAll(".crit input").forEach(inp=>{
    inp.onchange=()=>{
      const i=inp.dataset.i;
      if(inp.checked)S.crit[key+":"+i]=1;else delete S.crit[key+":"+i];
      const all=x.criteria.every((c,j)=>S.crit[key+":"+j]);
      if(all&&!S.exDone[key]){S.exDone[key]=1;save();touchStreak();addPts(25);checkAch();
        toast("🏆 תרגיל הושלם! +25 נקודות");
        $("#exmsg").innerHTML='<div class="card center" style="background:var(--ok-soft);border-color:var(--ok)">'+
          '<div style="font-size:36px">🏆</div><b>כל הכבוד! השלמת את התרגיל</b></div>';}
      else if(!all&&S.exDone[key]){delete S.exDone[key];$("#exmsg").innerHTML=""}
      save();
    };
  });
}

/* ---------- QUIZ ---------- */
let QZ=null;
window.startQuiz=function(mid){
  const mixed=mid==="mix";
  const pool=mixed?MODS.flatMap(m=>m.quiz.map(q=>Object.assign({},q,{mod:m.id})))
                  :modById(mid).quiz.map(q=>Object.assign({},q,{mod:mid}));
  const unseen=pool.filter(q=>!S.seen[q.id]);
  if(!unseen.length){toast("ראית את כל השאלות — אפס את המאגר");return}
  QZ={mid:mid,qs:shuffle(unseen).slice(0,10),i:0,c:0,answered:false,optOrder:null};
  if(location.hash==="#q/"+mid)quizPage(mid);else location.hash="q/"+mid;
};
window.resetSeen=function(mid){
  const pool=mid==="mix"?MODS.flatMap(m=>m.quiz):modById(mid).quiz;
  pool.forEach(q=>delete S.seen[q.id]);
  if(mid!=="mix")S.qstats[mid]={a:0,c:0};else S.qstats={};
  save();toast("המאגר אופס 🔄");route();
};
function quizPage(mid){
  if(!QZ||QZ.mid!==mid){if(mid==="mix")return mixPage();return modulePage(mid,"quiz")}
  setBar("בוחן",true);
  const q=QZ.qs[QZ.i];
  const opts=QZ.optOrder||(QZ.optOrder=shuffle(q.opts.map((o,i)=>i)));
  app.innerHTML='<div class="screen"><div class="q-head"><span class="chip brand">'+(QZ.i+1)+'/'+QZ.qs.length+'</span>'+
    '<div class="progress-bar"><i style="width:'+Math.round(100*QZ.i/QZ.qs.length)+'%"></i></div>'+
    '<span class="chip done">✓ '+QZ.c+'</span></div>'+
    '<div class="card"><h2 style="margin:0">'+esc(q.q)+'</h2></div>'+
    '<div id="opts">'+opts.map(oi=>'<button class="q-opt" data-oi="'+oi+'">'+esc(q.opts[oi])+'</button>').join("")+'</div>'+
    '<div id="qfoot"></div></div>';
  document.querySelectorAll(".q-opt").forEach(btn=>{
    btn.onclick=()=>{
      if(QZ.answered)return;QZ.answered=true;
      const oi=+btn.dataset.oi,ok=oi===q.a;
      if(ok){QZ.c++;btn.classList.add("sel-ok");addPts(5)}
      else{btn.classList.add("sel-err");const r=document.querySelector('.q-opt[data-oi="'+q.a+'"]');if(r)r.classList.add("reveal")}
      document.querySelectorAll(".q-opt").forEach(b=>b.disabled=true);
      S.seen[q.id]=1;
      const st=S.qstats[q.mod]||(S.qstats[q.mod]={a:0,c:0});st.a++;if(ok)st.c++;
      save();touchStreak();checkAch();
      $("#qfoot").innerHTML='<div class="q-exp '+(ok?"good":"bad")+'"><b>'+(ok?"✓ נכון!":"✗ לא מדויק.")+'</b> '+esc(q.exp)+'</div>'+
        '<button class="btn wide" id="nextq">'+(QZ.i+1<QZ.qs.length?"לשאלה הבאה ←":"סיום הבוחן 🏁")+'</button>';
      $("#nextq").onclick=()=>{
        QZ.i++;QZ.answered=false;QZ.optOrder=null;
        if(QZ.i<QZ.qs.length)quizPage(mid);else quizEnd();
      };
      $("#nextq").scrollIntoView({behavior:"smooth",block:"end"});
    };
  });
}
function quizEnd(){
  const n=QZ.qs.length,c=QZ.c,pct=Math.round(100*c/n);
  const msg=pct===100?"מושלם! שליטה מלאה 🏆":pct>=80?"מצוין! אתה בדרך הנכונה 🌟":pct>=60?"יפה! שווה לחזור על השיעורים 💪":"התחלה טובה — חזור על השיעורים ונסה שוב 📚";
  const mid=QZ.mid;QZ=null;
  setBar("תוצאות",true);
  app.innerHTML='<div class="screen"><div class="card center">'+
    '<div style="font-size:44px">'+(pct>=80?"🏆":pct>=60?"🌟":"📚")+'</div>'+
    '<div class="score-big">'+c+'/'+n+'</div><p class="sub">'+msg+'</p>'+
    '<button class="btn wide mt" onclick="startQuiz(\''+mid+'\')">סבב נוסף 🔄</button>'+
    '<a class="btn sec wide mt" href="'+(mid==="mix"?"#mix":"#m/"+mid+"/quiz")+'">חזרה</a></div></div>';
}

/* ---------- MIXED ---------- */
function mixPage(){
  setBar("תרגול מעורב",false);
  const all=MODS.flatMap(m=>m.quiz);

let IDX=null;
function buildIndex(){
  if(IDX)return IDX;
  IDX=[];
  const tmp=document.createElement("div");
  MODS.forEach(m=>{
    m.lessons.forEach(l=>{
      tmp.innerHTML=l.html;
      IDX.push({k:"שיעור",t:l.title,s:m.title,u:"#l/"+m.id+"/"+l.id,txt:(l.title+" "+tmp.textContent).replace(/\s+/g," ")});
    });
    m.exercises.forEach(x=>{
      IDX.push({k:"תרגיל",t:x.title,s:m.title,u:"#x/"+m.id+"/"+x.id,txt:x.title+" "+x.goal+" "+x.steps.join(" ")});
    });
  });
  GLOSS.forEach(g=>IDX.push({k:"מונח",t:g.he+" — "+g.en,s:"מילון",u:"#gloss",txt:g.he+" "+g.en+" "+g.def}));
  return IDX;
}

/* ================== DEVICE ================== */
const DEV=(function(){
  const ua=navigator.userAgent||"";
  const os = /Windows/.test(ua) ? "Windows"
           : /Android/.test(ua) ? "Android"
           : /iPhone|iPad|iPod/.test(ua) ? "iOS"
           : /Mac OS X/.test(ua) ? "macOS"
           : /Linux/.test(ua) ? "Linux" : "לא ידוע";
  const br = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome"
           : /Safari\//.test(ua) ? "Safari" : /Firefox\//.test(ua) ? "Firefox" : "אחר";
  return {os:os, browser:br, mobile:/Android|iPhone|iPad|iPod/.test(ua),
    installed: matchMedia("(display-mode: standalone)").matches || navigator.standalone===true,
    touch:(navigator.maxTouchPoints||0)>0};
})();
/* content marked data-os shows only on the matching platform */
function applyDeviceHints(root){
  root.querySelectorAll("[data-os]").forEach(el=>{
    const want=el.getAttribute("data-os").split(",").map(s=>s.trim());
    el.style.display = want.includes(DEV.os) ? "" : "none";
  });
}
function hebrewVoice(){
  if(!("speechSynthesis" in window))return null;
  const v=(speechSynthesis.getVoices()||[]).find(x=>/^he/i.test(x.lang));
  return v?v.name:null;
}

function enhancePromptExamples(root){
  root.querySelectorAll(".prompt-ex").forEach(px=>{

    const label=px.querySelector(".pl");
    const text=[...px.childNodes].filter(n=>n!==label)
      .map(n=>n.textContent||"").join("").replace(/\s+/g," ").trim();

    const bar=document.createElement("div");
    bar.className="px-bar";
    const open=document.createElement("a");
    open.className="px-btn"; open.target="_blank"; open.rel="noopener";
    open.href=CLAUDE_NEW+encodeURIComponent(text);
    open.textContent="✨ פתח את זה בקלוד";
    const copy=document.createElement("button");
    copy.className="px-btn sec"; copy.textContent="העתק";
    copy.onclick=()=>{
      navigator.clipboard.writeText(text).then(()=>{copy.textContent="✓ הועתק";
        setTimeout(()=>copy.textContent="העתק",1600)}).catch(()=>toast("ההעתקה נחסמה בדפדפן"));

  });
}

    '<div class="box info"><b>🔒 אם בכל זאת — המפתח נשאר אצלך</b>הוא נשמר רק בדפדפן של המכשיר הזה, נשלח רק לשרתי Anthropic, ואף אחד אחר — כולל מי ששיתף לך את האפליקציה — לא יכול לראות אותו.</div>'+
    '<p class="sub" style="margin:14px 0 8px">להשגת מפתח: היכנס ל-<a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener" style="color:var(--brand)">platform.claude.com</a> ← Create Key. הדבק אותו כאן:</p>'+
    '<input id="keyinput" type="password" placeholder="sk-ant-..." autocomplete="off" value="">'+
    '<button class="btn wide" id="keysave">שמור והתחל לדבר</button>'+
    (has?'<button class="btn ghost wide mt" id="keyclear" style="color:var(--err)">מחק את המפתח מהמכשיר</button>':'')+
    (fromSettings&&has?'<button class="btn sec wide mt" id="keyback">חזרה לשיחה</button>':'')+
  '</div>';
  $("#keysave").onclick=()=>{
    const v=$("#keyinput").value.trim();
    if(!v){toast("לא הוזן מפתח");return}
    if(!/^sk-ant-/.test(v)){toast("מפתח לא תקין — הוא מתחיל ב-sk-ant-");return}
    setKey(v); CHAT.msgs=[]; renderChat(); toast("המפתח נשמר במכשיר");
  };
  const kc=$("#keyclear"); if(kc)kc.onclick=()=>{setKey("");CHAT.msgs=[];renderKeyForm(false);toast("המפתח נמחק")};
  const kb=$("#keyback"); if(kb)kb.onclick=renderChat;
  const bf=$("#backfree"); if(bf)bf.onclick=renderFree;
}
function renderChat(){
  const body=$("#chatbody"); if(!body)return;
  $("#chatfoot").style.display="flex";
  if(!CHAT.msgs.length){
    body.innerHTML='<div class="center sub" style="padding:18px 6px">'+
      '<div style="font-size:34px">💬</div><p style="margin-top:6px">שאל אותי כל דבר על החומר — אני מכיר את הקורס ואת השיעור שאתה נמצא בו.</p></div>'+
      '<div class="suggest">'+
      ['הסבר לי את השיעור הזה במילים פשוטות','תן לי דוגמה מהחיים שלי','אני תקוע — מה לעשות?','בחן אותי על מה שלמדתי']
        .map(s=>'<button>'+s+'</button>').join("")+'</div>';
    body.querySelectorAll(".suggest button").forEach(b=>b.onclick=()=>{$("#chatinput").value=b.textContent;sendChat()});
  }else{
    body.innerHTML=CHAT.msgs.map(m=>'<div class="cmsg '+(m.role==="user"?"me":"ai")+'">'+esc(m.content)+'</div>').join("");
    body.scrollTop=body.scrollHeight;
  }
  const inp=$("#chatinput");
  inp.oninput=()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,120)+"px"};
  inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat()}};
  $("#chatsend").onclick=sendChat;
}
async function sendChat(){
  if(CHAT.busy)return;
  const inp=$("#chatinput"); const text=inp.value.trim();
  if(!text)return;
  const key=getKey(); if(!key){renderKeyForm(false);return}
  CHAT.msgs.push({role:"user",content:text});
  inp.value=""; inp.style.height="auto";
  const body=$("#chatbody");
  if(CHAT.msgs.length===1)body.innerHTML="";
  body.insertAdjacentHTML("beforeend",'<div class="cmsg me">'+esc(text)+'</div>');
  const bubble=document.createElement("div");
  bubble.className="cmsg ai";
  bubble.innerHTML='<span class="typing"><span></span><span></span><span></span></span>';
  body.appendChild(bubble); body.scrollTop=body.scrollHeight;
  CHAT.busy=true; $("#chatsend").disabled=true;
  const ctx=chatContext();
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"content-type":"application/json","x-api-key":key,
        "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-5",max_tokens:1200,
        system:SYSTEM+(ctx?" "+ctx:""),
        messages:CHAT.msgs.map(m=>({role:m.role,content:m.content})),stream:true})
    });
    if(!res.ok){
      let msg="שגיאה "+res.status;
      if(res.status===401)msg="המפתח נדחה. בדוק שהעתקת אותו במלואו, או צור מפתח חדש.";
      else if(res.status===400)msg="הבקשה נדחתה. ייתכן שהיתרה בחשבון ה-API נגמרה.";
      else if(res.status===429)msg="הגעת למגבלת קצב. המתן רגע ונסה שוב.";
      else{try{const j=await res.json();if(j.error&&j.error.message)msg+=" — "+j.error.message}catch(e){}}
      throw new Error(msg);
    }
    const reader=res.body.getReader(), dec=new TextDecoder();
    let buf="", acc="";
    bubble.textContent="";
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n"); buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith("data:"))continue;
        const payload=line.slice(5).trim();
        if(!payload||payload==="[DONE]")continue;
        try{
          const ev=JSON.parse(payload);
          if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.text){
            acc+=ev.delta.text; bubble.textContent=acc; body.scrollTop=body.scrollHeight;
          }
        }catch(e){}
      }
    }
    if(!acc)acc="(לא התקבלה תשובה)";
    bubble.textContent=acc;
    CHAT.msgs.push({role:"assistant",content:acc});
  }catch(err){
    bubble.className="cmsg err";
    const off=!navigator.onLine?"אין חיבור לאינטרנט. ":"";
    bubble.textContent="⚠️ "+off+(err.message||"לא הצלחתי להתחבר");
    CHAT.msgs.pop();
  }finally{
    CHAT.busy=false; const s=$("#chatsend"); if(s)s.disabled=false;
    body.scrollTop=body.scrollHeight;
  }
}
$("#chatfab").onclick=openChat;

  addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}
paintBar();
route();
})();
