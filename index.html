{id:"l1",title:"מה זה Skill ולמה זה גאוני?",minutes:6,html:`
<h2>הבעיה שכולנו מכירים</h2>
<p>יש דברים שאתה מסביר לקלוד שוב ושוב: איך בדיוק בנוי הדוח שלך, מה כללי הכתיבה של העסק, איך אתה אוהב סיכומי פגישות. הסבר מצוין בשיחה אחת — נעלם בשיחה הבאה.</p>
<p><span class="term">Skill <span class="en">(כישור)</span></span> פותר את זה: חבילת הוראות (ולפעמים גם קבצים ותבניות) שאתה בונה <b>פעם אחת</b> — ומאז קלוד שולף אותה <b>אוטומטית בדיוק כשצריך</b>.</p>
<h2>איך זה עובד? חשיפה הדרגתית</h2>
<p>הקסם של Skills הוא מנגנון ה<span class="term">חשיפה ההדרגתית <span class="en">(Progressive Disclosure)</span></span>:</p>
<ol>
<li>קלוד מכיר בכל רגע רק את <b>שם ותיאור</b> של כל הכישורים שלך (זול וקל).</li>
<li>כשמשימה <b>מתאימה לתיאור</b> — הוא טוען את הכישור המלא.</li>
<li>קבצים נלווים (תבניות, דוגמאות) נטענים רק אם צריך.</li>
</ol>
<p>התוצאה: אפשר להחזיק עשרות כישורים בלי "להכביד" על קלוד — כל אחד מתעורר רק בזמנו. כמו ארגז כלים שכל מגירה בו נפתחת לבד ברגע הנכון.</p>
<h2>איפה Skills עובדים?</h2>
<p>בכל האקוסיסטם: Claude.ai (צ'אט), Cowork, Claude Code וה-API. בונים פעם אחת — משתמשים בכל מקום. יש גם כישורים מובנים של Anthropic (יצירת מסמכי Word/Excel/PowerPoint/PDF — הם אלה שעבדו בשבילך ב-Cowork!) וכישורים של שותפים.</p>
<h2>Skill לעומת מה שכבר למדנו</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>כלי</th><th>מתי הוא הנכון</th></tr>
<tr><td>הוראות Project</td><td>הקשר קבוע לנושא אחד, בתוך פרויקט</td></tr>
<tr><td>Style</td><td>סגנון כתיבה כללי</td></tr>
<tr><td><b>Skill</b></td><td><b>נוהל עבודה מוגדר שחוזר על עצמו — שמופעל אוטומטית לפי הצורך, בכל שיחה</b></td></tr>
</table></div>
<div class="box try"><b>🚀 נסה עכשיו</b>רשום 3 דברים שאתה מוצא את עצמך מסביר לקלוד שוב ושוב. אחד מהם יהפוך בקרוב ל-Skill הראשון שלך.</div>

{id:"l2",title:"האנטומיה של Skill: קובץ SKILL.md",minutes:7,html:`
<h2>מבנה פשוט להפליא</h2>
<p>Skill הוא בסך הכול <b>תיקייה</b> שבתוכה קובץ טקסט בשם <span class="kbd">SKILL.md</span> (ואופציונלית עוד קבצים). הקובץ בנוי משני חלקים:</p>
<h3>חלק 1: הכותרת (Frontmatter)</h3>
<p>שורות מובנות בראש הקובץ, בין שני קווי <span class="kbd">---</span>:</p>
<div class="code">---
name: meeting-summary
description: סיכום פגישות בפורמט הקבוע שלי — החלטות,
  משימות עם אחראים, ונושאים פתוחים. השתמש בכל פעם
  שמבקשים לסכם פגישה, שיחה או ישיבה.
---</div>
<ul>
<li><span class="kbd">name</span> — שם באנגלית: אותיות קטנות, מספרים ומקפים בלבד (עד 64 תווים), <b>וחייב להיות זהה לשם התיקייה</b>.</li>
<li><span class="kbd">description</span> — התיאור. <b>זה השדה הקריטי!</b> לפיו קלוד מחליט מתי להפעיל את הכישור. חייב לכלול גם <i>מה</i> הכישור עושה וגם <i>מתי</i> להשתמש בו. (בהעלאה ל-Claude.ai — עד 200 תווים.)</li>
</ul>
<h3>חלק 2: ההוראות עצמן</h3>
<p>אחרי הכותרת — טקסט חופשי: הנוהל, הכללים, דוגמאות. כמו פרומפט מצוין ששמרת:</p>
<div class="code"># סיכום פגישות

בכל סיכום פגישה פעל כך:

1. פתח בשורת מטא: תאריך, משתתפים, נושא
2. סעיף "החלטות" — רשימה ממוספרת
3. סעיף "משימות" — טבלה: משימה | אחראי | דדליין
4. סעיף "נושאים פתוחים לפגישה הבאה"

כללים:
- עברית תקנית, משפטים קצרים
- כל החלטה מנוסחת כעובדה, לא כדיון
- אם חסר אחראי למשימה — סמן ⚠️ ושאל</div>
<h2>ולמתקדמים: קבצים נלווים</h2>
<p>אפשר להוסיף לתיקייה תת-תיקיות: <span class="kbd">references/</span> (חומר עזר מפורט), <span class="kbd">assets/</span> (תבניות וקבצים), <span class="kbd">scripts/</span> (קוד הרצה — למתקדמים). מזכירים אותם בהוראות, וקלוד טוען אותם כשצריך.</p>
<div class="box tip"><b>💡 כלל האצבע הרשמי</b>שמור את SKILL.md ממוקד וקצר (עד ~500 שורות). כישור אחד = משימה אחת. עדיף שלושה כישורים ממוקדים מאחד ענק שעושה הכול.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>נסח בראש (או על נייר) את ה-description לאחד משלושת הרעיונות שרשמת בשיעור הקודם. זכור: מה + מתי.</div>
`},
{id:"l3",title:"בונים Skill ראשון — עם קלוד כשותף",minutes:7,html:`
<h2>הסוד: לא בונים לבד</h2>
<p>הדרך הקלה והנכונה לבנות Skill היא... לבקש מקלוד לבנות אותו איתך. הוא מכיר את הפורמט על בוריו. ככה זה נראה:</p>
<h3>שלב 1: שיחת האפיון</h3>
<div class="prompt-ex"><div class="pl">פרומפט התנעה (בצ'אט או ב-Claude Code)</div>אני רוצה לבנות Skill לקלוד שמסכם פגישות בפורמט הקבוע שלי. הנה דוגמה לסיכום שאני אוהב: [הדבק דוגמה אמיתית]. שאל אותי שאלות כדי לדייק את הנוהל, ואז בנה לי את קובץ ה-SKILL.md המלא לפי המפרט הרשמי.</div>
<p>קלוד ישאל, תענה, והוא יפיק קובץ מוכן — כולל frontmatter תקני.</p>
<h3>שלב 2: ביקורת</h3>
<p>קרא את ההוראות שנוצרו. הן משקפות בדיוק את מה שרצית? חסר כלל? מיותר משהו? זה הרגע לתקן — כמו תמיד, בעברית פשוטה.</p>
<h3>שלב 3: בדיקת ה-description</h3>
<p>שאל את עצמך: אם קלוד יקרא <b>רק את התיאור</b>, האם יידע להפעיל את הכישור בכל המצבים הנכונים — ורק בהם? תיאור טוב: "סיכום פגישות, שיחות וישיבות בפורמט הקבוע שלי — הפעל כשמבקשים לסכם מפגש". תיאור גרוע: "עוזר עם פגישות".</p>
<h2>איפה זה קורה בפועל?</h2>
<ul>
<li><b>ב-Claude Code:</b> בקש בסשן — "צור לי skill בשם meeting-summary" — והוא ייצור את התיקייה והקובץ במקום הנכון. אפשר גם לנהל עם הפקודה <span class="kbd">/skills</span>.</li>
<li><b>ל-Claude.ai ול-Cowork:</b> בונים את התיקייה (עם קלוד), אורזים ל-ZIP ומעלים — זה השיעור הבא.</li>
</ul>
<div class="box info"><b>ℹ️ יש גם 'בונה כישורים' מקצועי</b>ב-Claude Code קיים כישור מובנה בשם skill-creator שמנהל את כל תהליך הבנייה בצורה מודרכת. שאל את קלוד: "השתמש ב-skill-creator כדי לבנות איתי skill חדש".</div>
<div class="box try"><b>🚀 נסה עכשיו</b>נהל את שיחת האפיון! גם בטלפון: העלה דוגמה של תוצר שאתה אוהב ובקש מקלוד להפיק ממנה SKILL.md. שמור את התוצר — נעלה אותו בתרגיל.</div>
`},
{id:"l4",title:"העלאה, הפעלה ובדיקה",minutes:6,html:`
<h2>אריזה נכונה — הפרט שמפיל מתחילים</h2>
<p>כדי להעלות Skill ל-Claude.ai, אורזים את התיקייה כקובץ <span class="kbd">ZIP</span>. שים לב לכלל הקריטי: ה-ZIP צריך להכיל את <b>התיקייה עצמה</b>, לא את הקבצים ישירות:</p>
<div class="code">✅ נכון:
meeting-summary.zip
└── meeting-summary/
    └── SKILL.md

❌ שגוי:
meeting-summary.zip
└── SKILL.md   (בלי תיקייה עוטפת)</div>
<p>(ב-Windows: לוחצים קליק ימני על <b>התיקייה</b> ← "דחוס לקובץ ZIP". וכמובן — אפשר פשוט לבקש מקלוד ב-Cowork או ב-Code לארוז נכון בשבילך.)</p>
<h2>העלאה והפעלה</h2>
<ol>
<li>ב-claude.ai פתח <b>Customize</b> (בסרגל הצד) ← <b>Skills</b>.</li>
<li>העלה את קובץ ה-ZIP.</li>
<li>ודא שהכישור מופיע ברשימה ומופעל (Enabled).</li>
</ol>
<h2>בדיקה אמיתית — שלושה מבחנים</h2>
<ol>
<li><b>מבחן ההפעלה:</b> פתח שיחה חדשה ושלח בקשה שאמורה להפעיל את הכישור ("סכם לי את הפגישה הבאה: ..."). קלוד אמור להשתמש בו — לרוב תראה זאת בתהליך החשיבה שלו או בציון שהכישור נטען.</li>
<li><b>מבחן התוצר:</b> האם הפלט באמת לפי הנוהל שהגדרת? כל הסעיפים? הפורמט?</li>
<li><b>מבחן השקט:</b> שלח בקשה <b>לא</b> קשורה — ודא שהכישור לא מופעל סתם.</li>
</ol>

{id:"l1",title:"מה זה MCP? ההסבר הפשוט",minutes:6,html:`
<h2>הבעיה: קלוד חי בבועה</h2>
<p>קלוד חכם — אבל בברירת המחדל הוא לא רואה את המייל שלך, את היומן, את הקבצים בדרייב או את המערכות של העבודה. כל פיסת מידע צריכה לעבור דרכך: העתק, הדבק, העלה.</p>
<h2>הפתרון: תקן חיבור אוניברסלי</h2>
<p><span class="term">MCP <span class="en">(Model Context Protocol)</span></span> הוא תקן פתוח שפיתחה Anthropic — "שפה משותפת" שמאפשרת ל-AI להתחבר לכלים ולמאגרי מידע חיצוניים. הדימוי המקובל: <b>USB-C של עולם ה-AI</b> — שקע אחיד שאליו אפשר לחבר כל שירות: ג'ימייל, יומן, דרייב, מערכת ניהול לקוחות, בסיס נתונים…</p>
<p>ובגלל שזה תקן פתוח — כל חברה יכולה לבנות "שרת MCP" לשירות שלה, וכל כלי AI שתומך בתקן יכול להתחבר. זה הפך לסטנדרט של התעשייה כולה.</p>
<h2>ובעברית פשוטה: Connectors</h2>
<p>בממשק של קלוד, חיבורי MCP נקראים <span class="term">Connectors <span class="en">(מחברים)</span></span>. אתה לא צריך להתעסק בטכנולוגיה שמתחת — רק לבחור שירות מהרשימה, ללחוץ "התחבר" ולאשר. מרגע החיבור, קלוד יכול (ברשותך) לקרוא ולפעול מול השירות.</p>
<h2>מה זה פותח? דוגמאות</h2>
<ul>
<li>"מה קבעתי למחר? תכין לי סדר יום מסודר" (יומן)</li>
<li>"מצא את המייל עם הצעת המחיר מחברת X וסכם את התנאים" (ג'ימייל)</li>
<li>"קרא את מסמך התקציב מהדרייב וענה: כמה הוקצה לשיווק?" (דרייב)</li>
<li>"רכז את כל החשבוניות שקיבלתי החודש במייל לטבלת אקסל" (שילוב!)</li>
</ul>
<div class="box info"><b>ℹ️ ההבדל מחיפוש ברשת</b>חיפוש ברשת מביא מידע ציבורי מהאינטרנט. Connectors מביאים את <b>המידע הפרטי שלך</b> — מהחשבונות שלך, ברשותך. שני צינורות שונים ומשלימים.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>חשוב: איזה מידע אתה מעתיק-מדביק לקלוד הכי הרבה? מייל? מסמכים? זה החיבור הראשון שכדאי לך לחבר.</div>
`},
{id:"l2",title:"החיבור הראשון: מחברים שירות בפועל",minutes:7,html:`
<h2>שלושה צעדים פשוטים</h2>
<ol>
<li>ב-claude.ai פתח <b>Customize</b> (בסרגל הצד) ← <b>Connectors</b>.</li>
<li>בחר שירות מהרשימה — למשל Google Drive, Gmail או Google Calendar — ולחץ <b>Connect</b>.</li>
<li>תועבר למסך התחברות של השירות (למשל חשבון Google): התחבר ואשר את ההרשאות המבוקשות. חוזרים לקלוד — מחובר! ✅</li>
</ol>
<p>זהו תהליך חד-פעמי לכל שירות. מהרגע הזה קלוד יכול להשתמש בחיבור בשיחות — כשתבקש או כשזה רלוונטי למשימה.</p>
<h2>ממשק ההרשאות — מה בעצם אישרת?</h2>
<p>במסך האישור של השירות תראה בדיוק מה ניתן: "קריאת אימיילים", "צפייה ביומן" וכו'. שים לב להבחנה החשובה:</p>
<ul>
<li><b>קריאה</b> — קלוד יכול לראות מידע (לקרוא מיילים, לראות אירועים).</li>
<li><b>כתיבה/פעולה</b> — קלוד יכול גם לשנות (ליצור אירוע, לשלוח בתגובה) — תלוי בשירות ובהרשאות. פעולות משמעותיות תמיד כפופות לאישור שלך.</li>
</ul>
<h2>שימוש בשיחה</h2>
<p>אחרי החיבור פשוט מבקשים בשפה חופשית:</p>
<div class="prompt-ex"><div class="pl">דוגמאות</div>בדוק ביומן שלי מתי אני פנוי השבוע לפגישה של שעה בבוקר<br>—<br>מצא בדרייב את המסמך על תוכנית העבודה וסכם לי את הפרק על תקציב<br>—<br>אילו מיילים חשובים קיבלתי היום ועוד לא עניתי עליהם?</div>
<p>אפשר גם לצרף תוכן מהשירות ידנית: בכפתור ה-<b>+</b> בשיחה תמצא "הוסף מ-Drive" וכדומה — לבחירת קובץ ספציפי.</p>
<h2>וגם בפרויקטים</h2>
<p>זוכר את מאגר הידע של Projects? אפשר להוסיף אליו מסמכים <b>ישירות מהדרייב</b> — והם אף מתעדכנים כשהמקור משתנה. פרויקט "העסק שלי" עם מסמכים חיים מהדרייב = שילוב מנצח.</p>
<div class="box try"><b>🚀 נסה עכשיו</b>חבר את החיבור הראשון שלך (מומלץ: Google Calendar או Drive — הכי שימושיים מיד) ושאל שאלה אמיתית על המידע שלך.</div>
`},
{id:"l3",title:"עבודה חכמה עם חיבורים: תרחישים משולבים",minutes:6,html:`
<h2>הכוח האמיתי: שילובים</h2>
<p>חיבור אחד זה נחמד. הקסם מתחיל כשמשלבים כמה מקורות במשימה אחת:</p>
<div class="prompt-ex"><div class="pl">מייל + יומן</div>מצא את המייל האחרון מרואת החשבון שלי, ולפי מה שהיא מבקשת — הצע לי 3 זמנים פנויים ביומן שלי השבוע לשיחה איתה ונסח לה תשובה.</div>
<div class="prompt-ex"><div class="pl">דרייב + Cowork</div>קח את קובץ המחירון מהדרייב ואת רשימת הלקוחות מהמייל, והכן קובץ אקסל של הצעת מחיר לכל לקוח.</div>
<div class="prompt-ex"><div class="pl">סיכום שבועי</div>הכן לי סיכום 'תמונת מצב שבועית': הפגישות החשובות מהיומן, מיילים שדורשים מענה, ומשימות שעולות מהם — מסודר לפי דחיפות.</div>
<h2>החיבורים הזמינים — מבחר הולך וגדל</h2>
<p>בספריית החיבורים (Connectors Directory) תמצא בין השאר: שירותי Google (דרייב, ג'ימייל, יומן), Microsoft 365, GitHub, Slack, Notion, ועוד עשרות — כולל כלים לניהול משימות, עיצוב ונתונים. הרשימה גדלה כל הזמן.</p>
<h2>הרגלים חכמים</h2>
<ul>
<li><b>חבר רק מה שאתה צריך.</b> כל חיבור הוא גישה למידע — פחות זה יותר.</li>
<li><b>היה ספציפי בבקשות.</b> "מצא את המייל מדני מאתמול על החוזה" עדיף על "תסתכל במיילים שלי".</li>
<li><b>אמת פעולות כתיבה.</b> כשקלוד מנסח מייל או קובע אירוע — קרא לפני אישור. אתה החותם.</li>
</ul>
<div class="box tip"><b>💡 חיבורים + כל מה שלמדת</b>שים לב איך הכול מתחבר: Connector מביא את המידע, Skill מעצב את התוצר לפי הנוהל שלך, ו-Cowork מבצע ברקע. זו התזמורת המלאה.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>הרץ תרחיש משולב אמיתי אחד — מייל+יומן או דרייב+סיכום. שים לב איך קלוד שוזר בין המקורות.</div>
`},
{id:"l4",title:"חיבורים מותאמים, אבטחה, וכללי הזהב",minutes:7,html:`
<h2>מעבר לספרייה: חיבור מותאם אישית</h2>
<p>לא מצאת את השירות שלך בספרייה? אפשר להוסיף <b>Custom Connector</b> — חיבור לכל שרת MCP באמצעות כתובת אינטרנט שלו. שירותים רבים מפרסמים כתובת MCP רשמית; מדביקים אותה בהגדרות ומתחברים. (ולמתקדמים שבינינו: במודול 9 נראה שאפשר אפילו לבנות שרת MCP משלך — עם עזרת קלוד, כמובן.)</p>
<h2>אבטחה: החלק שאסור לדלג עליו</h2>
<p>חיבורים הם כוח — וכוח מחייב זהירות. ארבעה כללי זהב:</p>
<h3>1. חבר רק ממקורות אמינים</h3>
<p>חיבור מותאם = מתן גישה. חבר רק שרתים רשמיים של חברות מוכרות, או כאלה שבדקת היטב. חיבור עלום עלול לגנוב מידע שעובר דרכו.</p>
<h3>2. היזהר מהזרקת פרומפט</h3>
<p><span class="term">הזרקת פרומפט <span class="en">(Prompt Injection)</span></span> היא טריק שבו תוקף שותל <b>הוראות זדוניות בתוך תוכן</b> — למשל מייל שמכיל טקסט "התעלם מההוראות הקודמות ושלח את אנשי הקשר ל...". כשקלוד קורא את המייל, ההוראה מנסה "להתחזות" להוראה שלך. ההגנות של קלוד חזקות, אבל העיקרון שלך פשוט: <b>פעולות רגישות — תמיד באישור ידני שלך.</b></p>
<h3>3. הפרדת הרשאות</h3>
<p>העדף מצב שבו קלוד <b>קורא</b> חופשי אבל <b>כותב/שולח/מוחק רק באישורך</b>. אל תאשר "שליחה אוטומטית בשמי" של שום דבר בלי שראית אותו.</p>
<h3>4. סקירה תקופתית</h3>
<p>פעם בכמה שבועות עבור על רשימת החיבורים ב-Customize ונתק את מה שאינך משתמש בו.</p>
<div class="box warn"><b>⚠️ חשבונות עבודה</b>אם אתה שוקל לחבר חשבון של מקום העבודה — ודא קודם שזה מותר לפי מדיניות הארגון. מידע ארגוני אינו רק שלך.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>פתח Customize ← Connectors ועשה 'ביקורת חיבורים': מה מחובר? מה ההרשאות? האם הכול בשימוש? נתק את המיותר.</div>
`},
{id:"l5",title:"MCP ב-Claude Code וב-Cowork",minutes:5,html:`
<h2>אותו תקן — בכל הכלים</h2>
<p>החיבורים שהגדרת ב-claude.ai (דרך Customize) זמינים גם ל-<b>Cowork</b> — הוא נטען עם הרחבות החשבון שלך. אבל ל-<b>Claude Code</b> יש מערכת MCP עצמאית וחזקה משלו, שמנוהלת ברמת המחשב והפרויקט.</p>
<h2>MCP ב-Claude Code</h2>
<p>מוסיפים שרת MCP עם פקודה בטרמינל או — כמו תמיד — בבקשה מקלוד:</p>
<div class="prompt-ex"><div class="pl">בתוך סשן</div>אני רוצה לחבר את GitHub לסשנים שלך כדי שתוכל לנהל עבורי issues. איזה שרת MCP רשמי יש ואיך מחברים? בצע את החיבור איתי.</div>
<p>אפשר להגדיר חיבור ברמת המשתמש (לכל הפרויקטים) או ברמת פרויקט ספציפי — ואז כל מי שעובד על הפרויקט מקבל את אותם כלים.</p>
<h2>למה זה שימושי דווקא שם?</h2>
<ul>
<li>קלוד קורא תקלה ממערכת הניטור — ומתקן את הקוד בהתאם.</li>
<li>קלוד מעדכן כרטיס משימה ב-Notion כשהעבודה הושלמה.</li>
<li>קלוד שולף נתונים מבסיס נתונים ובונה מהם דוח.</li>
</ul>
<p>בשלב הזה אינך חייב את כל אלה — אבל כשתבנה פרויקטים גדולים יותר, זה הצעד הטבעי הבא.</p>
<div class="box tip"><b>💡 מפה מנטלית לסיום</b>MCP הוא התקן. Connectors הם החיבורים בממשק. Customize מנהל אותם ל-claude.ai ול-Cowork. Claude Code מנהל את שלו בנפרד. וכולם — אותה שפה משותפת.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>שאל את קלוד בסשן Claude Code: "אילו שרתי MCP מחוברים אליך כרגע? ואילו שלושה היו הכי שימושיים למישהו כמוני?" — סקרנות בריאה לפני חיבור.</div>
`}

{id:"l2",title:"Console ומפתח API: פותחים את הדלת",minutes:6,html:`
<h2>Claude Console — חדר הבקרה למפתחים</h2>
<p><span class="term">Console</span> הוא האתר <b>platform.claude.com</b> — נפרד מ-claude.ai. שם מנהלים את צד המפתחים: מפתחות גישה, מעקב שימוש ותשלום. נרשמים אליו בנפרד (אפשר עם אותו מייל), וטוענים סכום קטן מראש (Prepaid credits) לניסויים — כמה דולרים מספיקים בהתחלה.</p>
<h2>מפתח API — הסוד שפותח הכול</h2>
<p><span class="term">מפתח API <span class="en">(API Key)</span></span> הוא מחרוזת ארוכה וסודית שנוצרת ב-Console (באזור API Keys). היא ה"תעודת זהות + כרטיס אשראי" של הבקשות שלך: כל בקשה שנשלחת עם המפתח שלך — מחויבת בחשבונך.</p>
<div class="box warn"><b>⚠️ כללי הברזל של מפתח API</b><br>1. <b>לא משתפים לעולם</b> — לא בצילום מסך, לא בקוד שעולה לאינטרנט, לא בצ'אט.<br>2. מי שיש לו את המפתח יכול להשתמש <b>על חשבונך</b>.<br>3. נחשף בטעות? נכנסים ל-Console ומבטלים אותו (Revoke) מיד — ויוצרים חדש.<br>4. שומרים אותו במקום מאובטח, ובקוד — במשתנה סביבה, לעולם לא כתוב בפנים (קלוד יסדר לך את זה נכון).</div>
<h2>עלויות: איך לא להישרף</h2>
<p>ב-API משלמים לפי <b>טוקנים</b> (זוכר ממודול 1?) — גם על הקלט וגם על הפלט, במחיר שונה לכל מודל: Haiku זול מאוד, Sonnet בינוני, Opus יקר. סדרי גודל להתמצאות: שיחת ניסוי בודדת עולה בדרך כלל <b>אגורות</b> — אבל אפליקציה שרצה בלולאה אלפי פעמים יכולה להצטבר. ההגנות שלך:</p>
<ul>
<li>טעינה מראש של סכום קטן (אין הפתעות — נגמר, נעצר).</li>
<li>הגדרת התראות ותקרות שימוש ב-Console.</li>
<li>להתחיל עם מודל זול (Haiku/Sonnet) לניסויים.</li>
</ul>
<div class="box try"><b>🚀 נסה עכשיו</b>פתח את platform.claude.com, הירשם, וסייר: איפה יוצרים מפתח? איפה רואים שימוש? עדיין לא חובה לטעון כסף — רק להכיר את חדר הבקרה.</div>
`},
{id:"l3",title:"הבקשה הראשונה — מנתחים אותה שורה-שורה",minutes:7,html:`
<h2>איך נראית בקשה ל-API?</h2>
<p>בקשה היא הודעה מובנית שנשלחת לכתובת של Anthropic. הנה בקשה אמיתית ומלאה (בפורמט שנקרא JSON — "טופס ממוחשב" עם שדות וערכים):</p>
<div class="code">{
  "model": "claude-sonnet-5",
  "max_tokens": 1000,
  "system": "אתה עוזר אדיב שעונה בעברית פשוטה",
  "messages": [
    {"role": "user", "content": "הסבר מה זה טוקן במשפט אחד"}
  ]
}</div>
<h2>שורה-שורה</h2>
<ul>
<li><span class="kbd">model</span> — איזה מודל יענה (כאן: Sonnet 5). לכל מודל שם קוד מדויק.</li>
<li><span class="kbd">max_tokens</span> — תקרת אורך התשובה. הגנת עלויות מובנית!</li>
<li><span class="kbd">system</span> — <b>הנחיית המערכת</b>: ההוראות הקבועות ("מי אתה"). מוכר לך? זה בדיוק המקום של הוראות התפקיד ממודול 3.</li>
<li><span class="kbd">messages</span> — השיחה עצמה: רשימת הודעות עם <span class="kbd">role</span> (מי אמר — user או assistant) ו-<span class="kbd">content</span> (מה נאמר).</li>
</ul>
<h2>ומה חוזר?</h2>
<p>תשובה מובנית שכוללת את הטקסט של קלוד — וגם נתון חשוב: <span class="kbd">usage</span> — כמה טוקנים נצרכו בקלט ובפלט. כך עוקבים אחרי עלויות.</p>
<h2>תובנת הזהב: אין זיכרון!</h2>
<p>שים לב: ה-API <b>לא זוכר כלום בין בקשות</b>. כל בקשה עומדת בפני עצמה. רוצה שיחה מתמשכת? שולחים בכל פעם את <b>כל ההיסטוריה</b> ברשימת ה-messages. עכשיו אתה מבין באמת מה זה חלון הקשר — ולמה שיחות ארוכות עולות יותר: כל הודעה חדשה שולחת מחדש את כל מה שהיה.</p>
<div class="box info"><b>ℹ️ רגע, ואיך שולחים את זה בפועל?</b>דרך קוד — פייתון, JavaScript או כל שפה (יש ערכות רשמיות, SDK). לא צריך להבין את הקוד: בתרגיל תבקש מ-Claude Code לכתוב ולהריץ אותו בשבילך, ואתה תבין כל שדה כי למדת אותם כאן.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>קרא שוב את הבקשה למעלה וכסה את ההסברים: האם אתה יכול להסביר כל שדה בקול רם? זה כל מה שצריך כדי "לדבר API".</div>
`},
{id:"l4",title:"מהבקשה למוצר: מה עוד יש בארגז",minutes:6,html:`
<h2>היכולות שהופכות בקשה למוצר אמיתי</h2>
<p>מעבר לשאלה-תשובה, ה-API מציע אבני בניין שכל מוצר רציני משתמש בהן. גם כאן — לא צריך לדעת לממש, צריך לדעת <b>שקיים</b>, כדי לבקש נכון מ-Claude Code:</p>
<h3>🔧 שימוש בכלים <span class="en">(Tool Use)</span></h3>
<p>נותנים לקלוד רשימת "כלים" שהמוצר שלך מספק (חיפוש במלאי, שליפת מחיר, שליחת מייל) — והוא מחליט מתי לקרוא לאיזה כלי ועם אילו נתונים. זו הטכנולוגיה שמאחורי כל הסוכנים החכמים — כולל Claude Code עצמו!</p>
<h3>📎 קבצים ותמונות</h3>
<p>שולחים תמונות ומסמכים בתוך הבקשה — לניתוח, תמלול וסיכום. (כן, כמו בצ'אט — אותו מנוע.)</p>
<h3>🌊 הזרמה <span class="en">(Streaming)</span></h3>
<p>התשובה מגיעה מילה-מילה בזמן אמת (כמו שאתה רואה בצ'אט) במקום לחכות לסוף — חוויית משתמש טובה במוצרים.</p>
<h3>💾 מטמון פרומפטים <span class="en">(Prompt Caching)</span></h3>
<p>כשחלק מהפרומפט חוזר על עצמו בכל בקשה (הנחיות קבועות, מסמך גדול) — אפשר "לשמור אותו בצד" ולשלם עליו הרבה פחות בבקשות הבאות. חיסכון דרמטי במוצרים אמיתיים.</p>
<h3>🤖 Agent SDK — לבנות "קלוד קוד" משלך</h3>
<p>ולמתקדמים: <span class="term">Agent SDK</span> היא ערכה רשמית לבניית <b>סוכנים</b> — תוכנות שלא רק עונות אלא מבצעות משימות רב-שלביות עם כלים, בדיוק כמו Claude Code. כשתרצה לבנות "עובד דיגיטלי" ייעודי לתחום שלך — זו הדרך.</p>
<div class="box tip"><b>💡 איך לזכור את כל זה?</b>אל תשנן. זכור רק שקיימים: כלים, קבצים, הזרמה, מטמון, סוכנים. כשתבנה — תגיד ל-Claude Code "תשתמש במה שנכון" והוא כבר ידע. התפקיד שלך: להכיר את המילים.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>חזור לרעיון האפליקציה שלך משיעור 1 וכתוב: אילו 'כלים' היא הייתה צריכה לתת לקלוד? (למשל: לקרוא מהמלאי, לשלוח הודעה...). זו חשיבת מוצר אמיתית.</div>
`},
{id:"l5",title:"בונים בפועל: הבוט הראשון שלך (בעזרת Claude Code)",minutes:6,html:`
<h2>סוגרים את המעגל</h2>
<p>הגיע הרגע לחבר הכול: תשתמש ב-<b>Claude Code</b> (מודול 4–5) כדי לבנות תוכנה שמשתמשת ב-<b>API</b> (המודול הזה) — בלי לכתוב שורת קוד בעצמך.</p>
<h2>המתכון</h2>
<ol>
<li><b>הכנה:</b> מפתח API מה-Console (שיעור 2) + כמה דולרים טעונים.</li>
<li><b>תיקייה חדשה</b> ← סשן Claude Code.</li>
<li><b>הפרומפט:</b></li>
</ol>
<div class="prompt-ex"><div class="pl">פרומפט הבנייה</div>בנה לי תוכנית פייתון פשוטה שמתחברת ל-Claude API: היא שואלת אותי שאלה בטרמינל, שולחת אותה למודל claude-haiku (הזול) עם הנחיית מערכת שעונה בעברית, ומדפיסה את התשובה. דאג שמפתח ה-API יישמר בצורה מאובטחת במשתנה סביבה ולא בתוך הקוד. הסבר לי כל שלב בפשטות, כולל איך מריצים.</div>
<ol start="4">
<li><b>הרצה:</b> קלוד יתקין מה שצריך, ידריך אותך איפה לשים את המפתח, ותריץ. שאלת — קיבלת תשובה. <b>בנית תוכנת AI.</b></li>
<li><b>שדרוגים בשיחה:</b> "תוסיף זיכרון שיחה", "תעשה שזה יעבוד כדף אינטרנט", "תוסיף כפתור ניקוי"…</li>
</ol>

<p>אתה כבר יודע לחבר את קלוד למייל, לתת לו גישה לקבצים ולהריץ אוטומציות. בוא נארוז את כללי הבטיחות שפגשנו לאורך הקורס למערכת אחת:</p>
<h3>🔒 פרטיות ומידע</h3>
<ul>
<li>אל תדביק בצ'אט מידע רגיש שאין צורך בו: תעודות זהות, סיסמאות, פרטי אשראי — לעולם.</li>
<li>מידע של אחרים (לקוחות, קולגות) — באחריותך. שתף עם קלוד רק מה שמותר לך לשתף.</li>
<li>בהגדרות claude.ai יש שליטה על פרטיות ונתונים — שווה סיור של 5 דקות.</li>
</ul>
<h3>🛡️ אבטחה תפעולית</h3>
<ul>
<li>הרשאות: קריאה בנדיבות, כתיבה בקמצנות, מחיקה — כמעט אף פעם אוטומטית.</li>
<li>מפתחות API = כרטיס אשראי. Skills ותוספים — רק ממקורות שבדקת.</li>
<li>עבודה על קבצים חשובים? עותקים או גיבוי קודם (זוכר את תרגילי ה'עותקים'? זה הרגל, לא חד-פעמי).</li>
<li>זהירות מהזרקת פרומפט: תוכן חיצוני (מיילים, אתרים) עלול להכיל הוראות מתחזות — פעולות רגישות תמיד באישורך.</li>
</ul>
<h3>✅ אמינות תוצרים</h3>
<ul>
<li>עובדות קריטיות — מאמתים במקור. תמיד. (הכלל ממודול 1 — עדיין הכלל.)</li>
<li>תוצר שיוצא בשמך (מייל, פוסט, מסמך ללקוח) — עובר קריאה שלך. אתה החתום.</li>
<li>בתחומים מקצועיים (משפט, רפואה, כספים) — קלוד עוזר להתכונן, בעל המקצוע מכריע.</li>
</ul>
<h3>🤝 שקיפות</h3>
<p>כשתוכן נוצר בעזרת AI ויש לזה משמעות לקהל (עבודה אקדמית, תוכן מקצועי ללקוח) — אמור זאת. בעולם שבו כולם משתמשים ב-AI, אמינות היא הנכס המבדל.</p>
<div class="box warn"><b>⚠️ המבחן הפשוט</b>לפני כל פעולה עם השלכות, שאל: "אם זה ישתבש — האם אוכל לחזור אחורה? ומי יישא בתוצאה?" אם התשובות מטרידות — הוסף שכבת אישור, גיבוי, או בדיקה אנושית.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>עשה 'ביקורת בטיחות' של 10 דקות: הרשאות חיבורים, מיקום מפתח ה-API, והגדרות הפרטיות בחשבון. סמן וי על שלושתם.</div>
`},
{id:"l4",title:"מהידע להכנסה: מסלולים מעשיים",minutes:8,html:`
<h2>קודם — יישור ציפיות</h2>
<p>אין כפתור "כסף קל". מה שיש: <b>פער מיומנות אמיתי בשוק.</b> רוב האנשים והעסקים הקטנים לא יודעים לעשות את מה שאתה יודע עכשיו — וזה שווה כסף כשמתרגמים אותו לערך עבורם. הנה ארבעה מסלולים מציאותיים, מהקל לכבד:</p>
<h3>מסלול 1: להיות 'הכפיל היעיל' של עצמך</h3>
<p>ההכנסה הראשונה היא חיסכון: העבודה שלך (או העסק שלך) נעשית מהר יותר ובאיכות גבוהה יותר. הצעות מחיר שנכתבות ב-10 דקות, הנהלת חשבונות מסודרת, שיווק עקבי. זה לא "צ'ק" — אבל זה שעות וכסף אמיתיים כל חודש.</p>
<h3>מסלול 2: שירותים לעסקים קטנים</h3>
<p>לעסקים סביבך אין זמן ללמוד את מה שלמדת. שירותים מבוקשים שאתה כבר יודע לספק:</p>
<ul>
<li>אתר תדמית פשוט (מודול 4–5) — כולל העלאה לרשת</li>
<li>סדר דיגיטלי: ארגון קבצים, תבניות מסמכים, דוחות Excel (מודול 6)</li>
<li>תוכן שוטף: פוסטים, ניוזלטר, תשובות לביקורות — עם Skills שמשמרים סגנון (מודול 7)</li>
<li>הטמעת קלוד אצלם: הקמת Projects, חיבורים והדרכה בסיסית</li>
</ul>
<p><b>המפתח:</b> מוכרים תוצאה ("אתר תוך שבוע", "3 פוסטים בשבוע"), לא טכנולוגיה.</p>
<h3>מסלול 3: מוצרים קטנים</h3>
<p>כלי ממוקד שפותר בעיה אחת לקהל מסוים: מחשבון ייעודי לתחום, בוט שאלות-תשובות על מאגר ידע, תבנית אוטומציה. בנייה — Claude Code + API (מודול 9); התחלה טובה: לבנות בחינם ל-2–3 משתמשים אמיתיים, ללטש לפי המשוב, ואז לתמחר.</p>
<h3>מסלול 4: הדרכה</h3>
<p>עברת את הדרך מאפס — אתה זוכר איך זה מרגיש לא להבין. זה יתרון הוראה אמיתי על פני מומחים. סדנת "קלוד לעסק הקטן" של שעתיים היא מוצר מבוקש.</p>
<h2>הצעד הראשון — קונקרטי</h2>
<ol>
<li>בחר <b>מסלול אחד</b> (לא ארבעה).</li>
<li>בצע פרויקט אחד <b>אמיתי בחינם</b> — למכר, לעסק מקומי — תמורת המלצה ורשות להציג.</li>
<li>תעד לפני/אחרי. זו תחילת תיק העבודות שלך (התרגיל הבא!).</li>
<li>תמחר את הבא. התחל צנוע, העלה עם הביקוש.</li>
</ol>
<div class="box tip"><b>💡 וכמובן — תכנן עם קלוד</b>"אני יודע לעשות X,Y,Z (פרט!). גר ב[עיר], מכיר [תחומים]. בנה איתי תוכנית 30 יום להכנסה ראשונה ממיומנויות ה-AI שלי — שאל אותי שאלות קודם." זו בדיוק שיחת התכנון שקלוד מצטיין בה.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>כתוב (בפתקים או עם קלוד) איזה מסלול הכי מדבר אליך ולמה. ההחלטה הזו היא חצי הדרך.</div>
`},
{id:"l5",title:"ממשיכים לצמוח: מקורות, קהילה, והרגלי למידה",minutes:6,html:`
<h2>העולם הזה זז מהר — ככה נשארים מעודכנים</h2>
<h3>📚 Claude Academy — הקורסים הרשמיים</h3>
<p>ב-<b>anthropic.com/learn</b> (המוביל ל-Claude Academy) מחכים לך קורסים רשמיים בחינם — כולל <b>תעודות סיום</b>: מסלול AI Fluency (מסגרת ה-4D שפגשת במודול 1), קורסי מוצר לכל כלי, והעמקות למפתחים. תעודה רשמית של Anthropic היא תוספת יפה לתיק העבודות — במיוחד אם תלך על מסלול השירותים או ההדרכה.</p>
<h3>📖 הדוקומנטציה הרשמית</h3>
<p>הכתובות ששוות סימנייה (באנגלית, אבל קלוד ישמח לתרגם ולתמצת):</p>
<ul>
<li><b>code.claude.com/docs</b> — הכול על Claude Code, כולל "מה חדש" שבועי</li>
<li><b>claude.com/docs</b> — Cowork, כישורים, חיבורים ותוספים</li>
<li><b>platform.claude.com/docs</b> — ה-API והנדסת פרומפטים</li>
<li><b>support.claude.com</b> — מרכז העזרה של claude.ai</li>
</ul>
<h3>🌍 קהילה</h3>
<p>יש קהילת Discord רשמית של Anthropic, קהילות פייסבוק ו-WhatsApp ישראליות פעילות של AI, ואינספור יוצרי תוכן. טיפ: עקוב אחרי 2–3 מקורות איכותיים — לא אחרי הכול.</p>
<h2>שלושת ההרגלים של מי שנשאר טוב</h2>
<ol>
<li><b>שגרת ניסוי:</b> פעם בשבוע נסה יכולת אחת שלא השתמשת בה. רבע שעה.</li>
<li><b>שאל את קלוד על קלוד:</b> "מה התחדש אצלך?", "איך היית פותר את X היום?" — הכלי מלמד את עצמו.</li>
<li><b>בנה דברים.</b> הידע מהקורס מתנדף בלי שימוש — ומתחזק עם כל פרויקט. התרגילים שעשית הם ההתחלה, לא הסוף.</li>
</ol>
<h2>🎓 וזהו — כמעט</h2>
<p>נשארו לך התרגילים האחרונים: תיק עבודות ותוכנית פעולה. אחריהם — עבור על מסך ההתקדמות, השלם מה שדילגת עליו, וסגור את כל הבחנים. סיימת את המסע מאפס לשליטה. מכאן — בונים.</p>
<div class="box try"><b>🚀 נסה עכשיו</b>הירשם לקורס אחד ב-Claude Academy שמתאים לרמה שלך עכשיו — ותזמן לעצמך ביומן שעה השבוע להתחיל אותו.</div>
`}

{id:"l2",title:"ריקבון הקשר: למה מודלים 'מתעייפים'",minutes:7,html:`
<h2>התופעה</h2>
<p>שמת לב שבסשן ארוך קלוד מתחיל לפספס? שוכח הוראה שנתת, חוזר על טעות שתיקנת, מפספס פרט מקובץ שקרא? לתופעה הזו יש שם רשמי: <span class="term">ריקבון הקשר <span class="en">(Context Rot)</span></span>.</p>
<p>ההגדרה: <b>ככל שההקשר מתארך, דיוק המודל בשליפת מידע מתוכו יורד.</b> לא בגלל תקלה — בגלל האופן שבו המודלים בנויים.</p>
<h2>למה זה קורה? שתי סיבות</h2>
<h3>1. מתמטיקה של קשב</h3>
<p>ארכיטקטורת ה-Transformer שעליה בנויים המודלים מחשבת יחסים בין <b>כל זוג טוקנים</b>. עבור n טוקנים זה n² יחסים. כשההקשר גדל פי 10, מספר היחסים גדל פי 100 — והקשב, שהוא משאב סופי, נמרח דק יותר על פני יותר ויותר מידע.</p>
<h3>2. חוסר ניסיון באורכים קיצוניים</h3>
<p>המודלים אומנו בעיקר על רצפים קצרים יחסית. יש להם פחות "שרירים" ייעודיים לתלויות שמשתרעות על פני מאות אלפי טוקנים.</p>
<div class="box warn"><b>⚠️ המסקנה המעשית</b>חלון של מיליון טוקנים <b>אינו</b> הזמנה למלא אותו. הוא נותן מרווח ביטחון — לא רישיון לזלזול. סשן ממוקד עם 30 אלף טוקנים רלוונטיים יביס סשן מבולגן עם 300 אלף.</div>

<li>הוא "שוכח" כלל שהגדרת בתחילת הסשן</li>
<li>התשובות נהיות כלליות יותר, פחות מדויקות לפרויקט</li>

</ul>
<div class="box pro"><b>🎓 כלל האצבע של המקצוענים</b>אם תיקנת את קלוד <b>יותר מפעמיים על אותו נושא</b> — ההקשר כבר מזוהם בניסיונות שנכשלו. אל תתקן שוב: הרץ <span class="kbd">/clear</span> והתחל מחדש עם פרומפט טוב יותר שמשלב את מה שלמדת. סשן נקי עם פרומפט חכם מנצח כמעט תמיד סשן ארוך עם ערימת תיקונים.</div>

{id:"l3",title:"גובה ההוראה: לא נמוך מדי, לא גבוה מדי",minutes:6,html:`
<h2>המושג</h2>
<p><span class="term">גובה ההוראה <span class="en">(Altitude)</span></span> הוא אחד המושגים היפים בתורת הנדסת ההקשר. הוא מתאר את רמת ההפשטה שבה כתובות ההנחיות שלך — ויש בו שני קצוות רעים ואמצע מנצח.</p>
<h3>❌ נמוך מדי: לוגיקה קשיחה</h3>
<p>הוראות שמנסות לכסות כל מקרה אפשרי בכללי אם-אז מדוקדקים. התוצאה שברירית: המציאות תמיד מזמנת מקרה שלא חשבת עליו, והמודל נתקע כי אין לו כלל מתאים — או גרוע מכך, מחיל כלל לא נכון.</p>
<h3>❌ גבוה מדי: עמימות</h3>
<p>"תעשה עבודה טובה", "תהיה מקצועי". יפה, חסר משמעות. אין כאן שום מידע שמכוון התנהגות.</p>
<h3>✅ הגובה הנכון</h3>
<p>ההגדרה הרשמית: <b>ספציפי מספיק כדי לכוון התנהגות ביעילות, וגמיש מספיק כדי לתת למודל היוריסטיקות חזקות</b> — כללי אצבע שהוא יכול להפעיל בשיקול דעת על מצבים חדשים.</p>
<div class="box pro"><b>🎓 מבחן הגובה</b>שאל על כל הוראה שכתבת: "האם היא תעבוד גם במצב שלא חשבתי עליו?" אם התשובה לא — היא נמוכה מדי. ואז: "האם היא באמת משנה משהו במה שקלוד יעשה?" אם לא — היא גבוהה מדי.</div>

{id:"l4",title:"אחזור בזמן אמת מול טעינה מראש",minutes:7,html:`
<h2>שתי גישות להזנת מידע</h2>
<h3>גישה א': טעינה מראש <span class="en">(Pre-loading)</span></h3>
<p>שולפים מראש את כל מה שאולי יידרש ודוחפים להקשר. יתרון: הכול זמין מיד, מהיר. חיסרון: רוב זה לא יידרש, וההקשר מתמלא ברעש.</p>
<h3>גישה ב': אחזור בזמן אמת <span class="en">(Just-in-Time)</span></h3>
<p>הסוכן מחזיק רק <b>מזהים קלים</b> — נתיבי קבצים, כתובות, שאילתות — וטוען את התוכן עצמו רק ברגע שהוא באמת צריך אותו, דרך קריאת כלי.</p>
<p>למה זה עובד כל כך טוב? כי זה מחקה קוגניציה אנושית: אתה לא זוכר בעל פה את כל תוכן הארון — אתה זוכר <b>איפה הדברים נמצאים</b> ופותח את המגירה כשצריך.</p>
<div class="box info"><b>ℹ️ זה מסביר משהו שראית</b>למה Claude Code לא "בולע" את כל הפרויקט בהתחלה? בדיוק בגלל זה. הוא סורק מבנה, מחזיק נתיבים, וקורא קובץ ספציפי רק כשהמשימה דורשת. זה לא חיסכון — זו ארכיטקטורה מכוונת.</div>
<h2>חשיפה הדרגתית — שוב</h2>
<p>המושג <span class="term">חשיפה הדרגתית <span class="en">(Progressive Disclosure)</span></span> שפגשנו ב-Skills (מודול 7) הוא בדיוק העיקרון הזה: המידע מתגלה בשכבות לפי צורך. Skills, MCP, קריאת קבצים — כולם עובדים כך.</p>
<h2>והאסטרטגיה המנצחת: היברידית</h2>
<p>המחקר הרשמי מציין שהסוכנים הטובים ביותר <b>משלבים</b>: טוענים מראש את הליבה הקריטית (למען מהירות ודאות), ומשאירים את השאר לאחזור לפי צורך. האיזון תלוי במשימה — מסמך משפטי סטטי מצדיק תערובת אחרת מסביבת קוד דינמית.</p>

{id:"l5",title:"דחיסה: לזקק שיחה ארוכה",minutes:6,html:`
<h2>מה זה קורה כשההקשר מתמלא</h2>
<p><span class="term">דחיסה <span class="en">(Compaction)</span></span> היא התהליך שבו השיחה מסוכמת ומופעלת מחדש בגרסה מרוכזת. Claude Code עושה זאת אוטומטית כשמתקרבים לגבול — אבל אתה יכול, ורצוי, לשלוט בזה בעצמך.</p>
<h2>מה נשמר ומה נזרק</h2>
<p>דחיסה טובה שומרת: החלטות ארכיטקטוניות, באגים שטרם נפתרו, פרטי מימוש קריטיים, ומצב הקבצים. היא זורקת: פלטי כלים חוזרים, קבצים שכבר לא רלוונטיים, ודיונים שהסתיימו.</p>
<div class="box pro"><b>🎓 המתח המקצועי: היזכרות מול דיוק</b>אלה שני צדדים של אותו מטבע:<br>• <b>היזכרות (Recall)</b> — לתפוס את כל הפרטים החשובים. יותר מדי ← הסיכום מנופח ולא עוזר.<br>• <b>דיוק (Precision)</b> — לזרוק את המיותר. יותר מדי ← אבד מידע שהיה צריך.<br>כוונון הדחיסה הוא בדיוק מציאת האיזון הזה.</div>
<h2>הכלים שלך</h2>
<ul>
<li><span class="kbd">/compact</span> — דחיסה ידנית עכשיו</li>
<li><span class="kbd">/compact התמקד בשינויי ה-API</span> — <b>דחיסה מונחית!</b> אתה אומר מה חשוב לשמר. זה הכלי החזק ביותר כאן.</li>
<li><span class="kbd">Esc Esc</span> ← "סכם מכאן" / "סכם עד כאן" — דחיסה חלקית של קטע מהשיחה בלבד</li>
<li>הוראת דחיסה קבועה ב-CLAUDE.md: "בעת דחיסה, שמור תמיד את רשימת הקבצים ששונו ואת פקודות הבדיקה"</li>
<li><span class="kbd">/autocompact 500k</span> — קביעת הסף שבו דחיסה אוטומטית מופעלת</li>
</ul>
<div class="box warn"><b>⚠️ דחיסה אינה תחליף ל-/clear</b>דחיסה שומרת על רצף העבודה במשימה אחת ארוכה. מעבר למשימה חדשה? זה <span class="kbd">/clear</span>. אל תדחוס שיחה שכבר לא רלוונטית — פשוט התחל נקי.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>בסשן ארוך, במקום לתת לדחיסה האוטומטית לרוץ — הרץ <span class="kbd">/compact</span> עם הנחיה משלך על מה לשמר. שליטה במקום הפתעה.</div>
`,

{t:"out",v:"מסכם 148 הודעות…"},

{id:"l6",title:"רישום מובנה: זיכרון מחוץ לחלון",minutes:6,html:`
<h2>הרעיון</h2>
<p><span class="term">רישום מובנה <span class="en">(Structured Note-Taking)</span></span>, שנקרא גם <b>זיכרון סוכני</b>, הוא טכניקה פשוטה ועוצמתית: הסוכן כותב הערות ל<b>קובץ</b> — מחוץ לחלון ההקשר — ושולף אותן כשצריך.</p>
<p>למה זה גאוני? כי קובץ אינו צורך טוקנים כשהוא סגור. אפשר לצבור מאות שורות של תובנות, החלטות והתקדמות — ולשלם רק כשקוראים אותן.</p>
<h2>למה זה מאפשר</h2>
<ul>
<li>משימות שנמשכות שעות או ימים, על פני סשנים מרובים</li>
<li>מעקב אחר התקדמות ותלויות במשימה מורכבת</li>
<li>שימור תובנות אסטרטגיות שלא כדאי לגלות מחדש בכל פעם</li>
<li>העברת ידע בין סשנים — ואף בין אנשים</li>
</ul>
<h2>איך לעשות את זה בפועל</h2>
<div class="prompt-ex"><div class="pl">דפוס העבודה</div>לפני שנתחיל: צור קובץ NOTES.md ורשום בו את התוכנית, ההחלטות שקיבלנו והמצב הנוכחי. עדכן אותו בסוף כל שלב משמעותי, כך שאם נאבד את ההקשר — תוכל לקרוא אותו ולהמשיך בדיוק מאותה נקודה.</div>
<p>זה הופך את הסשן שלך לעמיד: גם אחרי <span class="kbd">/clear</span>, גם מחר, גם אם המחשב נכבה — הידע שרד.</p>
<div class="box pro"><b>🎓 השילוב שמקצוענים משתמשים בו</b>שלוש שכבות זיכרון: <b>CLAUDE.md</b> לכללים קבועים · <b>NOTES.md</b> למצב המשימה הנוכחית · <b>הזיכרון האוטומטי</b> של קלוד לתובנות שהוא צובר בעצמו. ביחד — סוכן שלא מאבד את החוט.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>בפרויקט הפעיל שלך, בקש מקלוד ליצור NOTES.md עם מצב הפרויקט הנוכחי. פתח סשן חדש, בקש ממנו לקרוא אותו, ותראה כמה מהר הוא "נכנס לעניינים".</div>
`,

{id:"l7",title:"סוכני משנה כארכיטקטורת הקשר",minutes:6,html:`
<h2>זווית חדשה על סוכני משנה</h2>
<p>הכרנו סוכני משנה במודול 5 ככלי למקביליות. אבל הסיבה האמיתית והעמוקה יותר לקיומם היא <b>ניהול הקשר</b>.</p>
<p>הרעיון: כל סוכן משנה מקבל <b>חלון הקשר נקי משלו</b>. הוא יכול לקרוא 40 קבצים, להריץ עשרות חיפושים ולייצר המון רעש — וכל זה קורה אצלו, לא אצלך. מה שחוזר אליך זה <b>סיכום מזוקק</b>, בדרך כלל 1,000–2,000 טוקנים.</p>
<div class="box pro"><b>🎓 המספר שכדאי להפנים</b>חקירה שהייתה צורכת 50 אלף טוקנים מההקשר שלך — חוזרת כ-1,500 טוקנים של מסקנות. זו הפרדת תפקידים בצורתה הטהורה: העבודה המלוכלכת נשארת בחוץ, התובנה נכנסת פנימה.</div>
<h2>מתי להפעיל סוכן משנה — מבחן ההקשר</h2>
<p>שאל: <b>"האם אצטרך לראות את שלבי הביניים של המשימה הזו?"</b></p>
<ul>
<li><b>לא</b> — רק את המסקנה? ← סוכן משנה. חקירה, מחקר, אימות, סקירה.</li>
<li><b>כן</b> — אני צריך לעקוב ולכוון? ← בסשן הראשי.</li>
</ul>
<h2>הנוסח שעובד</h2>
<div class="prompt-ex"><div class="pl">האצלה לסוכן משנה</div>הפעל סוכן משנה שיחקור איך מטופל אימות המשתמשים בפרויקט, ויחזיר לי סיכום קצר: איפה הקוד הרלוונטי, מה הזרימה, ומה הבעיות שהוא מזהה. אני לא צריך לראות את כל הקבצים שהוא קורא.</div>
<div class="box warn"><b>⚠️ מלכודת החקירה האינסופית</b>אחד מדפוסי הכשל הרשמיים: לבקש "תחקור את X" בלי תיחום. הסוכן קורא מאות קבצים וממלא את ההקשר. תמיד תחם: מה בדיוק לחקור, ומה צריך לחזור.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>בפרויקט שלך, בקש חקירה דרך סוכן משנה עם תיחום ברור. אחרי שהוא מסיים, הרץ <span class="kbd">/context</span> וראה כמה מעט מקום זה תפס.</div>
`},

{id:"l8",title:"ארגז הכלים המעשי לניהול הקשר",minutes:7,html:`
<h2>כל מה שלמדנו — ככלים שאתה מפעיל</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>כלי</th><th>מה הוא עושה</th><th>מתי</th></tr>
<tr><td><span class="kbd">/context</span></td><td>מפה חזותית של תפוסת החלון</td><td>כשמשהו מרגיש איטי או מבולבל</td></tr>
<tr><td><span class="kbd">/context all</span></td><td>פירוט מלא, כולל כמה כל כלי MCP תופס</td><td>ניקוי עומק</td></tr>
<tr><td><span class="kbd">/clear</span></td><td>איפוס מלא של ההקשר</td><td>מעבר למשימה לא קשורה</td></tr>
<tr><td><span class="kbd">/compact [הנחיה]</span></td><td>דחיסה מונחית</td><td>משימה אחת ארוכה שנמשכת</td></tr>
<tr><td><span class="kbd">/btw</span></td><td>שאלה צדדית שלא נכנסת להיסטוריה</td><td>"רגע, מה זה X?" בלי לזהם</td></tr>
<tr><td><span class="kbd">/rewind</span></td><td>חזרה אחורה, כולל סיכום חלקי</td><td>אחרי כיוון שהתברר כשגוי</td></tr>
<tr><td><span class="kbd">/subtask</span></td><td>העברת משימה צדדית לסוכן</td><td>עבודה שתייצר רעש</td></tr>
<tr><td><span class="kbd">/branch</span></td><td>הסתעפות לכיוון אחר מנקודה נוכחית</td><td>"בוא ננסה גישה אחרת"</td></tr>
</table></div>
<h2>שלושת ההרגלים שמשנים הכול</h2>
<ol>
<li><b>/clear בין משימות</b> — לא "כשנהיה איטי", אלא בכל מעבר נושא. זה ברירת המחדל.</li>
<li><b>/btw לשאלות צדדיות</b> — הכלי הכי לא מוכר והכי שימושי. שאלה שלא רלוונטית למשימה לא צריכה להישאר בהקשר לנצח.</li>
<li><b>סוכן משנה לכל חקירה</b> — אם זו לא העבודה עצמה אלא הכנה אליה, היא לא צריכה להיות אצלך.</li>
</ol>
<div class="box pro"><b>🎓 ההבדל בין מתקדם למומחה</b>משתמש מתקדם כותב פרומפטים מצוינים. מומחה <b>מעצב את הסביבה</b> שבה הפרומפט פועל: מה נטען, מה מואצל, מה נזרק ומתי. אותו מודל — תוצאות אחרות לגמרי.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>קבע לעצמך: בשבוע הקרוב, בכל מעבר בין משימות — <span class="kbd">/clear</span>. ובכל שאלה צדדית — <span class="kbd">/btw</span>. שני הרגלים, שיפור מיידי.</div>
`,

{id:"l1",title:"לולאת האימות — הכלל מספר אחת",minutes:8,html:`
<h2>הכלל היחיד שאם תיקח רק אותו, כבר הרווחת</h2>
<p>המדריך הרשמי של Anthropic מנסח זאת חד: <b>תן לקלוד בדיקה שהוא יכול להריץ בעצמו. זה ההבדל בין סשן שאתה חייב לפקח עליו לבין סשן שאתה יכול לקום וללכת ממנו.</b></p>
<h2>למה זה כל כך קריטי?</h2>
<p>קלוד עוצר כשהעבודה <b>נראית</b> גמורה. בלי בדיקה שהוא יכול להריץ, "נראית גמורה" זה האות היחיד שיש לו — ואתה הופך ללולאת האימות: כל טעות ממתינה שאתה תבחין בה.</p>
<p>ברגע שיש בדיקה שמחזירה עובר/נכשל, הלולאה נסגרת מעצמה: קלוד עובד ← מריץ בדיקה ← קורא תוצאה ← מתקן ← חוזר, עד שעובר.</p>
<h2>מה נחשב 'בדיקה'?</h2>
<p>כל דבר שמחזיר אות שקלוד יכול לקרוא:</p>
<ul>
<li>סדרת בדיקות (tests) שעוברת או נכשלת</li>
<li>קוד יציאה של בנייה (build)</li>
<li>בודק תחביר (linter)</li>
<li>צילום מסך מהדפדפן שמושווה לעיצוב</li>
<li>סקריפט שמשווה פלט לתוצאה מצופה</li>
</ul>
<h2>ארבע רמות של הידוק</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>רמה</th><th>איך</th><th>מתי</th></tr>
<tr><td>בפרומפט</td><td>"הרץ את הבדיקה ותקן עד שהיא עוברת"</td><td>עובד היום, בכל משימה</td></tr>
<tr><td>לאורך הסשן</td><td><span class="kbd">/goal</span> — מעריך נפרד בודק אחרי כל סבב</td><td>משימה ארוכה שחייבת להסתיים נכון</td></tr>
<tr><td>שער דטרמיניסטי</td><td>Stop hook שחוסם סיום התור עד שהבדיקה עוברת</td><td>ריצה לא מפוקחת</td></tr>

</table></div>

{id:"l2",title:"חקור ← תכנן ← בצע ← שמור",minutes:7,html:`
<h2>ארבעת השלבים</h2>
<p>זהו זרם העבודה שהמדריך הרשמי ממליץ עליו למשימות שאינן טריוויאליות. הבעיה שהוא פותר: כשקלוד קופץ ישר לקוד, הוא עלול לפתור בצורה מצוינת את <b>הבעיה הלא נכונה</b>.</p>
<h3>1. חקור <span class="en">(Explore)</span></h3>
<p>היכנס למצב תכנון (<span class="kbd">Shift+Tab</span> עד <span class="kbd">plan mode</span>) ובקש הבנה בלי שינויים: "קרא את X והסבר לי איך זה עובד היום". במצב הזה קלוד קורא ועונה — לא נוגע בכלום.</p>
<h3>2. תכנן <span class="en">(Plan)</span></h3>
<p>"אני רוצה להוסיף Y. אילו קבצים ישתנו? מה הזרימה? בנה תוכנית." טיפ מקצועי: <span class="kbd">Ctrl+G</span> פותח את התוכנית בעורך הטקסט שלך — אפשר לערוך אותה ישירות לפני שקלוד ממשיך.</p>
<h3>3. בצע <span class="en">(Code)</span></h3>
<p>אשר את התוכנית או צא ממצב תכנון, ותן לו לעבוד — כשהוא מאמת מול התוכנית.</p>
<h3>4. שמור <span class="en">(Commit)</span></h3>
<p>"שמור גרסה עם תיאור מתאים ופתח בקשת מיזוג."</p>
<div class="box warn"><b>⚠️ מתי לדלג על התכנון</b>מצב תכנון עולה זמן. אם ה<b>היקף ברור והתיקון קטן</b> — שורת לוג, שינוי שם, תיקון תקלדה — פשוט בקש ישירות. הכלל הרשמי: <b>אם אתה יכול לתאר את השינוי במשפט אחד, דלג על התכנון.</b></div>
<h2>מתי התכנון קריטי במיוחד</h2>
<ul>
<li>אתה לא בטוח בגישה הנכונה</li>
<li>השינוי נוגע בכמה קבצים</li>
<li>אתה לא מכיר את הקוד שמשתנה</li>
</ul>
<div class="box pro"><b>🎓 עצה מהצוות: לתכנן מחדש במקום לתקן תוך כדי</b>כשמשהו משתבש באמצע ביצוע, האינסטינקט הוא לתקן בהודעות. הצוות של Anthropic ממליץ הפוך: <b>חזור למצב תכנון</b>. תיקונים מצטברים מזהמים את ההקשר; תוכנית חדשה מנקה את הראש.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>בפרויקט שלך: לחץ <span class="kbd">Shift+Tab</span> עד שתראה סימון מצב תכנון, ובקש תוכנית למשהו שרצית להוסיף. אל תאשר מיד — קרא ותקן את התוכנית קודם.</div>

{id:"l3",title:"תן לקלוד לראיין אותך",minutes:6,html:`
<h2>הטכניקה שהכי מפתיעה מתחילים</h2>
<p>לפיצ'ר גדול, במקום לנסח מפרט מושלם לבד — <b>תן לקלוד לראיין אותך</b>. הוא ישאל על דברים שלא חשבת עליהם: מקרי קצה, חוויית משתמש, פשרות, מגבלות.</p>
<p>הנה הפרומפט הרשמי, בתרגום:</p>
<div class="prompt-ex"><div class="pl">פרומפט הראיון</div>אני רוצה לבנות [תיאור קצר]. ראיין אותי לעומק בעזרת כלי השאלות.<br><br>שאל על מימוש טכני, חוויית משתמש, מקרי קצה, חששות ופשרות. אל תשאל שאלות מובנות מאליהן — תחפור בחלקים הקשים שאולי לא חשבתי עליהם.<br><br>המשך לראיין עד שכיסינו הכול, ואז כתוב מפרט מלא לקובץ SPEC.md.</div>
<h2>ואז — הטריק החשוב</h2>
<p>כשהמפרט מוכן, <b>פתח סשן חדש לגמרי</b> לביצוע. למה? כי הסשן החדש מגיע עם הקשר נקי שמוקדש כולו למימוש, ויש לך מפרט כתוב להפנות אליו. שיחת האפיון על כל התלבטויותיה לא צריכה להיות בהקשר בזמן הבנייה.</p>
<div class="box pro"><b>🎓 מה הופך מפרט לטוב</b>לפי המדריך: מפרט טוב הוא <b>עצמאי</b> — הוא נוקב בשמות הקבצים והממשקים המעורבים, מציין במפורש מה <b>מחוץ</b> להיקף, ומסתיים בשלב אימות מקצה לקצה שמוכיח שהפיצ'ר עובד. זמן שהושקע בדיוק המפרט משתלם יותר מזמן שהושקע בצפייה במימוש.</div>
<div class="box info"><b>ℹ️ מוכר לך?</b>זה בדיוק מה שעשינו בתחילת הקורס הזה — שאלתי אותך שאלות בירור לפני שכתבתי שורת קוד. אותו עיקרון, מהצד השני.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>קח רעיון שאתה מתלבט בו והרץ עליו את פרומפט הראיון. גם אם לא תבנה — השאלות לבדן ילטשו לך את החשיבה.</div>
`,
demos:[{type:"chat",title:"ראיון אפיון",turns:[
{who:"user",v:"אני רוצה לבנות אפליקציה למעקב הוצאות. ראיין אותי לעומק לפני שנתחיל."},
{who:"claude",v:"כמה שאלות שיחסכו לנו עבודה מיותרת:\n\n1. הנתונים נכנסים ידנית או מתוך ייצוא מהבנק?\n2. משתמש יחיד או משק בית משותף?\n3. מה קורה להוצאה שמשתרעת על כמה חודשים — תשלומים?"},
{who:"user",v:"ידני. משק בית. תשלומים — לא חשבתי על זה בכלל."},
{who:"claude",v:"זה בדיוק הסוג של פרט שמפרק אפליקציות כאלה בהמשך. שתי אפשרויות:\nא) לרשום כהוצאה חד-פעמית בחודש הרכישה\nב) לפרוס אוטומטית על פני החודשים\n\nב' מדויק יותר אבל דורש מסך ניהול. מה מתאים לך?"}

{id:"l4",title:"CLAUDE.md ברמת אמן",minutes:8,html:`
<h2>מהקובץ הבסיסי לכלי מקצועי</h2>
<p>במודול 5 יצרנו CLAUDE.md. עכשיו נלמד לכתוב אותו כמו מקצוען — כי הטעות הנפוצה ביותר היא <b>קובץ מנופח</b>, וההשלכה שלה מפתיעה.</p>
<div class="box warn"><b>⚠️ הפרדוקס של הקובץ הארוך</b>ככל שה-CLAUDE.md ארוך יותר, כך קלוד <b>מציית לו פחות</b>. הוראות חשובות הולכות לאיבוד ברעש. אם קלוד ממשיך לעשות משהו למרות שיש כלל נגדו — הקובץ כנראה ארוך מדי והכלל נבלע.</div>
<h2>הטבלה הרשמית: מה כן ומה לא</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>✅ כלול</th><th>❌ אל תכלול</th></tr>
<tr><td>פקודות שקלוד לא יכול לנחש</td><td>כל מה שהוא יגלה מקריאת הקוד</td></tr>
<tr><td>כללי סגנון שחורגים מברירת המחדל</td><td>מוסכמות סטנדרטיות שהוא כבר מכיר</td></tr>
<tr><td>הוראות בדיקה והרצה</td><td>תיעוד API מפורט (קשר לקישור)</td></tr>
<tr><td>נהלי עבודה (שמות ענפים, בקשות מיזוג)</td><td>מידע שמשתנה תכופות</td></tr>
<tr><td>החלטות ארכיטקטוניות ייחודיות</td><td>הסברים ארוכים ומדריכים</td></tr>
<tr><td>מוזרויות סביבה (משתנים נדרשים)</td><td>תיאור קובץ-אחר-קובץ של הפרויקט</td></tr>
<tr><td>מלכודות לא מובנות מאליהן</td><td>"כתוב קוד נקי" וכיוצא בזה</td></tr>
</table></div>
<h2>מבחן הגיזום</h2>
<p>לכל שורה שאל: <b>"אם אמחק את השורה הזו — האם קלוד יטעה?"</b> אם לא — מחק אותה.</p>
<h2>שלושה כלים מקצועיים</h2>
<ul>
<li><span class="kbd">/doctor</span> — סורק את הפרויקט ומציע גיזומים לתוכן שקלוד יכול להסיק מהקוד עצמו</li>
<li><b>הדגשה סלקטיבית</b> — אם הוראה אחת נדרסת שוב ושוב, הוסף לה בלבד <span class="kbd">IMPORTANT</span>. אם תדגיש הרבה שורות — אף אחת לא תבלוט.</li>
<li><span class="kbd">.claude/rules/</span> — כללים בקבצים נפרדים עם שדה <span class="kbd">paths</span>, שנטענים רק כשעובדים על קבצים תואמים. כך CLAUDE.md נשאר רזה.</li>
</ul>
<div class="box pro"><b>🎓 יעד המקצוענים: מתחת ל-200 שורות</b>מה שחורג — עובר ל-Skills (נטענים לפי צורך) או ל-rules (נטענים לפי נתיב). והחשוב מכול: <b>התייחס ל-CLAUDE.md כמו לקוד</b> — סקור אותו כשדברים משתבשים, גזום אותו בקביעות, ובדוק שינויים לפי האם התנהגות קלוד באמת השתנתה.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>הרץ <span class="kbd">/doctor</span> בפרויקט שלך וראה מה הוא מציע. אחר כך הפעל את מבחן הגיזום על כל שורה — כמה שורות שרדו?</div>
`,

{id:"l5",title:"הרשאות, ארגז חול ומצב אוטומטי",minutes:7,html:`
<h2>המתח: שליטה מול זרימה</h2>
<p>יותר מדי אישורים — אתה מאשר אוטומטית בלי לקרוא, וזה גרוע מלא לאשר בכלל. פחות מדי — אתה מאבד שליטה. הנה שכבות הפתרון:</p>
<h3>1. מצב אוטומטי <span class="en">(auto mode)</span></h3>
<p>ברירת המחדל היום במנוי Pro לסשנים אינטראקטיביים. <b>מודל מסווג נפרד</b> בוחן כל פעולה במקומך וחוסם רק את מה שנראה מסוכן: הרחבת סמכויות, תשתית לא מוכרת, ופעולות שמונעות מתוכן עוין. שאר העבודה זורמת.</p>
<h3>2. רשימות היתר <span class="en">(allowlists)</span></h3>
<p><span class="kbd">/permissions</span> מאפשר לאשר מראש פקודות שאתה סומך עליהן, עם תווים כלליים: <span class="kbd">Bash(npm run test *)</span>, <span class="kbd">Bash(git log *)</span>. שים לב שאפשר גם להתאים לפי פרמטר של כלי — למשל <span class="kbd">Agent(model:opus)</span>.</p>
<h3>3. ארגז חול <span class="en">(sandbox)</span></h3>
<p><span class="kbd">/sandbox</span> מפעיל בידוד ברמת מערכת ההפעלה שמגביל גישה לקבצים ולרשת. בתוך הגבולות האלה קלוד יכול לעבוד הרבה יותר חופשי — כי הנזק האפשרי תחום מראש.</p>
<h3>4. מצב ידני</h3>
<p>כשרוצים לאשר הכול בעצמך — <span class="kbd">Shift+Tab</span> עד Manual.</p>
<div class="box pro"><b>🎓 העיקרון שמאחורי כל זה</b>המטרה אינה "פחות אישורים" אלא <b>שהאישורים שנשארים יהיו משמעותיים</b>. אם אתה מאשר 40 פעם בשעה, אתה כבר לא קורא. אשר מראש את השגרתי — כדי שתעצור באמת כשמשהו חריג מופיע.</div>
<div class="box warn"><b>⚠️ על --dangerously-skip-permissions</b>יש דגל שמדלג על כל ההרשאות. הוא נועד <b>לסביבות מבודדות בלבד</b> — מכונה וירטואלית, קונטיינר, ארגז חול. לעולם לא על המחשב האישי שלך עם הקבצים האמיתיים.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>הרץ <span class="kbd">/permissions</span> וראה מה מוגדר. הוסף כלל היתר אחד לפקודה שאתה מאשר שוב ושוב.</div>
`},

{id:"l6",title:"תיקון מסלול וניהול סשן",minutes:7,html:`
<h2>לולאות משוב הדוקות מנצחות</h2>
<p>לפי המדריך הרשמי: אף שקלוד לפעמים פותר מושלם בניסיון הראשון, <b>תיקון מהיר מייצר פתרונות טובים יותר, מהר יותר</b>. אל תיתן לו לרוץ 10 דקות בכיוון שגוי.</p>
<h2>ארגז הכלים לתיקון</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>כלי</th><th>מה הוא עושה</th></tr>
<tr><td><span class="kbd">Esc</span></td><td>עצירה מיידית באמצע פעולה — ההקשר נשמר, אפשר לכוון מחדש</td></tr>
<tr><td><span class="kbd">Esc Esc</span> / <span class="kbd">/rewind</span></td><td>חזרה לנקודת שמירה: שיחה, קוד, או שניהם. גם "סכם מכאן/עד כאן"</td></tr>
<tr><td>"בטל את זה"</td><td>קלוד מחזיר את השינויים שעשה</td></tr>
<tr><td><span class="kbd">/clear</span></td><td>איפוס בין משימות לא קשורות</td></tr>
<tr><td><span class="kbd">/branch</span></td><td>הסתעפות לניסיון גישה אחרת מנקודה נוכחית</td></tr>
<tr><td><span class="kbd">/rename</span></td><td>שם לסשן — התייחס לסשנים כמו לענפי עבודה</td></tr>
</table></div>
<h2>נקודות שמירה משחררות אותך</h2>
<p>כל פרומפט שאתה שולח יוצר נקודת שמירה, וקלוד מצלם את מצב הקבצים לפני כל שינוי. המשמעות המעשית: <b>אתה לא חייב לתכנן כל מהלך בזהירות</b> — אפשר לומר "בוא ננסה משהו נועז", ואם לא הצליח, לחזור אחורה ולנסות אחרת.</p>
<div class="box warn"><b>⚠️ מגבלה שחשוב להכיר</b>נקודות שמירה עוקבות רק אחרי שינויים שקלוד עשה <b>בכלי העריכה שלו</b>. שינויים שנעשו דרך פקודות מעטפת או תוכנות חיצוניות אינם נתפסים. זה אינו תחליף ל-Git.</div>
<div class="box pro"><b>🎓 כלל שני התיקונים</b>תיקנת פעמיים ועדיין לא טוב? עצור. ההקשר מלא בניסיונות שנכשלו. <span class="kbd">/clear</span>, ואז פרומפט חדש שמשלב את מה שלמדת משני הכישלונות. זה כמעט תמיד מהיר יותר מתיקון שלישי.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>לחץ <span class="kbd">Esc Esc</span> בסשן פעיל וגלה את תפריט החזרה אחורה — כולל אפשרויות הסיכום החלקי. עצם הידיעה שהוא קיים משנה איך אתה עובד.</div>
`,

{id:"l7",title:"Hooks: מהמלצה לאכיפה",minutes:6,html:`
<h2>ההבחנה שמשנה תפיסה</h2>
<div class="box pro"><b>🎓 המשפט הרשמי</b>"הוראה כמו 'לעולם אל תערוך את .env' ב-CLAUDE.md או ב-Skill היא <b>בקשה</b>, לא ערובה. Hook מסוג PreToolUse שחוסם את העריכה הוא <b>אכיפה</b>. אם כלל חייב להתקיים בכל פעם — הפוך אותו ל-Hook ולא להוראה בפרומפט."</div>
<p>זה ההבדל המהותי: הוראות עוברות דרך שיקול הדעת של המודל. Hooks רצים מכנית, תמיד, בלי תלות בכלום.</p>
<h2>ארבעת ה-Hooks שמקצוענים מגדירים</h2>
<ul>
<li><b>PostToolUse</b> — עיצוב קוד אוטומטי אחרי כל עריכה. מונע כישלונות בהמשך.</li>
<li><b>PreToolUse</b> — חסימה של פעולות אסורות (מחיקות, קבצים רגישים).</li>
<li><b>Stop</b> — הרצת בדיקה שחוסמת סיום עד שהיא עוברת. זה השער הדטרמיניסטי מהשיעור הראשון.</li>
<li><b>PostCompact</b> — הזרקה מחדש של הוראות קריטיות אחרי דחיסה, כדי שלא יאבדו.</li>
</ul>
<p>ויש גם <b>PermissionRequest</b> — שמאפשר לנתב בקשות אישור לערוץ חיצוני. הצוות של Anthropic משתמש בזה כדי לקבל אישורים בסלאק או בוואטסאפ.</p>
<h2>לכתוב Hook? תבקש מקלוד</h2>
<div class="prompt-ex"><div class="pl">פרומפטים שעובדים</div>כתוב Hook שמריץ עיצוב קוד אחרי כל עריכת קובץ<br>—<br>כתוב Hook שחוסם כתיבה לתיקיית migrations<br>—<br>כתוב Hook שמריץ את הבדיקות לפני שאתה מסיים תור, וחוסם אם הן נכשלות</div>
<div class="box info"><b>ℹ️ Hooks בתוך Skills</b>יכולת מתקדמת: Skill יכול להגדיר Hooks שנרשמים ברגע שהוא מופעל ופועלים לשארית הסשן. כך אורזים "מצב עבודה" שלם — הוראות + אכיפה — בחבילה אחת.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>שאל: "אילו שלושה Hooks היו הכי שימושיים לפרויקט הזה? הסבר כל אחד." בחר אחד ובקש להגדיר.</div>
`},

{id:"l8",title:"סוכנים מותאמים ו-Skills מתקדמים",minutes:7,html:`
<h2>סוכן מותאם: עובד עם תפקיד קבוע</h2>
<p>קובץ ב-<span class="kbd">.claude/agents/</span> מגדיר סוכן משנה עם אישיות, כלים ומודל משלו:</p>
<div class="code">---
name: security-reviewer
description: סוקר קוד לאיתור פרצות אבטחה
tools: Read, Grep, Glob, Bash
model: opus
---
אתה מהנדס אבטחה בכיר. סקור את הקוד ואתר:
- פרצות הזרקה (SQL, XSS, פקודות)
- כשלי הרשאות ואימות
- סודות שנשמרו בקוד
תן הפניות מדויקות לשורות והצעות תיקון.</div>
<p>שים לב לשדות: <span class="kbd">tools</span> מגביל אילו כלים זמינים לו (סוקר לא צריך להיות מסוגל לערוך), ו-<span class="kbd">model</span> מאפשר להריץ אותו על מודל חזק יותר מהסשן.</p>
<h2>Skills — מה שלא סיפרנו במודול 7</h2>
<p>מעבר ל-name ו-description, יש שדות שהופכים Skills לכלי מקצועי:</p>
<div class="tbl-wrap"><table class="cmp">
<tr><th>שדה</th><th>מה הוא נותן</th></tr>
<tr><td><span class="kbd">disable-model-invocation: true</span></td><td>רק אתה מפעיל, קלוד לא — לנהלים עם תופעות לוואי</td></tr>
<tr><td><span class="kbd">user-invocable: false</span></td><td>ההפך: רק קלוד, ידע רקע שלא מפעילים ידנית</td></tr>
<tr><td><span class="kbd">context: fork</span></td><td>הכישור רץ בסוכן משנה — לא מזהם את ההקשר שלך</td></tr>
<tr><td><span class="kbd">allowed-tools</span></td><td>אישור מראש לכלים למשך התור הזה בלבד</td></tr>
<tr><td><span class="kbd">model</span> / <span class="kbd">effort</span></td><td>מודל או עומק חשיבה ייעודיים לכישור</td></tr>
<tr><td><span class="kbd">paths</span></td><td>נטען אוטומטית רק כשעובדים על קבצים תואמים</td></tr>
<tr><td><span class="kbd">$ARGUMENTS</span></td><td>העברת פרמטרים: <span class="kbd">/fix-issue 1234</span></td></tr>
</table></div>
<div class="box pro"><b>🎓 שילוב שמדגים את הכוח</b>Skill עם <span class="kbd">context: fork</span> + <span class="kbd">model: opus</span> + <span class="kbd">disable-model-invocation</span> = פקודה שאתה מפעיל ידנית, שרצה על המודל החזק, בהקשר נפרד — ומחזירה רק את המסקנה. למשל <span class="kbd">/audit</span> שסורק את כל הפרויקט בלי לגעת בסשן שלך.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>בקש מקלוד ליצור סוכן מותאם ב-<span class="kbd">.claude/agents/</span> לתפקיד שחוזר אצלך (מבקר עיצוב? בודק עברית?), ואז הפעל אותו: "השתמש בסוכן X כדי לבדוק את Y".</div>
`},

{id:"l9",title:"תשעת דפוסי הכשל",minutes:7,html:`
<h2>לזהות מוקדם = לחסוך שעות</h2>
<p>המדריך הרשמי מפרט דפוסי כשל נפוצים. הנה הם, עם התיקון לכל אחד:</p>
<h3>1. סשן ה"כל הקערה"</h3>
<p>התחלת במשימה אחת, שאלת משהו לא קשור, חזרת לראשונה. ההקשר מלא ברעש. <b>תיקון:</b> <span class="kbd">/clear</span> בין משימות.</p>
<h3>2. תיקון אינסופי</h3>
<p>מתקן ומתקן ועדיין לא נכון. <b>תיקון:</b> אחרי שני תיקונים כושלים — <span class="kbd">/clear</span> ופרומפט חדש שמשלב את הלקחים.</p>
<h3>3. CLAUDE.md מנופח</h3>
<p>ארוך מדי, ולכן חצי ממנו נבלע. <b>תיקון:</b> גיזום אכזרי; מה שקלוד עושה נכון בלי ההוראה — מחק.</p>
<h3>4. פער האמון</h3>
<p>מימוש שנראה סביר אבל לא מטפל במקרי קצה. <b>תיקון:</b> תמיד לספק אימות. אם אי אפשר לאמת — אל תשלח לייצור.</p>
<h3>5. חקירה אינסופית</h3>
<p>"תחקור את X" בלי תיחום → מאות קבצים בהקשר. <b>תיקון:</b> תחם, או האצל לסוכן משנה.</p>
<h3>6. מיקרו-ניהול</h3>
<p>הכתבת כל צעד במקום לתאר תוצאה. <b>תיקון:</b> תאר מה צריך להיות נכון בסוף, ותן לו לנווט.</p>
<h3>7. דילוג על תכנון במשימה גדולה</h3>
<p>נבנה משהו מצוין — לבעיה הלא נכונה. <b>תיקון:</b> מצב תכנון כשההיקף לא ברור.</p>
<h3>8. אמון עיוור במבקר</h3>
<p>מבקר שהתבקש למצוא פערים <b>ימצא</b> — גם כשהעבודה תקינה. רדיפה אחרי כל ממצא מובילה להנדסת יתר: שכבות הפשטה מיותרות, קוד הגנתי, ובדיקות למקרים שלא יכולים לקרות. <b>תיקון:</b> הנחה את המבקר לסמן רק פערים שפוגעים בנכונות או בדרישות.</p>
<h3>9. הזנחת האינטואיציה</h3>
<p>הכללים במודול הזה הם נקודות פתיחה, לא חוקי טבע. לפעמים <b>כדאי</b> לתת להקשר להצטבר כי אתה עמוק בבעיה אחת. לפעמים כדאי לדלג על תכנון כי המשימה חקרנית. <b>תיקון:</b> שים לב מה עובד אצלך — ותן לניסיון לעצב את הכללים שלך.</p>
<div class="box pro"><b>🎓 ההודעה האמיתית של המודול</b>מומחיות אינה שינון של כללים. היא היכולת לזהות מתי כל כלל חל, ומתי דווקא לשבור אותו.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>עבור על תשעת הדפוסים וסמן: באילו נתקלת בעצמך? זה הרגע להפוך תסכול עבר לשיפור עתידי.</div>
`}
],

{id:"l2",title:"דפוס כותב/מבקר",minutes:7,html:`
<h2>הדפוס הכי משתלם שתלמד</h2>
<p>הרעיון פשוט: <b>סשן אחד כותב, סשן שני מבקר</b>. הסוד הוא שהמבקר מגיע עם <b>הקשר נקי</b> — הוא לא ראה את ההתלבטויות, לא מוטה לטובת הפתרון, ובוחן את התוצאה על פי ערכה בלבד.</p>
<div class="tbl-wrap"><table class="cmp">
<tr><th>סשן א' — הכותב</th><th>סשן ב' — המבקר</th></tr>
<tr><td>"ממש מגביל קצב לנקודות הקצה"</td><td></td></tr>
<tr><td></td><td>"סקור את המימוש ב-@rateLimiter.ts. חפש מקרי קצה, מרוצי תהליכים, והתאמה לדפוסים הקיימים בפרויקט"</td></tr>
<tr><td>"הנה הערות הביקורת: [הדבק]. טפל בהן"</td><td></td></tr>
</table></div>
<h2>למה זה עובד כל כך טוב?</h2>
<p>אותה סיבה שבגללה קשה לערוך טקסט שכתבת בעצמך: מי שיצר משהו רואה את מה שהתכוון לכתוב, לא את מה שיצא. הקשר נקי = עיניים חדשות.</p>
<h2>וריאציות של הדפוס</h2>
<ul>
<li><b>בודק/מממש</b> — אחד כותב בדיקות, השני כותב קוד שיעבור אותן.</li>
<li><b>מהנדס בכיר</b> — טיפ רשמי מהצוות: קלוד אחד כותב תוכנית, שני סוקר אותה "בתור מהנדס בכיר" לפני שמתחילים.</li>
<li><b>שני כיוונים</b> — שני סשנים מנסים גישות שונות לאותה בעיה, ואתה בוחר.</li>
</ul>
<div class="box pro"><b>🎓 פרומפט האתגור</b>טיפ רשמי שמחדד את הביקורת: <b>"תחקור אותי על השינויים האלה, ואל תפתח בקשת מיזוג עד שאעבור את המבחן שלך."</b> זה הופך את קלוד ממאשר לשומר סף.</div>
<h2>הגרסה הקלה: /code-review</h2>
<p>אין צורך תמיד בשני סשנים ידניים. <span class="kbd">/code-review</span> מריץ סקירה בסוכן משנה עם הקשר נקי ומחזיר ממצאים לסשן שלך. אפשר גם <span class="kbd">/code-review --fix</span> כדי שיתקן אותם.</p>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>אחרי שקלוד יבנה משהו — הרץ <span class="kbd">/code-review</span> ותראה מה עיניים רעננות מוצאות.</div>

{id:"l3",title:"סשנים מקבילים בפועל",minutes:7,html:`
<h2>הבעיה: התנגשויות</h2>
<p>שני סשנים שעורכים את אותם קבצים ידרסו זה את זה. הפתרון המקצועי נקרא <span class="term">Worktree <span class="en">(עץ עבודה)</span></span> — עותק מבודד של הפרויקט עם ענף משלו. כל סשן עובד בעותק שלו, ובסוף ממזגים.</p>
<div class="code">claude --worktree feature-auth
claude -w bugfix-login --tmux</div>
<p>הדגל <span class="kbd">--tmux</span> פותח כל אחד בלשונית טרמינל משלו.</p>
<h2>ארבע דרכים להריץ במקביל</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>שיטה</th><th>מתאים ל…</th></tr>
<tr><td><b>Worktrees</b> בטרמינל</td><td>שליטה מלאה, בידוד אמיתי</td></tr>
<tr><td><b>אפליקציית הדסקטופ</b></td><td>ניהול חזותי של כמה סשנים, כל אחד ב-worktree</td></tr>
<tr><td><b>Claude Code בדפדפן</b></td><td>ריצה בענן — ממשיך גם כשהמחשב כבוי</td></tr>
<tr><td><b>Agent view</b> (<span class="kbd">claude agents</span>)</td><td>מסך אחד שמציג את כל הסשנים: מה רץ, מה תקוע עליך, מה הסתיים</td></tr>
</table></div>
<h2>שני כלים שעושים סדר</h2>
<ul>
<li><span class="kbd">/color</span> — צבע שונה לכל סשן. טיפ רשמי מהצוות שמריץ 3–5 במקביל: בלי זה מתבלבלים.</li>
<li><span class="kbd">claude --name "auth-refactor"</span> — שם לסשן, כדי למצוא אותו אחר כך ב-<span class="kbd">/resume</span>.</li>
</ul>
<div class="box info"><b>ℹ️ סשנים שמדברים ביניהם</b>יכולת חדשה: <b>העברת הודעות בין סשנים</b>. סשן אחד יכול להעביר ממצא לשני — "הסשן שעובד על ה-API גילה שהשדה שינה שם" — בלי שתסביר מחדש. מפעילים בהזכרת הסשן עם <span class="kbd">@</span>.</div>
<div class="box pro"><b>🎓 עץ עבודה לניתוח</b>טיפ מהצוות: החזק worktree ייעודי לחקירה — לוגים, שאילתות ומחקר — בנפרד מהעבודה על הקוד. כך החקירה לא מפריעה לבנייה, וההקשר של כל אחד נשאר נקי.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>הרץ <span class="kbd">claude agents</span> וגלה את מסך ניהול הסוכנים — גם אם יש לך רק סשן אחד, שווה להכיר את התצוגה.</div>

{id:"l4",title:"עבודה ברקע ומעקב",minutes:6,html:`
<h2>לשחרר את הסשן</h2>
<p>לא כל משימה צריכה שתשב מולה. שלושה מנגנונים:</p>
<h3>סשן ברקע</h3>
<p><span class="kbd">claude --bg "חקור למה הבדיקה מהבהבת"</span> — מפעיל סוכן שרץ בנפרד ומחזיר שליטה מיד. מתוך סשן קיים: <span class="kbd">/background</span> מנתק אותו לרקע.</p>
<h3>ניהול המשימות</h3>
<ul>
<li><span class="kbd">/tasks</span> — מה רץ כרגע בסשן הזה</li>
<li><span class="kbd">claude agents</span> — מסך כל הסוכנים</li>
<li><span class="kbd">claude logs &lt;id&gt;</span> — פלט אחרון מסוכן ברקע</li>
<li><span class="kbd">claude attach &lt;id&gt;</span> — התחברות לסוכן שרץ</li>
<li><span class="kbd">claude stop / respawn / rm</span> — עצירה, הפעלה מחדש, הסרה</li>
</ul>
<h3>פקודות מעטפת ברקע</h3>
<p>פקודה ארוכה (שרת פיתוח, בדיקות) תוקעת את הסשן. לחיצה על <span class="kbd">Ctrl+B</span> מעבירה אותה לרקע — קלוד ממשיך לעבוד והפלט נשמר לקובץ שהוא יכול לקרוא.</p>
<div class="box pro"><b>🎓 מקש חירום</b><span class="kbd">Ctrl+X Ctrl+K</span> (פעמיים תוך 3 שניות) עוצר את <b>כל</b> סוכני הרקע בסשן. שווה לזכור כשמשהו יוצא משליטה.</div>
<h2>התרחיש שמדגים הכול</h2>
<ol>
<li>בערב: <span class="kbd">claude --bg "עבור על כל התיעוד ומצא סתירות. כתוב דוח ל-REPORT.md"</span></li>

<li>קורא את REPORT.md.</li>

{id:"l5",title:"פיזור המוני: /batch ולולאות",minutes:7,html:`
<h2>כשהמשימה חוזרת על עצמה מאות פעמים</h2>
<p>צריך לעדכן 200 קבצים באותו אופן? לבדוק 50 עמודים? זו לא עבודה לסוכן אחד — זו עבודה ל<b>צי</b>.</p>
<h3>הדרך המובנית: /batch</h3>
<p><span class="kbd">/batch &lt;הוראה&gt;</span> מפצל את השינוי בין <b>5 עד 30 סוכני משנה</b>. כל אחד עובד ב-worktree משלו ופותח בקשת מיזוג נפרדת. זו הדרך המומלצת למיגרציות גדולות.</p>
<h3>הדרך התסריטאית</h3>
<p>לשליטה מלאה, לולאה שקוראת ל-<span class="kbd">claude -p</span> לכל פריט:</p>
<div class="code">for file in $(cat files.txt); do
  claude -p "המר את $file לפורמט החדש. החזר OK או FAIL." \\
    --allowedTools "Edit,Bash(git commit *)"
done</div>
<p>שים לב ל-<span class="kbd">--allowedTools</span>: בריצה לא מפוקחת חובה לתחום בדיוק מה מותר.</p>
<div class="box pro"><b>🎓 תמיד לכייל על מדגם</b>ההנחיה הרשמית: הרץ קודם על <b>2–3 פריטים</b>, שפר את הפרומפט לפי מה שהשתבש, ורק אז שחרר על כל הסט. פרומפט לא מכויל שרץ על 200 קבצים = 200 טעויות.</div>
<h3>זרימות עבודה דינמיות</h3>
<p>הרמה הגבוהה ביותר: <span class="term">זרימות עבודה דינמיות <span class="en">(Dynamic Workflows)</span></span> — קלוד כותב <b>סקריפט</b> שמתזמר עשרות עד מאות סוכנים, כולל שכבת סוכנים שמצליבה ומאמתת את הממצאים של הראשונים. מתאים לביקורת על פרויקט שלם. מפעילים פשוט בבקשה: "השתמש בזרימת עבודה כדי לבדוק את כל X".</p>
<div class="box try"><b>🚀 נסה עכשיו</b>חשוב על משימה חוזרת שיש לך (שינוי שם בהרבה קבצים? בדיקת קישורים?) — ותכנן איך היית מכייל אותה על שלושה פריטים לפני פיזור.</div>
`},

{id:"l6",title:"מצב Headless: קלוד בתוך סקריפטים",minutes:6,html:`
<h2>קלוד כפקודה</h2>
<p>הדגל <span class="kbd">-p</span> מריץ משימה אחת בלי ממשק שיחה — וזו אבן היסוד של כל אוטומציה מתקדמת:</p>
<div class="code">claude -p "הסבר מה הפרויקט הזה עושה"
cat error.log | claude -p "מה השגיאה החוזרת כאן?"
git diff main --name-only | claude -p "סקור את הקבצים האלה לבעיות אבטחה"</div>
<h2>פורמטי פלט לתוכנות</h2>
<ul>
<li><span class="kbd">--output-format json</span> — אובייקט JSON עם שדה <span class="kbd">result</span></li>
<li><span class="kbd">--output-format stream-json</span> — אירוע בכל שורה, לעיבוד בזמן אמת</li>
<li><span class="kbd">--json-schema '{...}'</span> — <b>פלט מובנה ומאומת</b> לפי סכמה שאתה מגדיר. כך משלבים את קלוד בתוך מערכת שמצפה לשדות מדויקים.</li>
</ul>
<h2>בקרות בטיחות שחובה להכיר</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>דגל</th><th>למה הוא קריטי</th></tr>
<tr><td><span class="kbd">--max-budget-usd 5</span></td><td><b>תקרת הוצאה קשיחה.</b> ההגנה החשובה ביותר בריצה אוטומטית</td></tr>
<tr><td><span class="kbd">--max-turns 3</span></td><td>מגביל את מספר סבבי העבודה — מונע לולאות אינסופיות</td></tr>
<tr><td><span class="kbd">--allowedTools</span></td><td>בדיוק מה מותר, ותו לא</td></tr>
<tr><td><span class="kbd">--permission-mode</span></td><td>בחירת מצב הרשאות מפורשת</td></tr>
</table></div>
<div class="box warn"><b>⚠️ הכלל של ריצה לא מפוקחת</b>שלושה תנאים לפני שמשחררים אוטומציה: (1) תקרת תקציב, (2) כלים מתוחמים, (3) הרצה ידנית מוצלחת קודם. אוטומציה בלי גבולות היא הדרך הבטוחה להפתעות.</div>
<div class="box pro"><b>🎓 שני דגלים לפתרון בעיות</b><span class="kbd">--bare</span> מדלג על גילוי הגדרות מקומיות ומאיץ את ההפעלה פי כ-10 — מצוין לסקריפטים. <span class="kbd">--safe-mode</span> מכבה את כל ההתאמות האישיות — הכלי הראשון כשמשהו מתנהג מוזר ואתה רוצה לדעת אם ההגדרות שלך אשמות.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>הרץ בטרמינל: <span class="kbd">claude -p "מה יש בתיקייה הזו?" --max-budget-usd 0.50</span> — קלוד עונה, מסיים, ואתה חוזר לשורת הפקודה.</div>
`},

{id:"l7",title:"ביקורת יריבה — ומלכודת הנדסת היתר",minutes:6,html:`
<h2>הצעד האחרון לפני 'סיימתי'</h2>
<p>ככל שקלוד עובד יותר זמן בלי פיקוח, כך חשובה יותר <b>בדיקה עצמאית</b> לפני שסופרים את העבודה כגמורה. סוקר שרץ בסוכן משנה רואה רק את השינוי ואת הקריטריונים — לא את שרשרת ההיגיון שהובילה אליו — ולכן שופט את התוצאה לגופה.</p>
<div class="prompt-ex"><div class="pl">פרומפט הסקירה</div>הפעל סוכן משנה שיסקור את השינוי מול SPEC.md. בדוק שכל דרישה מומשה, שיש בדיקות למקרי הקצה שנרשמו, ושדבר מחוץ להיקף המשימה לא השתנה. דווח על פערים — לא על העדפות סגנון.</div>
<h2>המלכודת</h2>
<div class="box warn"><b>⚠️ אזהרה רשמית שחשוב להפנים</b>סוקר שהתבקש למצוא פערים <b>ימצא</b> — גם כשהעבודה תקינה, כי זה מה שביקשת ממנו. רדיפה אחרי כל ממצא מובילה ל<b>הנדסת יתר</b>: שכבות הפשטה מיותרות, קוד הגנתי מיותר, ובדיקות למקרים שלא יכולים לקרות.</div>
<h2>איך מנטרלים את המלכודת</h2>
<ol>
<li><b>הגדר סף במפורש:</b> "סמן רק פערים שפוגעים בנכונות או בדרישות המוצהרות. כל השאר — סמן כרשות."</li>
<li><b>בקש דירוג:</b> "דרג כל ממצא: קריטי / משנה / העדפה."</li>
<li><b>אתה מכריע.</b> הסוקר ממליץ; ההחלטה מה לתקן היא שלך. זה בדיוק עקרון ה<b>שיפוט</b> ממודול 1.</li>
</ol>
<h2>הכלים המובנים</h2>
<ul>
<li><span class="kbd">/code-review</span> — סקירת נכונות בסוכן משנה, עם רמות עומק מ-low ועד ultra</li>
<li><span class="kbd">/security-review</span> — סריקת השינוי לפרצות אבטחה</li>
<li><span class="kbd">/simplify</span> — סוכני איכות מקבילים שמאתרים כפילויות וסיבוכיות מיותרת</li>
<li><span class="kbd">/verify</span> — אימות שהתוצר באמת עובד</li>
</ul>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>הרץ <span class="kbd">/code-review</span> על עבודה אחרונה שלך — ואז החלט מודע: אילו ממצאים אתה מתקן ואילו לא, ולמה.</div>
`,

{id:"l2",title:"דפוס 1: שרשור · דפוס 2: ניתוב",minutes:7,html:`
<h2>דפוס 1 — שרשור פרומפטים <span class="en">(Prompt Chaining)</span></h2>
<p>מפרקים משימה לשלבים קבועים, וכל שלב מקבל את הפלט של הקודם. בין השלבים אפשר לשים <b>שערי בדיקה</b>.</p>
<p><b>מתי:</b> כשהמשימה מתפרקת לתתי-משימות ידועות מראש, ואתה מוכן לשלם בזמן תמורת דיוק.</p>
<p><b>דוגמה:</b> כתיבת מודעה שיווקית ← בדיקה שהיא עומדת באורך ← תרגום לאנגלית.</p>
<div class="box info"><b>ℹ️ זה מוכר לך</b>זה בדיוק מה שלמדנו במודול 3 כ"שרשור" — עכשיו אתה יודע שיש לזה שם רשמי בארכיטקטורה, ושהוא הדפוס הבסיסי מכולם.</div>
<h2>דפוס 2 — ניתוב <span class="en">(Routing)</span></h2>
<p>מסווגים את הקלט ומפנים אותו לתהליך מתמחה. כל מסלול מקבל פרומפט משלו, מותאם בדיוק לסוג שלו.</p>
<p><b>מתי:</b> כשיש קטגוריות מובחנות שדורשות טיפול שונה — ואופטימיזציה לאחת פוגעת באחרות.</p>
<p><b>דוגמה:</b> פניות שירות — "החזר כספי" הולך למסלול אחד, "תקלה טכנית" לאחר. פרומפט אחד שמנסה לשרת את שניהם יהיה בינוני בשניהם.</p>
<div class="box pro"><b>🎓 למה ניתוב מנצח פרומפט-על</b>הפיתוי הוא לכתוב פרומפט אחד ענק שמכסה הכול. אבל כל הוראה שמתאימה למקרה אחד מוסיפה רעש לכל השאר. ניתוב שומר על כל מסלול <b>נקי וממוקד</b> — וזה תמיד מנצח.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>יש לך משימה שאתה מבקש בכמה וריאציות? נסה לנסח שני פרומפטים ממוקדים במקום אחד גמיש — ושים לב לשיפור.</div>
`,

{id:"l3",title:"דפוס 3: מקבול",minutes:6,html:`
<h2>שתי צורות שונות לגמרי</h2>
<h3>א. חלוקה <span class="en">(Sectioning)</span></h3>
<p>מפצלים משימה לתתי-משימות <b>עצמאיות</b> שרצות יחד, ומאחדים תוצאות.</p>
<p><b>דוגמה רשמית:</b> מודל אחד בודק אם פניית משתמש מכילה תוכן בעייתי, בזמן שמודל אחר מייצר את התשובה. שניהם ממוקדים במשימה אחת ולכן טובים בה יותר.</p>
<h3>ב. הצבעה <span class="en">(Voting)</span></h3>
<p>מריצים את <b>אותה משימה</b> כמה פעמים ומשווים תוצאות — כדי להעלות ביטחון.</p>
<p><b>דוגמה:</b> שלוש סקירות אבטחה נפרדות על אותו קוד. מה שכולן מצאו — כמעט בוודאות אמיתי. מה שרק אחת מצאה — שווה בדיקה נוספת.</p>
<div class="box pro"><b>🎓 מתי הצבעה משתלמת</b>כשעלות ה<b>החמצה</b> גבוהה מעלות הבדיקה הכפולה. אבטחה, כספים, בריאות, משפט — כן. סיכום מייל — לא.</div>
<h2>איך מבקשים את זה בפועל</h2>
<div class="prompt-ex"><div class="pl">חלוקה</div>הפעל שלושה סוכנים במקביל: אחד בודק ביצועים, אחד נגישות, אחד אבטחה. רכז את שלושת הדיווחים לטבלה אחת לפי חומרה.</div>
<div class="prompt-ex"><div class="pl">הצבעה</div>הרץ את סקירת האבטחה שלוש פעמים בסוכנים נפרדים ובלתי תלויים. הצג לי רק ממצאים שהופיעו בלפחות שתיים מהן, וסמן בנפרד מה הופיע רק פעם אחת.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>קח החלטה חשובה שאתה מתלבט בה ובקש שלוש הערכות עצמאיות. השווה — ההסכמות והמחלוקות יגלו לך איפה הוודאות ואיפה הסיכון.</div>
`},

{id:"l4",title:"דפוס 4: מתזמר-עובדים",minutes:6,html:`
<h2>ההבדל מ'חלוקה'</h2>
<p>במקבול, <b>אתה</b> יודע מראש איך לחלק. במתזמר-עובדים, <b>המודל</b> מחליט: מודל מרכזי מפרק את המשימה דינמית, מאציל לעובדים, ומאחד את התוצאות.</p>
<p><b>מתי:</b> כשאי אפשר לדעת מראש כמה תתי-משימות יהיו ומה טיבן.</p>
<div class="box info"><b>ℹ️ הדוגמה הרשמית — ואתה כבר משתמש בה</b>סוכן קוד שמשנה כמה קבצים: מספר הקבצים וטיב השינויים תלויים במשימה ואי אפשר לקבוע אותם מראש. <b>זה בדיוק מה ש-Claude Code עושה</b> כשהוא מפעיל סוכני משנה. הכרת הדפוס מסבירה מה קורה מאחורי הקלעים.</div>
<h2>מה מבדיל תזמור טוב מגרוע</h2>
<ul>
<li><b>תיאור משימה חד לכל עובד</b> — עובד עם משימה מעורפלת מחזיר תוצר מעורפל.</li>
<li><b>פורמט החזרה אחיד</b> — כדי שהאיחוד יהיה אפשרי. "כל אחד יחזיר: ממצא, מיקום, חומרה".</li>
<li><b>איחוד שהוא לא רק שרשור</b> — המתזמר צריך לזהות חפיפות, סתירות ופערים בין הדיווחים.</li>
</ul>
<div class="prompt-ex"><div class="pl">תזמור מפורש</div>המשימה: לוודא שכל הטקסטים באתר תקינים בעברית.<br>פרק את העבודה בעצמך לפי מה שתמצא, האצל לסוכנים במקביל, ובקש מכל אחד להחזיר: קובץ, שורה, הבעיה, הצעת תיקון.<br>לבסוף אחד לטבלה אחת ממוינת לפי חומרה, וציין אם יש בעיה שחוזרת בכמה מקומות.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>תן לקלוד משימה רוחבית עם פורמט החזרה מוגדר, ותן לו לפרק בעצמו. שים לב איך הוא מחליט על החלוקה.</div>
`,

{id:"l5",title:"דפוס 5: מעריך-משפר",minutes:6,html:`
<h2>לולאת השיפור</h2>
<p>מודל אחד מייצר, מודל שני מעריך ונותן משוב, והראשון משפר — בלולאה, עד שהמשוב מרוצה.</p>
<p><b>מתי זה עובד היטב?</b> שני תנאים לפי המסמך הרשמי:</p>
<ol>
<li>יש <b>קריטריוני הערכה ברורים</b>.</li>
<li>שיפור איטרטיבי באמת מוסיף ערך מדיד.</li>
</ol>
<p>סימן מובהק: <b>אם אדם היה יכול לנסח משוב שמשפר את התוצאה — גם מודל יכול.</b></p>
<h2>הדוגמה הרשמית</h2>
<p>תרגום ספרותי: המתרגם מייצר גרסה, המעריך מזהה ניואנסים תרבותיים שאבדו, המתרגם משפר. סבב אחר סבב — עד שהתרגום תופס גם את מה שבין השורות.</p>
<div class="box pro"><b>🎓 האח הגדול של דפוס כותב/מבקר</b>מודול 13 לימד את הדפוס בגרסה ידנית — אתה מעביר ממצאים בין סשנים. כאן זו לולאה אוטומטית. אותו רעיון, שתי רמות של אוטומציה.</div>
<h2>איך מבקשים לולאה כזו</h2>
<div class="prompt-ex"><div class="pl">מעריך-משפר</div>כתוב את המכתב. ואז עבור לתפקיד מעריך ובדוק אותו מול הקריטריונים: (1) הטון מכבד אך תקיף (2) עד 150 מילה (3) יש קריאה לפעולה ברורה (4) אין ז'רגון.<br>אם משהו לא עומד — שפר וחזור על ההערכה. הצג לי רק את הגרסה שעברה את כל הקריטריונים, ואת מספר הסבבים שנדרשו.</div>

{id:"l6",title:"עיצוב כלים: הסוד שמפתיעים בו",minutes:7,html:`
<h2>הגילוי מהמסמך הרשמי</h2>
<div class="box pro"><b>🎓 המשפט שמשנה סדרי עדיפויות</b>בפיתוח הסוכן של Anthropic למבחן SWE-bench — <b>הושקע יותר זמן באופטימיזציה של הכלים מאשר בפרומפט הכולל.</b> זה הפוך מהאינטואיציה של רוב האנשים, שמלטשים פרומפטים ומזניחים את ממשק הכלים.</div>
<p>המונח הרשמי: <span class="term">ממשק סוכן-מחשב <span class="en">(ACI — Agent-Computer Interface)</span></span>. הרעיון: כמו שמעצבים ממשק לבני אדם בקפידה, כך יש לעצב את הממשק שדרכו הסוכן פועל.</p>
<h2>עקרונות עיצוב כלים</h2>
<ul>
<li><b>עצמאיים ועמידים לשגיאות</b> — כלי צריך לעבוד לבד ולהחזיר שגיאה מובנת כשמשהו משתבש.</li>
<li><b>ברורים לחלוטין בייעודם</b> — התיאור צריך לומר בדיוק מתי להשתמש בהם. (מוכר? זה בדיוק ה-description של Skills.)</li>
<li><b>מינימום חפיפה</b> — שני כלים שעושים דבר דומה יוצרים נקודת החלטה מבלבלת. עדיף כלי אחד ברור.</li>
<li><b>מרחב לחשיבה לפני הפלט</b> — לתת למודל מקום "לחשוב בקול" לפני שהוא מייצר את הפרמטרים.</li>
<li><b>פורמטים טבעיים</b> — פורמט שנפוץ בנתוני האימון יעבוד טוב יותר מפורמט אקזוטי עם בריחות תווים מסובכות.</li>
<li><b>מניעת טעות בעיצוב <span class="en">(poka-yoke)</span></b> — לתכנן כך שאי אפשר יהיה לטעות. אם כלי נקרא לא נכון שוב ושוב — שנה את הכלי, לא את הפרומפט.</li>
</ul>
<div class="box info"><b>ℹ️ מה זה אומר לך בפועל</b>גם בלי לתכנת: כשאתה בונה <b>Skill</b>, אתה מעצב כלי. התיאור שלו, השדות שהוא מקבל, מה הוא מחזיר — כל אלה הם עיצוב ACI. הכללים כאן חלים במלואם על ה-Skills שלך.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>קח Skill שבנית במודול 7 ובחן אותו מול ששת העקרונות. איזה מהם הוא לא מקיים?</div>
`},

{id:"l7",title:"מתי לא להשתמש בסוכן",minutes:6,html:`
<h2>השאלה שמומחים שואלים ראשונה</h2>
<p>המסמך הרשמי מקדיש מקום מיוחד לשאלה הזו, וזה לא במקרה: <b>הטעות הנפוצה ביותר היא סיבוך מיותר</b>.</p>
<div class="box pro"><b>🎓 הציטוט המרכזי</b>"מערכות סוכניות לרוב מחליפות זמן תגובה ועלות בביצועים טובים יותר במשימה. כדאי לשקול מתי ההחלפה הזו הגיונית."</div>
<h2>ארבעה מקרים שבהם סוכן הוא טעות</h2>
<ol>
<li><b>קריאה בודדת מספיקה.</b> פרומפט מלוטש עם דוגמאות ומידע רלוונטי פותר את זה — בלי סוכן.</li>
<li><b>המשימה מתפרקת לנתיב קבוע.</b> אם אתה יודע מראש את השלבים — זה תהליך מוגדר, לא סוכן. פשוט וזול יותר.</li>
<li><b>העלות והזמן לא מצדיקים.</b> סוכן שרץ 4 דקות במקום 20 שניות — רק אם התוצאה באמת שווה זאת.</li>
<li><b>אין מספיק אמון בשיקול הדעת בתחום.</b> תחום רגיש שבו החלטה שגויה יקרה? הישאר עם נתיב מוגדר ובקרה אנושית.</li>
</ol>
<h2>סדר הבנייה הנכון</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>שלב</th><th>נסה</th><th>עבור הלאה אם…</th></tr>
<tr><td>1</td><td>פרומפט אחד טוב</td><td>התוצאות לא עקביות</td></tr>
<tr><td>2</td><td>פרומפט + דוגמאות + מידע רלוונטי</td><td>המשימה דורשת כמה שלבים</td></tr>
<tr><td>3</td><td>תהליך מוגדר (שרשור/ניתוב)</td><td>אי אפשר לדעת את השלבים מראש</td></tr>
<tr><td>4</td><td>סוכן</td><td>—</td></tr>
</table></div>
<h2>ואיפה סוכנים באמת מבריקים</h2>
<p>המסמך מציין שני תחומים עם תשואה מוכחת: <b>תמיכת לקוחות</b> ו<b>סוכני קוד</b>. מה משותף להם? שיחה שמשולבת בפעולה, קריטריוני הצלחה ברורים, לולאת משוב טבעית, ופיקוח אנושי משמעותי.</p>
<div class="box try"><b>🚀 נסה עכשיו</b>קח רעיון שרצית לבנות והרץ עליו את סדר הבנייה: האם באמת צריך סוכן, או ששלב 1–2 מספיק? התשובה תחסוך לך זמן וכסף.</div>
`}

{id:"l2",title:"החזית המשוננת",minutes:6,html:`
<h2>המושג שמסביר את התסכול</h2>
<p><span class="term">החזית המשוננת <span class="en">(The Jagged Frontier)</span></span> — עוד מושג של מולליק — מסביר תופעה שכל משתמש חווה: ה-AI פותר בקלות בעיה שנראית קשה, ונכשל במשהו שנראה טריוויאלי.</p>
<p>הדימוי: גבול היכולת של ה-AI אינו קו ישר אלא <b>קו משונן</b>. יש בליטות שבהן הוא עולה על מומחים, ולצידן ממש שקעים שבהם הוא נכשל — ואי אפשר לנחש מראש איפה נמצא מה.</p>
<div class="box warn"><b>⚠️ למה זה מסוכן</b>הבעיה אינה הכישלון עצמו — אלא ש<b>הוא נשמע אותו דבר</b>. אותו ביטחון בתשובה מבריקה ובתשובה שגויה. אין אות אזהרה מובנה.</div>
<h2>איך מנווטים בחזית משוננת</h2>
<ol>
<li><b>מיפוי אישי.</b> הדרך היחידה לדעת איפה השקעים היא ניסיון. שים לב איפה קלוד מבריק ואיפה נכשל <b>בתחום שלך</b>.</li>
<li><b>מולליק ממליץ: "זרוק AI על כל משימה מורכבת"</b> — לא כי הוא תמיד יצליח, אלא כי זו הדרך היחידה לגלות את מפת הגבול.</li>
<li><b>אמת חזק במיוחד ליד השקעים שגילית.</b> ברגע שאתה מכיר תחום שבו הוא נוטה ליפול — שם הבדיקה הכי חשובה.</li>
<li><b>אל תסיק מהצלחה אחת על תחום שלם.</b> הצלחה מרשימה במשימה אחת לא מבטיחה דבר על משימה דומה.</li>
</ol>

{id:"l3",title:"Vibe Coding: מה זה, ומה הסכנה",minutes:7,html:`
<h2>המונח שכבש את התעשייה</h2>
<p><span class="term">אנדריי קרפתי <span class="en">(Andrej Karpathy)</span></span> — ממייסדי OpenAI ולשעבר מנהל ה-AI בטסלה — טבע את המונח <span class="term">vibe coding</span>: גישה שבה "נכנעים לתחושה, מאמצים את האקספוננציאלי, ושוכחים שהקוד בכלל קיים".</p>
<p>הרעיון: לא קוראים את הקוד. מתארים מה רוצים, מריצים, ואם לא עובד — מתארים שוב. הקוד הופך לתיבה שחורה.</p>
<p>קרפתי עצמו תיאר את השינוי אצלו: <b>מ-80% כתיבה ידנית ו-20% סוכנים — ל-80% סוכנים ו-20% תיקונים ידניים</b>, בתוך חודש.</p>
<h2>ההבחנה של סיימון וויליסון</h2>
<p><span class="term">סיימון וויליסון <span class="en">(Simon Willison)</span></span>, מפתח ותיק ומחשובי הכותבים על שימוש מעשי ב-LLM, הוסיף את ההבחנה החשובה ביותר בדיון:</p>
<div class="box pro"><b>🎓 הקו שמפריד</b>אם מודל כתב כל שורה — אבל אתה <b>סקרת, בדקת והבנת</b> את התוצאה — זה לא vibe coding. זה שימוש ב-AI ככלי עוצמתי, ואתה עדיין אחראי. Vibe coding אמיתי הוא כשלא בדקת ולא הבנת.</div>
<h2>מתי כל גישה לגיטימית</h2>
<div class="tbl-wrap"><table class="cmp">
<tr><th>✅ Vibe coding בסדר גמור</th><th>❌ מסוכן</th></tr>
<tr><td>ניסוי, אב-טיפוס, "בוא נראה אם זה אפשרי"</td><td>כל דבר שמטפל בכסף או בנתונים אישיים</td></tr>
<tr><td>כלי אישי שרק אתה משתמש בו</td><td>מוצר שלקוחות תלויים בו</td></tr>
<tr><td>למידה והתנסות</td><td>קוד שאתה צריך לתחזק לאורך זמן</td></tr>
<tr><td>משהו שאם יישבר — לא נורא</td><td>משהו שאם יישבר — מישהו נפגע</td></tr>
</table></div>
<div class="box warn"><b>⚠️ הסיכון האמיתי</b>קוד שאיש לא הבין הוא קוד שאיש לא יכול לתקן. ברגע שמשהו נשבר — ואם הוא רץ מספיק זמן, הוא יישבר — אתה תלוי לחלוטין ב-AI כדי להבין את יצירתך שלך.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>קח משהו שקלוד בנה לך ובקש: "הסבר לי שורה-שורה מה הקוד הזה עושה, בעברית פשוטה". זו הדרך הזולה ביותר לצאת מ-vibe coding אל שליטה.</div>
`},

{id:"l4",title:"קונצנזוס המקצוענים",minutes:6,html:`
<h2>מה שמסכימים עליו — מהצוותים ועד הקהילה</h2>
<p>מהמדריכים הרשמיים, מטיפי המשתמשים המתקדמים ומהמומחים הבולטים עולים חמישה עקרונות שחוזרים בכל מקום:</p>
<h3>1. מפרטים ופרומפטים הם נכסי עבודה</h3>
<p>לא הודעות חד-פעמיות. שומרים אותם, משפרים אותם, בודקים אותם בגרסאות. SPEC.md, CLAUDE.md, Skills — כולם ביטויים של העיקרון הזה.</p>
<h3>2. לולאות מובנות מנצחות שיחה חופשית</h3>
<p>חקור ← תכנן ← בצע ← אמת. לא "בוא נדבר ונראה לאן זה מוביל".</p>
<h3>3. אימות הוא לא שלב אחרון — הוא התשתית</h3>
<p>זהו הנושא שחוזר בכל מקור בלי יוצא מן הכלל. אם אין דרך לאמת — אין דרך לסמוך.</p>
<h3>4. הגן על העבודה שלך</h3>
<p>ענפים, גרסאות, גיבויים, ארגזי חול. עבודה מהירה עם AI מייצרת שינויים מהר — ההגנות צריכות להדביק את הקצב.</p>
<h3>5. אתה נשאר האחראי</h3>
<p>מולליק מנסח זאת כ"היה האדם בלולאה". אתה חותם על התוצר, ולכן אתה בודק אותו.</p>
<div class="box pro"><b>🎓 מה שכולם מסכימים עליו — ולא במקרה</b>שים לב שכל חמשת העקרונות מתכנסים לאותה נקודה: <b>מהירות בלי מנגנוני בקרה היא חוב, לא רווח.</b> המקצוענים אינם מהירים כי הם מדלגים על בדיקות — הם מהירים כי הבדיקות שלהם אוטומטיות.</div>
<div class="box try"><b>🚀 נסה עכשיו</b>דרג את עצמך מ-1 עד 5 בכל אחד מחמשת העקרונות. הנמוך ביותר הוא המקום שבו יש לך הכי הרבה מה להרוויח.</div>
`},

{id:"l5",title:"בניית מסגרת העבודה האישית שלך",minutes:6,html:`
<h2>מכללים של אחרים לשיטה שלך</h2>
<p>הקורס נתן לך עשרות עקרונות. הרמה הבאה היא להפוך אותם ל<b>שיטה אישית</b> — סט החלטות שאתה מקבל אוטומטית, בלי לחשוב.</p>
<h2>ארבע שאלות שיוצרות את המסגרת</h2>
<h3>1. מה אני מאציל ומה לא?</h3>
<p>קבע לעצמך גבול ברור. למשל: "טיוטות, מחקר, ניתוח וקוד — מאציל. החלטות על אנשים, על כסף ועל ערכים — לא."</p>
<h3>2. מתי אני קנטאור ומתי סייבורג?</h3>
<p>למשל: "משימות מוגדרות היטב — שיגור לקוורק. משימות שהדרך בהן מתגלה — סייבורג בקלוד קוד."</p>
<h3>3. מה רמת האימות שלי לכל סוג תוצר?</h3>
<div class="tbl-wrap"><table class="cmp">
<tr><th>סוג תוצר</th><th>רמת אימות</th></tr>
<tr><td>פנימי, לעצמי</td><td>קריאה מהירה</td></tr>
<tr><td>יוצא בשמי לאדם אחר</td><td>קריאה מלאה + עריכה</td></tr>
<tr><td>מכיל עובדות, מספרים או ציטוטים</td><td>אימות במקור חיצוני</td></tr>
<tr><td>מקצועי (בריאות/משפט/כסף)</td><td>בעל מקצוע אנושי מכריע</td></tr>
</table></div>
<h3>4. מתי אני עוצר?</h3>

<li><span class="kbd">/effort low|medium|high|xhigh|max</span> — <b>חוגת עומק החשיבה</b>. הצוות של Anthropic עובד ב-high כברירת מחדל ועובר ל-xhigh לדיבוג מורכב, בלי לשלם את מלוא העלות של max.</li>
<li><span class="kbd">/model</span> — החלפת מודל ושמירתו כברירת מחדל</li>
<li><span class="kbd">/fast</span> — מצב מהיר</li>
<li><span class="kbd">/advisor opus</span> — <b>יועץ:</b> מודל שני שנותן חוות דעת על החלטות קשות</li>
</ul>
<div class="box pro"><b>🎓 שרשור כישורים</b>אפשר לשרשר עד <b>שישה כישורים בהודעה אחת</b>: <span class="kbd">/code-review /simplify תקן את מה שמצאתם</span>. מעט מאוד משתמשים יודעים שזה אפשרי.</div>
<div class="box try"><b>🚀 נסה עכשיו (דורש מחשב)</b>הקלד <span class="kbd">/</span> בסשן וגלול דרך כל הרשימה. סמן שלוש פקודות שלא הכרת ונסה אותן היום.</div>
`,
